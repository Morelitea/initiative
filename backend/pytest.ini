[pytest]
# Pytest configuration for Initiative backend tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers - fail on unknown markers
    --strict-markers
    # Show warnings
    -W default

# Parallelism is per-invocation, not an addopt, because the right answer depends
# on how much work the run has. Every worker pays the app import and its own
# session setup, and each gets its own database and role prefix (conftest.py):
#
#   pytest -n auto app/      a big run amortises that — measured 6m29s -> 1m52s
#                            on app/services (1363 tests, 16 cores)
#   pytest path/to/one_test.py
#                            a targeted run does not — 16 workers spend longer
#                            starting up than the tests take. Serial is the
#                            default for exactly this case.
#
# CI passes -n auto for the whole suite; scripts/test-changed.sh does the same
# when a shared-infrastructure change makes it run everything.

# Coverage is opt-in, not part of addopts: instrumenting every import roughly
# doubles the wall time of a targeted run, and nothing consumes the report on
# the normal path. Ask for it when you want it:
#   pytest --cov=app --cov-config=.coveragerc --cov-report=term-missing --cov-branch

# Test paths
testpaths = app alembic

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for API endpoints
    service: Tests for service layer
    auth: Authentication and authorization tests
    database: Database model and query tests
    slow: Tests that take longer to run

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info

# Minimum Python version
minversion = 3.11
