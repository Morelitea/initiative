<heatmap if="model.kind == 'matrix'" :cells="model.cells" :max="model.max" :x-labels="model.xLabels" :y-labels="model.yLabels" :tone="model.tone" />
<div else class="flex h-full w-full items-center justify-center p-4 text-center">
  <p class="text-muted-foreground text-sm">{{ model.message }}</p>
</div>
