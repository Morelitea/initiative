<!-- A task on a board. Only the title opens the task; the rest of the card is the card. -->
<article
  class="space-y-3 rounded-lg border bg-card p-3 shadow-sm"
  :class="{ 'opacity-50': task.archived_at != null }"
>
  <div class="flex w-full min-w-0 flex-col items-start gap-1 text-left">
    <part name="title" />
    <!-- Two lines of words, not a picture that fills the card. -->
    <part
      name="description"
      if="task.description_excerpt != null && task.description_excerpt != ''"
      class="wrap-break-word line-clamp-2 w-full min-w-0 text-muted-foreground text-sm"
    />
    <div class="wrap-break-word w-full min-w-0 space-y-1 text-muted-foreground text-xs">
      <part name="assignees" if="size(task.assignees) > 0" />
      <part name="startDate" if="task.start_date != null" />
      <part name="dueDate" if="task.due_date != null" />
      <part name="recurrence" if="task.recurrence != null" />
    </div>
    <part
      name="checklist"
      if="task.checklist_progress != null && task.checklist_progress.total > 0"
      class="w-full pt-1"
    />
  </div>
  <div class="flex min-w-0 flex-wrap gap-2">
    <part name="priority" />
    <part name="comments" if="task.comment_count > 0" />
    <part name="blockers" if="task.blocked_by_open_count > 0" />
    <part name="tags" />
    <part name="properties" />
    <blocks area="inline" />
  </div>
</article>
