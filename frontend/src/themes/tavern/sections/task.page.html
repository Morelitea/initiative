<!-- The task page: the task's fields beside what it is made of and waiting on, then its thread. -->
<div class="space-y-6">
  <part name="breadcrumb" />
  <div class="space-y-3">
    <div class="flex flex-wrap items-center gap-3">
      <part name="byline" class="ml-auto" />
    </div>
  </div>

  <!-- Two columns once there is room for both at their full 25rem, one
       otherwise: the tracks decide from the page's own width, and
       min(25rem,100%) lets one column shrink on a phone. -->
  <div class="grid gap-6 [grid-template-columns:repeat(auto-fit,minmax(min(25rem,100%),1fr))]">
    <div class="rounded-xl border bg-card text-card-foreground shadow-sm">
      <div class="p-6">
        <part name="notice" />
        <div class="space-y-6">
          <section class="space-y-4">
            <part name="title" />
            <part name="description" />
          </section>
          <section class="space-y-4">
            <h2 class="font-medium text-muted-foreground text-xs uppercase tracking-wide">{{ t('tasks:taskForm.sections.tracking') }}</h2>
            <div class="grid grid-cols-pair gap-4">
              <part name="status" />
              <part name="priority" />
            </div>
          </section>
          <section class="space-y-4">
            <h2 class="font-medium text-muted-foreground text-xs uppercase tracking-wide">{{ t('tasks:taskForm.sections.schedule') }}</h2>
            <part name="dates" />
            <part name="recurrence" />
          </section>
          <section class="space-y-4">
            <h2 class="font-medium text-muted-foreground text-xs uppercase tracking-wide">{{ t('tasks:taskForm.sections.people') }}</h2>
            <div class="grid grid-cols-pair gap-4">
              <part name="assignees" />
              <part name="tags" />
            </div>
          </section>
          <section class="space-y-4">
            <h2 class="font-medium text-muted-foreground text-xs uppercase tracking-wide">{{ t('properties:title') }}</h2>
            <part name="properties" />
          </section>
          <part name="actions" class="flex flex-wrap items-center gap-3" />
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <part name="checklist" />
      <part name="relations" />
    </div>
  </div>

  <!-- The thread gets the whole row: in a column this narrow every reply wraps. -->
  <part name="case" />
  <part name="comments" />
</div>
