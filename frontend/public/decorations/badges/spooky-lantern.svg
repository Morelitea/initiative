<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     shape-rendering="crispEdges" role="presentation">
  <title>Jack-o'-lantern</title>
  <circle cx="24" cy="24" r="23" fill="#140A1F"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#3A1F52" stroke-width="2"/>
  <!-- Stem. -->
  <rect x="22" y="7" width="4" height="5" fill="#3F6B2B"/>
  <rect x="25" y="8" width="3" height="2" fill="#2D4E1E"/>
  <!-- Body, with the ridges a pumpkin is read by. -->
  <path d="M24 11 L34 14 L38 23 L34 33 L24 36 L14 33 L10 23 L14 14 Z" fill="#E8730C"/>
  <path d="M24 11 L18 14 L16 23 L18 33 L24 36 Z" fill="#F58A22"/>
  <path d="M31 13 L35 23 L31 34 L28 35 L32 23 L28 12 Z" fill="#C25A08"/>
  <!-- Cut out, and lit from the inside. -->
  <g fill="#FFD24A">
    <path d="M15 19 L21 19 L18 25 Z"/>
    <path d="M33 19 L27 19 L30 25 Z"/>
    <path d="M15 27 L33 27 L31 32 L27 29 L24 32 L21 29 L17 32 Z"/>
  </g>
  <!-- A thread of web across the corner, which is the pack's whole idea. -->
  <g stroke="#B9A7D6" stroke-opacity=".55" stroke-width="1" fill="none">
    <path d="M4 12 L14 4"/><path d="M5 16 L18 4"/>
    <path d="M6 6 Q11 9 9 15"/><path d="M9 4 Q14 8 12 14"/>
  </g>
</svg>
