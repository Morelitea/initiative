<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>d20</title>
  <!-- A die is flat faces meeting at edges, so the facets stay straight; what
       changes is that they are shaded rather than stepped. -->
  <defs>
    <linearGradient id="upA" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0%" stop-color="#A98CF0"/><stop offset="100%" stop-color="#7B5AD0"/>
    </linearGradient>
    <linearGradient id="upB" x1="1" y1="0" x2=".3" y2="1">
      <stop offset="0%" stop-color="#9276E2"/><stop offset="100%" stop-color="#6A4AC0"/>
    </linearGradient>
    <linearGradient id="face" x1=".3" y1="0" x2=".7" y2="1">
      <stop offset="0%" stop-color="#F2EEFF"/><stop offset="100%" stop-color="#CFC2F5"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#1E1B4B"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#3A2270" stroke-width="2"/>
  <path d="M24 5 L40 14 L40 33 L24 42 L8 33 L8 14 Z" fill="#3A2270"/>
  <path d="M8 14 L14 29 L24 40 L10 31 Z" fill="#5B21B6"/>
  <path d="M40 14 L34 29 L24 40 L38 31 Z" fill="#452B85"/>
  <path d="M14 29 L24 40 L34 29 L24 34 Z" fill="#6D4FC4"/>
  <path d="M24 7 L10 14 L14 27 Z" fill="url(#upA)"/>
  <path d="M24 7 L38 14 L34 27 Z" fill="url(#upB)"/>
  <path d="M24 9 L35 27 L13 27 Z" fill="url(#face)"/>
  <path d="M24 9 L35 27 L13 27 Z" fill="none" stroke="#B8A6EA" stroke-width=".6"/>
  <path d="M24 7 L24 9" stroke="#B8A6EA" stroke-width=".5" opacity=".6"/>
  <!-- The face turned up. -->
  <g fill="none" stroke="#3A2270" stroke-width="1.5" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M18.4 18 C18.4 16.7 19.4 15.9 20.6 15.9 C21.8 15.9 22.8 16.7 22.8 18
             C22.8 20 18.4 21.9 18.2 24.3 L23 24.3"/>
    <ellipse cx="27.6" cy="20.1" rx="2.3" ry="4.2"/>
  </g>
  <path d="M12.6 12.4 C15.4 10.4 18 9 20.6 8.2" fill="none" stroke="#D8CCFA"
        stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
</svg>
