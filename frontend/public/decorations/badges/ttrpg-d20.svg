<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     shape-rendering="crispEdges" role="presentation">
  <title>d20</title>
  <!-- The die a tabletop player recognises on sight, drawn at the size it is
       actually shown. The app's rolling die (components/effects/svg/PixelD20)
       is a 19x19 grid whose one-pixel facets turn to mush when shrunk to this
       badge, so this keeps its palette and its silhouette and spends the few
       pixels available on the facets that say "twenty-sided". -->
  <circle cx="12" cy="12" r="11" fill="#1E1B4B"/>
  <!-- Silhouette. -->
  <path d="M12 2 L20 7 L20 16 L12 21 L4 16 L4 7 Z" fill="#3A2270"/>
  <!-- Lower facets: the die's shaded side. -->
  <path d="M4 7 L7 14 L12 20 L5 15.5 Z" fill="#5B21B6"/>
  <path d="M19 7 L17 14 L12 20 L19 15.5 Z" fill="#4C2F8F"/>
  <!-- Upper facets. -->
  <path d="M12 3 L5 7 L7 13 Z" fill="#8B6EDE"/>
  <path d="M12 3 L19 7 L17 13 Z" fill="#7C5BD0"/>
  <!-- The face turned up, brightest, the one you would read a number off. -->
  <path d="M12 4 L17 13 L7 13 Z" fill="#DDD6FE"/>
</svg>
