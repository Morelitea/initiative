<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Belt knot</title>
  <!-- Black on black says nothing, so the belt is drawn by its edges: every
       band has a lit top and a shadowed underside, and the knot is two of them
       crossing. -->
  <circle cx="24" cy="24" r="23" fill="#3A2716"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#8A6034" stroke-width="2"/>
  <!-- The belt, round the waist. -->
  <path d="M2.6 17.4 C13 15.4 35 15.4 45.4 17.4 L45.4 24 C35 22 13 22 2.6 24 Z" fill="#1B1B21"/>
  <path d="M2.6 17.4 C13 15.4 35 15.4 45.4 17.4 L45.4 18.8 C35 16.8 13 16.8 2.6 18.8 Z"
        fill="#3E3E4A"/>
  <path d="M2.6 22.6 C13 20.6 35 20.6 45.4 22.6 L45.4 24 C35 22 13 22 2.6 24 Z" fill="#0D0D11"/>
  <!-- The two ends. -->
  <path d="M17.6 29.4 C16.8 35 15.8 39.6 14.2 43.6 L20.6 44.8 C21.6 40 22.2 34.6 22.4 29.6 Z"
        fill="#1B1B21"/>
  <path d="M17.6 29.4 C17.2 32 16.8 34.2 16.2 36.4 L21.4 37.2 C21.8 34.6 22.2 32 22.4 29.6 Z"
        fill="#2A2A33"/>
  <path d="M25.6 29.6 C25.8 34.6 26.4 40 27.4 44.8 L33.8 43.6 C32.2 39.6 31.2 35 30.4 29.4 Z"
        fill="#141419"/>
  <path d="M25.6 29.6 C25.8 32 26.2 34.6 26.6 37.2 L31.8 36.4 C31.2 34.2 30.8 32 30.4 29.4 Z"
        fill="#232329"/>
  <!-- The knot: one band through another. -->
  <path d="M13.4 19.6 C13.4 16.4 34.6 16.4 34.6 19.6 L34.6 26 C34.6 29.2 13.4 29.2 13.4 26 Z"
        fill="#22222A"/>
  <path d="M13.4 19.6 C13.4 16.4 34.6 16.4 34.6 19.6 C34.6 21.6 13.4 21.6 13.4 19.6 Z"
        fill="#3A3A46"/>
  <path d="M13.4 24.4 C16 26 32 26 34.6 24.4 L34.6 26 C34.6 29.2 13.4 29.2 13.4 26 Z"
        fill="#141419"/>
  <path d="M19.4 14.6 C19.4 13.4 28.6 13.4 28.6 14.6 L28.6 30.4 C28.6 31.8 19.4 31.8 19.4 30.4 Z"
        fill="#121216"/>
  <path d="M19.4 14.6 C19.4 13.4 28.6 13.4 28.6 14.6 L28.6 16.2 C26 15.2 22 15.2 19.4 16.2 Z"
        fill="#41414E"/>
  <path d="M19.4 30.4 C22 31.4 26 31.4 28.6 30.4 L28.6 31 C28.6 32.2 19.4 32.2 19.4 31 Z"
        fill="#0D0D11"/>
  <path d="M19.4 14.6 C19.4 13.4 28.6 13.4 28.6 14.6 L28.6 30.4 C28.6 31.8 19.4 31.8 19.4 30.4 Z"
        fill="none" stroke="#54545F" stroke-width=".6"/>
</svg>
