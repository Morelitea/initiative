<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     shape-rendering="crispEdges" role="presentation">
  <title>Cassette</title>
  <circle cx="24" cy="24" r="23" fill="#140F1F"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#2C2140" stroke-width="2"/>
  <!-- The shell. -->
  <rect x="7" y="14" width="34" height="21" fill="#F0567A"/>
  <rect x="7" y="14" width="34" height="3" fill="#F782A0"/>
  <rect x="7" y="32" width="34" height="3" fill="#C43C5C"/>
  <!-- The window, and the tape wound across it. -->
  <rect x="11" y="18" width="26" height="10" fill="#241A33"/>
  <rect x="13" y="20" width="22" height="6" fill="#3A2B52"/>
  <circle cx="18" cy="23" r="4" fill="#140F1F"/>
  <circle cx="30" cy="23" r="4" fill="#140F1F"/>
  <circle cx="18" cy="23" r="1.5" fill="#F0567A"/>
  <circle cx="30" cy="23" r="1.5" fill="#F0567A"/>
  <!-- The label strip and the two drive holes. -->
  <rect x="11" y="30" width="26" height="3" fill="#FFE9A3"/>
  <rect x="16" y="31" width="4" height="1" fill="#C43C5C"/>
  <rect x="22" y="31" width="8" height="1" fill="#C43C5C"/>
</svg>
