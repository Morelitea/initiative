<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Marquee</title>
  <!-- Out front, with the letters already up. -->
  <style>
    .bulb { animation: chase 1.6s steps(1, end) infinite }
    .b1 { animation-delay: -.4s } .b2 { animation-delay: -.8s } .b3 { animation-delay: -1.2s }
    @keyframes chase { 0%,24% { fill: #FFE9A8; opacity: 1 }
                       25%,100% { fill: #8A6A2A; opacity: .55 } }
    .neon { animation: hum 3.4s ease-in-out infinite alternate }
    @keyframes hum { from { opacity: .72 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .bulb { animation: none; fill: #FFE9A8 } .neon { animation: none } }
  </style>
  <defs>
    <linearGradient id="marqface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2438"/><stop offset="100%" stop-color="#1E1424"/>
    </linearGradient>
    <linearGradient id="marqtrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8443A"/><stop offset="100%" stop-color="#8E1C22"/>
    </linearGradient>
    <radialGradient id="spill" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="#150F1C"/>
  <ellipse cx="80" cy="34" rx="72" ry="14" fill="url(#spill)"/>
  <!-- The board. -->
  <path d="M8 6 L152 6 L152 34 L8 34 Z" fill="url(#marqtrim)"/>
  <path d="M11 9 L149 9 L149 31 L11 31 Z" fill="url(#marqface)"/>
  <!-- Letters, the kind somebody slides on with a pole. -->
  <g fill="#F2E8D6">
    <rect x="30" y="13.4" width="8" height="2.2" rx=".4"/><rect x="41" y="13.4" width="14" height="2.2" rx=".4"/>
    <rect x="58" y="13.4" width="6" height="2.2" rx=".4"/><rect x="67" y="13.4" width="18" height="2.2" rx=".4"/>
    <rect x="88" y="13.4" width="10" height="2.2" rx=".4"/><rect x="101" y="13.4" width="24" height="2.2" rx=".4"/>
    <rect x="24" y="18.6" width="20" height="2.2" rx=".4"/><rect x="47" y="18.6" width="8" height="2.2" rx=".4"/>
    <rect x="58" y="18.6" width="16" height="2.2" rx=".4"/><rect x="77" y="18.6" width="12" height="2.2" rx=".4"/>
    <rect x="92" y="18.6" width="22" height="2.2" rx=".4"/><rect x="117" y="18.6" width="14" height="2.2" rx=".4"/>
  </g>
  <g fill="#E8C43A" class="neon">
    <rect x="36" y="24" width="16" height="2.6" rx=".5"/><rect x="55" y="24" width="28" height="2.6" rx=".5"/>
    <rect x="86" y="24" width="10" height="2.6" rx=".5"/><rect x="99" y="24" width="24" height="2.6" rx=".5"/>
  </g>
  <!-- And the bulbs all the way round. -->
  <g><circle class="bulb b0" cx="14.0" cy="9.4" r="1.1"/><circle class="bulb b1" cx="20.5" cy="9.4" r="1.1"/><circle class="bulb b2" cx="27.0" cy="9.4" r="1.1"/><circle class="bulb b3" cx="33.5" cy="9.4" r="1.1"/><circle class="bulb b0" cx="40.0" cy="9.4" r="1.1"/><circle class="bulb b1" cx="46.5" cy="9.4" r="1.1"/><circle class="bulb b2" cx="53.0" cy="9.4" r="1.1"/><circle class="bulb b3" cx="59.5" cy="9.4" r="1.1"/><circle class="bulb b0" cx="66.0" cy="9.4" r="1.1"/><circle class="bulb b1" cx="72.5" cy="9.4" r="1.1"/><circle class="bulb b2" cx="79.0" cy="9.4" r="1.1"/><circle class="bulb b3" cx="85.5" cy="9.4" r="1.1"/><circle class="bulb b0" cx="92.0" cy="9.4" r="1.1"/><circle class="bulb b1" cx="98.5" cy="9.4" r="1.1"/><circle class="bulb b2" cx="105.0" cy="9.4" r="1.1"/><circle class="bulb b3" cx="111.5" cy="9.4" r="1.1"/><circle class="bulb b0" cx="118.0" cy="9.4" r="1.1"/><circle class="bulb b1" cx="124.5" cy="9.4" r="1.1"/><circle class="bulb b2" cx="131.0" cy="9.4" r="1.1"/><circle class="bulb b3" cx="137.5" cy="9.4" r="1.1"/><circle class="bulb b0" cx="144.0" cy="9.4" r="1.1"/><circle class="bulb b2" cx="14.0" cy="30.6" r="1.1"/><circle class="bulb b3" cx="20.5" cy="30.6" r="1.1"/><circle class="bulb b0" cx="27.0" cy="30.6" r="1.1"/><circle class="bulb b1" cx="33.5" cy="30.6" r="1.1"/><circle class="bulb b2" cx="40.0" cy="30.6" r="1.1"/><circle class="bulb b3" cx="46.5" cy="30.6" r="1.1"/><circle class="bulb b0" cx="53.0" cy="30.6" r="1.1"/><circle class="bulb b1" cx="59.5" cy="30.6" r="1.1"/><circle class="bulb b2" cx="66.0" cy="30.6" r="1.1"/><circle class="bulb b3" cx="72.5" cy="30.6" r="1.1"/><circle class="bulb b0" cx="79.0" cy="30.6" r="1.1"/><circle class="bulb b1" cx="85.5" cy="30.6" r="1.1"/><circle class="bulb b2" cx="92.0" cy="30.6" r="1.1"/><circle class="bulb b3" cx="98.5" cy="30.6" r="1.1"/><circle class="bulb b0" cx="105.0" cy="30.6" r="1.1"/><circle class="bulb b1" cx="111.5" cy="30.6" r="1.1"/><circle class="bulb b2" cx="118.0" cy="30.6" r="1.1"/><circle class="bulb b3" cx="124.5" cy="30.6" r="1.1"/><circle class="bulb b0" cx="131.0" cy="30.6" r="1.1"/><circle class="bulb b1" cx="137.5" cy="30.6" r="1.1"/><circle class="bulb b2" cx="144.0" cy="30.6" r="1.1"/><circle class="bulb b0" cx="12.4" cy="12.4" r="1.1"/><circle class="bulb b1" cx="12.4" cy="16.4" r="1.1"/><circle class="bulb b2" cx="12.4" cy="20.4" r="1.1"/><circle class="bulb b3" cx="12.4" cy="24.4" r="1.1"/><circle class="bulb b0" cx="12.4" cy="28.4" r="1.1"/><circle class="bulb b1" cx="147.6" cy="12.4" r="1.1"/><circle class="bulb b2" cx="147.6" cy="16.4" r="1.1"/><circle class="bulb b3" cx="147.6" cy="20.4" r="1.1"/><circle class="bulb b0" cx="147.6" cy="24.4" r="1.1"/><circle class="bulb b1" cx="147.6" cy="28.4" r="1.1"/></g>
</svg>
