<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Street party</title>
  <!-- The evening a street closes itself and everybody brings a dish. -->
  <style>
    .sway { animation: breeze 7s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 0 }
    .s2 { animation-duration: 9s; animation-delay: -3s }
    .s3 { animation-duration: 8s; animation-delay: -5s }
    @keyframes breeze { from { transform: rotate(-1.6deg) } to { transform: rotate(1.6deg) } }
    .bulb { animation: glow 4s ease-in-out infinite }
    .g2 { animation-delay: -1.3s } .g3 { animation-delay: -2.6s }
    @keyframes glow { 0%,100% { opacity: 1 } 50% { opacity: .68 } }
    @media (prefers-reduced-motion: reduce) { .sway, .bulb { animation: none } }
  </style>
  <defs>
    <linearGradient id="dusk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B46"/>
      <stop offset="60%" stop-color="#4A3468"/>
      <stop offset="100%" stop-color="#C97A54"/>
    </linearGradient>
    <radialGradient id="lampglow" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#FFD79A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#dusk2)"/>
  <!-- Buildings either side, leaning in. -->
  <g fill="#241C42">
    <path d="M0 40 L0 4 L26 4 L26 40 Z"/>
    <path d="M134 40 L134 2 L160 2 L160 40 Z"/>
    <path d="M26 40 L26 14 L40 14 L40 40 Z"/>
    <path d="M120 40 L120 12 L134 12 L134 40 Z"/>
  </g>
  <g fill="#FFD79A">
    <rect class="bulb" x="5" y="9" width="3" height="3.6" rx=".5"/>
    <rect class="bulb g2" x="13" y="9" width="3" height="3.6" rx=".5" opacity=".7"/>
    <rect class="bulb g3" x="5" y="17" width="3" height="3.6" rx=".5" opacity=".55"/>
    <rect class="bulb" x="19" y="17" width="3" height="3.6" rx=".5" opacity=".8"/>
    <rect class="bulb g2" x="140" y="7" width="3" height="3.6" rx=".5"/>
    <rect class="bulb g3" x="150" y="7" width="3" height="3.6" rx=".5" opacity=".7"/>
    <rect class="bulb" x="145" y="15" width="3" height="3.6" rx=".5" opacity=".6"/>
    <rect class="bulb g2" x="30" y="19" width="2.6" height="3.2" rx=".5" opacity=".7"/>
    <rect class="bulb" x="126" y="17" width="2.6" height="3.2" rx=".5" opacity=".7"/>
  </g>
  <!-- Three runs of bunting, strung across. -->
  <g class="sway">
    <path d="M4 6 C40 15 120 15 156 6" fill="none" stroke="#E8DCC0" stroke-width=".5"/>
    <g>
      <path d="M14 8.6 L20 9.4 L17 14.4 Z" fill="#E8544C"/>
      <path d="M26 10.4 L32 11 L29 16 Z" fill="#F2B33D"/>
      <path d="M38 11.6 L44 12 L41 17 Z" fill="#4C9E5A"/>
      <path d="M50 12.4 L56 12.6 L53 17.6 Z" fill="#3E7CC8"/>
      <path d="M62 12.8 L68 13 L65 18 Z" fill="#B45AC8"/>
      <path d="M74 13 L80 13 L77 18 Z" fill="#E8544C"/>
      <path d="M86 13 L92 12.8 L89 17.8 Z" fill="#F2B33D"/>
      <path d="M98 12.6 L104 12.4 L101 17.4 Z" fill="#4C9E5A"/>
      <path d="M110 12 L116 11.6 L113 16.6 Z" fill="#3E7CC8"/>
      <path d="M122 11 L128 10.4 L125 15.4 Z" fill="#B45AC8"/>
      <path d="M134 9.4 L140 8.6 L137 13.6 Z" fill="#E8544C"/>
    </g>
  </g>
  <g class="sway s2">
    <path d="M0 14 C40 23 120 23 160 14" fill="none" stroke="#E8DCC0" stroke-width=".5"/>
    <g>
      <path d="M8 16.4 L14 17.6 L11 22.6 Z" fill="#F2B33D"/>
      <path d="M20 18.4 L26 19.2 L23 24.2 Z" fill="#3E7CC8"/>
      <path d="M32 19.8 L38 20.4 L35 25.4 Z" fill="#E8544C"/>
      <path d="M44 20.8 L50 21.2 L47 26.2 Z" fill="#4C9E5A"/>
      <path d="M56 21.4 L62 21.6 L59 26.6 Z" fill="#B45AC8"/>
      <path d="M68 21.6 L74 21.7 L71 26.7 Z" fill="#F2B33D"/>
      <path d="M80 21.7 L86 21.6 L83 26.6 Z" fill="#3E7CC8"/>
      <path d="M92 21.4 L98 21.2 L95 26.2 Z" fill="#E8544C"/>
      <path d="M104 20.8 L110 20.4 L107 25.4 Z" fill="#4C9E5A"/>
      <path d="M116 19.8 L122 19.2 L119 24.2 Z" fill="#B45AC8"/>
      <path d="M128 18.4 L134 17.6 L131 22.6 Z" fill="#F2B33D"/>
      <path d="M140 16.4 L146 15.2 L143 20.2 Z" fill="#3E7CC8"/>
    </g>
  </g>
  <!-- Lanterns on the lower run. -->
  <g class="sway s3">
    <path d="M18 21 C60 28 100 28 142 21" fill="none" stroke="#E8DCC0" stroke-width=".5"/>
    <g>
      <ellipse class="bulb" cx="34" cy="26" rx="2.4" ry="3" fill="#E8544C"/>
      <ellipse class="bulb g2" cx="52" cy="27.4" rx="2.4" ry="3" fill="#F2B33D"/>
      <ellipse class="bulb g3" cx="70" cy="28" rx="2.4" ry="3" fill="#E8544C"/>
      <ellipse class="bulb" cx="88" cy="28" rx="2.4" ry="3" fill="#F2B33D"/>
      <ellipse class="bulb g2" cx="106" cy="27.4" rx="2.4" ry="3" fill="#E8544C"/>
      <ellipse class="bulb g3" cx="124" cy="26" rx="2.4" ry="3" fill="#F2B33D"/>
    </g>
    <g fill="#FFD79A" opacity=".18">
      <circle cx="34" cy="26" r="7"/><circle cx="52" cy="27.4" r="7"/><circle cx="70" cy="28" r="7"/>
      <circle cx="88" cy="28" r="7"/><circle cx="106" cy="27.4" r="7"/><circle cx="124" cy="26" r="7"/>
    </g>
  </g>
  <!-- The street. -->
  <path d="M0 32 L160 32 L160 40 L0 40 Z" fill="#2A2044"/>
  <ellipse cx="80" cy="34" rx="70" ry="6" fill="url(#lampglow)"/>
  <!-- Stalls and the people at them. -->
  <g fill="#181230">
    <path d="M44 32 L44 27 L68 27 L68 32 Z"/>
    <path d="M42 27 L70 27 L70 25.6 L42 25.6 Z"/>
    <path d="M92 32 L92 28 L114 28 L114 32 Z"/>
    <path d="M90 28 L116 28 L116 26.6 L90 26.6 Z"/>
  </g>
  <g fill="#120E26">
    <ellipse cx="30" cy="34" rx="2.6" ry="4.6"/><circle cx="30" cy="28.6" r="1.8"/>
    <ellipse cx="37" cy="34.6" rx="2.4" ry="4.2"/><circle cx="37" cy="29.6" r="1.6"/>
    <ellipse cx="78" cy="34.4" rx="2.8" ry="4.8"/><circle cx="78" cy="28.8" r="1.9"/>
    <ellipse cx="84" cy="35" rx="2.4" ry="4.2"/><circle cx="84" cy="30" r="1.6"/>
    <ellipse cx="122" cy="34.2" rx="2.6" ry="4.6"/><circle cx="122" cy="29" r="1.8"/>
    <ellipse cx="128" cy="34.8" rx="2.4" ry="4.2"/><circle cx="128" cy="29.8" r="1.6"/>
  </g>
</svg>
