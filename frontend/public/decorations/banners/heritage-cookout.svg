<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Cookout</title>
  <!-- The park at the good hour: the grill going, the speaker on, the table
       already set, and somebody's auntie holding court. -->
  <style>
    .smoke { animation: rise 9s ease-out infinite }
    .k2 { animation-delay: -3s } .k3 { animation-delay: -6s }
    @keyframes rise {
      0% { transform: translate(0,0) scale(.5); opacity: 0 }
      25% { opacity: .45 }
      100% { transform: translate(4px,-14px) scale(1.8); opacity: 0 }
    }
    .flame { animation: lick 1.6s ease-in-out infinite alternate;
             transform-box: fill-box; transform-origin: 50% 100% }
    @keyframes lick { from { transform: scaleY(.8) } to { transform: scaleY(1.15) } }
    .bulb { animation: warm 5s ease-in-out infinite }
    .b2 { animation-delay: -1.7s } .b3 { animation-delay: -3.4s }
    @keyframes warm { 0%,100% { opacity: 1 } 50% { opacity: .72 } }
    @media (prefers-reduced-motion: reduce) { .smoke, .flame, .bulb { animation: none } }
  </style>
  <defs>
    <linearGradient id="goldenhour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5FA8"/><stop offset="45%" stop-color="#E8985A"/>
      <stop offset="100%" stop-color="#F6C97E"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E7E42"/><stop offset="100%" stop-color="#2E5B34"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#goldenhour)"/>
  <circle cx="26" cy="17" r="6.4" fill="#FFE7B8" opacity=".85"/>
  <circle cx="26" cy="17" r="13" fill="#FFE7B8" opacity=".18"/>
  <!-- Trees, and the string of lights between them. -->
  <g fill="#2A4A2A">
    <ellipse cx="12" cy="12" rx="12" ry="9"/><ellipse cx="120" cy="9" rx="15" ry="10"/>
    <ellipse cx="150" cy="13" rx="11" ry="8"/>
  </g>
  <g fill="#3A2716">
    <path d="M10.6 12 L13.4 12 L13.4 24 L10.6 24 Z"/>
    <path d="M118.6 9 L121.4 9 L121.4 24 L118.6 24 Z"/>
  </g>
  <path d="M12 10 C40 20 90 20 120 8" fill="none" stroke="#3A2716" stroke-width=".5"/>
  <g fill="#FFE7B8">
    <circle class="bulb" cx="30" cy="14.6" r=".9"/><circle class="bulb b2" cx="46" cy="17" r=".9"/>
    <circle class="bulb b3" cx="62" cy="18.4" r=".9"/><circle class="bulb" cx="78" cy="19" r=".9"/>
    <circle class="bulb b2" cx="94" cy="18.4" r=".9"/><circle class="bulb b3" cx="108" cy="16" r=".9"/>
  </g>
  <!-- Grass. -->
  <path d="M0 22 C30 20.6 130 20.6 160 22 L160 40 L0 40 Z" fill="url(#lawn)"/>
  <g stroke="#3E6B36" stroke-width=".4" opacity=".5">
    <path d="M0 27 C40 26 120 26 160 27"/><path d="M0 33 C40 31.6 120 31.6 160 33"/>
  </g>
  <!-- The grill. -->
  <g>
    <g class="smoke" fill="#E8E2D6" opacity=".4">
      <circle cx="41" cy="16" r="2.2"/>
    </g>
    <g class="smoke k2" fill="#E8E2D6" opacity=".35">
      <circle cx="44" cy="17" r="1.8"/>
    </g>
    <g class="smoke k3" fill="#E8E2D6" opacity=".3">
      <circle cx="38.6" cy="17.6" r="1.6"/>
    </g>
    <path d="M32 22 L52 22 L50 30 L34 30 Z" fill="#2E2A26"/>
    <path d="M31 21 L53 21 L53 22.6 L31 22.6 Z" fill="#4E4842"/>
    <g class="flame" fill="#E8730C">
      <path d="M38 21 C36.6 18.6 37.4 16.6 39 15.4 C39.4 17.4 40.6 18 41.4 17
               C42.6 18.6 42.6 20 41.4 21 Z"/>
    </g>
    <g class="flame" fill="#FFC83D">
      <path d="M39.4 21 C38.6 19.4 39 18 40 17.2 C40.4 18.4 41 18.8 41.4 18.2
               C42 19.2 42 20.2 41.2 21 Z"/>
    </g>
    <g stroke="#6E6862" stroke-width=".5">
      <path d="M33 23.6 L51 23.6"/><path d="M33.4 25 L50.6 25"/><path d="M33.8 26.4 L50.2 26.4"/>
    </g>
    <g fill="#8A4A22">
      <ellipse cx="37" cy="24.2" rx="2.6" ry="1.1"/><ellipse cx="45" cy="25.4" rx="2.4" ry="1"/>
    </g>
    <path d="M35 30 L36 38 L34 38 Z" fill="#2E2A26"/>
    <path d="M49 30 L50 38 L48 38 Z" fill="#2E2A26"/>
  </g>
  <!-- The table, and what is on it. -->
  <g>
    <path d="M62 26.6 L114 26.6 L114 29 L62 29 Z" fill="#C4211C"/>
    <path d="M62 29 L114 29 L112.6 31 L63.4 31 Z" fill="#9E1815"/>
    <g fill="#E8E2D6">
      <rect x="65" y="27.2" width="4" height="1.2"/><rect x="73" y="27.2" width="4" height="1.2"/>
      <rect x="81" y="27.2" width="4" height="1.2"/><rect x="89" y="27.2" width="4" height="1.2"/>
      <rect x="97" y="27.2" width="4" height="1.2"/><rect x="105" y="27.2" width="4" height="1.2"/>
    </g>
    <path d="M66 31 L67 38 L65 38 Z" fill="#5A554E"/>
    <path d="M110 31 L111 38 L109 38 Z" fill="#5A554E"/>
    <!-- Foil trays, a jug of something red, and a stack of cups. -->
    <g>
      <path d="M66 26.6 L78 26.6 L77 23.4 L67 23.4 Z" fill="#C9C6BE"/>
      <path d="M66.6 24.6 L77.4 24.6 L77 23.4 L67 23.4 Z" fill="#E4E1D8"/>
      <path d="M82 26.6 L92 26.6 L91.2 23.8 L82.8 23.8 Z" fill="#C9C6BE"/>
      <path d="M82.6 25 L91.4 25 L91.2 23.8 L82.8 23.8 Z" fill="#E4E1D8"/>
    </g>
    <g>
      <path d="M96.4 26.6 L103.6 26.6 L103 19.6 L97 19.6 Z" fill="#E85A52" opacity=".85"/>
      <path d="M96.6 25.6 L103.4 25.6 L103 21 L97 21 Z" fill="#C4211C"/>
      <path d="M96.4 19.6 L103.6 19.6 L103.6 18.4 L96.4 18.4 Z" fill="#D8D4CC"/>
      <path d="M103.6 21 C105.6 21 106.4 22 106.4 23 C106.4 24 105.6 25 103.6 25" fill="none"
            stroke="#E85A52" stroke-width="1.1"/>
    </g>
    <g fill="#E8443A">
      <path d="M108 26.6 L112 26.6 L111.6 23.4 L108.4 23.4 Z"/>
      <path d="M108.2 24.8 L111.8 24.8 L111.6 23.4 L108.4 23.4 Z" fill="#F26A60"/>
    </g>
  </g>
  <!-- The speaker, and everybody. -->
  <g>
    <rect x="126" y="21" width="9" height="14" rx="1.4" fill="#2E2A26"/>
    <circle cx="130.5" cy="25.6" r="3" fill="#1A1816"/>
    <circle cx="130.5" cy="25.6" r="1.2" fill="#4E4842"/>
    <circle cx="130.5" cy="31.6" r="1.8" fill="#1A1816"/>
    <g fill="#E8B21C" opacity=".6">
      <path d="M137 24 C139 25.4 139 28.6 137 30" fill="none" stroke="#E8B21C" stroke-width=".7"/>
      <path d="M139.4 22.4 C142.4 24.6 142.4 29.4 139.4 31.6" fill="none" stroke="#E8B21C"
            stroke-width=".6" opacity=".7"/>
    </g>
  </g>
  <g>
    <g fill="#3A2716">
      <ellipse cx="56" cy="30" rx="3.2" ry="6"/><circle cx="56" cy="22.4" r="2.4"/>
      <ellipse cx="120" cy="31" rx="3" ry="5.6"/><circle cx="120" cy="23.8" r="2.2"/>
      <ellipse cx="88" cy="34" rx="2.6" ry="4.6"/><circle cx="88" cy="28.4" r="1.9"/>
    </g>
    <g fill="#5A3D22">
      <ellipse cx="56" cy="21.6" rx="2.6" ry="1.6"/><ellipse cx="120" cy="23" rx="2.4" ry="1.5"/>
      <ellipse cx="88" cy="27.6" rx="2" ry="1.3"/>
    </g>
  </g>
</svg>
