<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Tea garden</title>
  <!-- Terraces at the hour the mist has not lifted. -->
  <style>
    .drift { animation: roll 22s ease-in-out infinite alternate }
    .d2 { animation-duration: 28s; animation-delay: -8s }
    .near { animation: lean 9s ease-in-out infinite alternate;
            transform-box: view-box; transform-origin: 80px 40px }
    @keyframes lean { from { transform: skewX(-.7deg) } to { transform: skewX(.7deg) } }
    @media (prefers-reduced-motion: reduce) { .near { animation: none } }
    @keyframes roll { from { transform: translateX(-6px) } to { transform: translateX(6px) } }
    @media (prefers-reduced-motion: reduce) { .drift { animation: none } }
  </style>
