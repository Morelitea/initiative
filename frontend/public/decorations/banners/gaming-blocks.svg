     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Blocks</title>
  <!-- A world made of one shape, at the hour you should have logged off. -->
  <style>
    .flick { animation: burn 1.8s ease-in-out infinite alternate;
             transform-box: fill-box; transform-origin: 50% 100% }
    .f2 { animation-delay: -.7s }
    @keyframes burn { from { transform: scaleY(.86) } to { transform: scaleY(1.12) } }
    .drift { animation: pass 40s linear infinite }
    @keyframes pass { from { transform: translateX(-40px) } to { transform: translateX(200px) } }
    @media (prefers-reduced-motion: reduce) { .flick, .drift { animation: none } }
  </style>
