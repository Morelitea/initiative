.0" y="27.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w3" x="127.0" y="27.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w4" x="130.0" y="27.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w0" x="133.0" y="27.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w1" x="136.0" y="27.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w2" x="146.0" y="32.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w3" x="149.0" y="32.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w4" x="152.0" y="32.0" width="1.4" height="1.8" rx=".3"/><rect class="lit w0" x="155.0" y="32.0" width="1.4" height="1.8" rx=".3"/>
