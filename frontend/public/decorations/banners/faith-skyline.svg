<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Skyline</title>
  <!-- One street at the hour the lights come on: a pagoda, a church, a mosque, a
       synagogue, a shikhara, a gurdwara and a stupa, in the order they happen
       to stand in. -->
  <defs>
    <linearGradient id="skDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141F44"/><stop offset="42%" stop-color="#3E3468"/>
      <stop offset="74%" stop-color="#8E4E62"/><stop offset="100%" stop-color="#D0763E"/>
    </linearGradient>
  </defs>
  <style>
    .lit { fill: #FFD98A; animation: skOn 9s ease-in-out infinite }
    .w1 { animation-delay: -1.7s } .w2 { animation-delay: -3.4s }
    .w3 { animation-delay: -5.1s } .w4 { animation-delay: -6.8s }
    @keyframes skOn { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
    .tw { fill: #FFF6E0; animation: skTw 5s ease-in-out infinite alternate }
    .s1 { animation-delay: -1.3s } .s2 { animation-delay: -2.5s } .s3 { animation-delay: -3.8s }
    @keyframes skTw { from { opacity: .2 } to { opacity: .9 } }
    @media (prefers-reduced-motion: reduce) { .lit, .tw { animation: none } .lit { opacity: .8 } }
  </style>
  <rect width="160" height="40" fill="url(#skDusk)"/>
  <circle class="tw s0" cx="12" cy="5" r="0.35"/><circle class="tw s1" cx="30" cy="3" r="0.3"/><circle class="tw s2" cx="52" cy="6" r="0.4"/><circle class="tw s3" cx="74" cy="2.6" r="0.3"/><circle class="tw s0" cx="96" cy="5.4" r="0.35"/><circle class="tw s1" cx="118" cy="3" r="0.3"/><circle class="tw s2" cx="140" cy="6" r="0.4"/><circle class="tw s3" cx="156" cy="4" r="0.3"/><circle class="tw s0" cx="22" cy="9" r="0.25"/><circle class="tw s1" cx="64" cy="9.6" r="0.3"/><circle class="tw s2" cx="108" cy="8.6" r="0.25"/><circle class="tw s3" cx="132" cy="10" r="0.3"/>
  <g fill="#2A2748" opacity=".55">
    <path d="M0 30 L18 30 L24 26 L44 26 L50 30 L78 30 L84 27 L110 27 L116 30 L160 30 L160 40 L0 40 Z"/>
  </g>

