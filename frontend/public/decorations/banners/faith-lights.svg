<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Festival of lights</title>
  <!-- Lamps, candles and one that got away, because every one of them does
       this and nobody agrees on the date. -->
  <defs>
    <filter id="ltSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="ltNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140F22"/><stop offset="60%" stop-color="#2A162A"/>
      <stop offset="100%" stop-color="#48202A"/>
    </linearGradient>
  </defs>
  <style>
    .fl { animation: ltFlick 1.4s ease-in-out infinite alternate;
          transform-box: fill-box; transform-origin: 50% 100% }
    .f1 { animation-duration: 1.1s; animation-delay: -.4s }
    .f2 { animation-duration: 1.7s; animation-delay: -.8s }
    .f3 { animation-duration: 1.25s; animation-delay: -.2s }
    .f4 { animation-duration: 1.55s; animation-delay: -.6s }
    @keyframes ltFlick { from { transform: scale(.86, .8) } to { transform: scale(1.05, 1.1) } }
    .rise { animation: ltUp 13s ease-in infinite }
    .r1 { animation-duration: 17s; animation-delay: -6s }
    .r2 { animation-duration: 11s; animation-delay: -3s }
    .r3 { animation-duration: 15s; animation-delay: -9s }
    @keyframes ltUp { 0% { opacity: 0; transform: translateY(0) }
                      12% { opacity: .9 } 80% { opacity: .5 }
                      100% { opacity: 0; transform: translateY(-30px) } }
    @media (prefers-reduced-motion: reduce) { .fl, .rise { animation: none } }
  </style>
