<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Two-Spirit</title>
  <!-- Two feathers hanging over the six colours: the mark for people who are
       both, carried in one flag. -->
  <style>
    .hangA { animation: swayA 9s ease-in-out infinite alternate;
             transform-box: fill-box; transform-origin: 50% 0 }
    .hangB { animation: swayB 11s ease-in-out infinite alternate;
             transform-box: fill-box; transform-origin: 50% 0 }
    @keyframes swayA { from { transform: rotate(-2.4deg) } to { transform: rotate(2.4deg) } }
    @keyframes swayB { from { transform: rotate(2deg) } to { transform: rotate(-2.6deg) } }
    @media (prefers-reduced-motion: reduce) { .hangA, .hangB { animation: none } }
  </style>
  <defs>
    <linearGradient id="vaneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A1C"/><stop offset="42%" stop-color="#6B5238"/>
      <stop offset="62%" stop-color="#F2E8D6"/><stop offset="100%" stop-color="#D8CBB0"/>
    </linearGradient>
    <linearGradient id="vaneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A1C"/><stop offset="42%" stop-color="#6B5238"/>
      <stop offset="62%" stop-color="#F2E8D6"/><stop offset="100%" stop-color="#D8CBB0"/>
    </linearGradient>
    <radialGradient id="behind" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#000000" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0.00" width="160" height="6.69" fill="#E40303"/><rect x="0" y="6.67" width="160" height="6.69" fill="#FF8C00"/><rect x="0" y="13.33" width="160" height="6.69" fill="#FFED00"/><rect x="0" y="20.00" width="160" height="6.69" fill="#008026"/><rect x="0" y="26.67" width="160" height="6.69" fill="#004DFF"/><rect x="0" y="33.33" width="160" height="6.69" fill="#750787"/>
  <ellipse cx="80" cy="20" rx="30" ry="20" fill="url(#behind)"/>
  <!-- The cord they hang from. -->
  <path d="M62 2 C70 6 90 6 98 2" fill="none" stroke="#4A3620" stroke-width="1"/>
  <g class="hangA">
    <path d="M72 3.4 L72 6" stroke="#4A3620" stroke-width=".8"/>
    <g transform="translate(72 23) rotate(-7) scale(1.05)">
    <path d="M0 -17 C5 -12.4 7.4 -6 7.4 1 C7.4 7 5.4 12.4 0 16.6
             C-5.4 12.4 -7.4 7 -7.4 1 C-7.4 -6 -5 -12.4 0 -17 Z" fill="url(#vaneA)"/>
    <g stroke="#1A1410" stroke-width=".42" opacity=".42">
      <path d="M0 -13.4 L-4.4 -10"/><path d="M0 -10.4 L-5.6 -7"/><path d="M0 -7.4 L-6.4 -4"/>
      <path d="M0 -4.4 L-7 -1"/><path d="M0 -1.4 L-7.2 2"/><path d="M0 1.6 L-7 5"/>
      <path d="M0 4.6 L-6.4 8"/><path d="M0 7.6 L-5.4 11"/><path d="M0 10.6 L-3.6 13.6"/>
      <path d="M0 -13.4 L4.4 -10"/><path d="M0 -10.4 L5.6 -7"/><path d="M0 -7.4 L6.4 -4"/>
      <path d="M0 -4.4 L7 -1"/><path d="M0 -1.4 L7.2 2"/><path d="M0 1.6 L7 5"/>
      <path d="M0 4.6 L6.4 8"/><path d="M0 7.6 L5.4 11"/><path d="M0 10.6 L3.6 13.6"/>
    </g>
    <path d="M-3.4 8.4 C-2.4 7.6 -1.4 7.4 -.6 7.6 L-.6 10.6 C-1.6 10.4 -2.6 9.8 -3.4 8.4 Z"
          fill="#1A1410" opacity=".45"/>
    <path d="M-.6 -16 C.4 -8 .6 8 0 18.6 L-.6 18.6 C-1.2 8 -1 -8 -.6 -16 Z" fill="#EFE6D0"/>
    <path d="M-2.6 12.6 L2.6 12.6 L2.6 18 C2.6 19 1.6 19.4 0 19.4 C-1.6 19.4 -2.6 19 -2.6 18 Z"
          fill="#B4231F"/>
    <g stroke="#E8B21C" stroke-width=".8">
      <path d="M-2.5 14.4 L2.5 14.4"/><path d="M-2.6 16.4 L2.6 16.4"/>
    </g></g>
  </g>
  <g class="hangB">
    <path d="M88 3.4 L88 6" stroke="#4A3620" stroke-width=".8"/>
    <g transform="translate(88 23) rotate(7) scale(1.05)">
    <path d="M0 -17 C5 -12.4 7.4 -6 7.4 1 C7.4 7 5.4 12.4 0 16.6
             C-5.4 12.4 -7.4 7 -7.4 1 C-7.4 -6 -5 -12.4 0 -17 Z" fill="url(#vaneB)"/>
    <g stroke="#1A1410" stroke-width=".42" opacity=".42">
      <path d="M0 -13.4 L-4.4 -10"/><path d="M0 -10.4 L-5.6 -7"/><path d="M0 -7.4 L-6.4 -4"/>
      <path d="M0 -4.4 L-7 -1"/><path d="M0 -1.4 L-7.2 2"/><path d="M0 1.6 L-7 5"/>
      <path d="M0 4.6 L-6.4 8"/><path d="M0 7.6 L-5.4 11"/><path d="M0 10.6 L-3.6 13.6"/>
      <path d="M0 -13.4 L4.4 -10"/><path d="M0 -10.4 L5.6 -7"/><path d="M0 -7.4 L6.4 -4"/>
      <path d="M0 -4.4 L7 -1"/><path d="M0 -1.4 L7.2 2"/><path d="M0 1.6 L7 5"/>
      <path d="M0 4.6 L6.4 8"/><path d="M0 7.6 L5.4 11"/><path d="M0 10.6 L3.6 13.6"/>
    </g>
    <path d="M-3.4 8.4 C-2.4 7.6 -1.4 7.4 -.6 7.6 L-.6 10.6 C-1.6 10.4 -2.6 9.8 -3.4 8.4 Z"
          fill="#1A1410" opacity=".45"/>
    <path d="M-.6 -16 C.4 -8 .6 8 0 18.6 L-.6 18.6 C-1.2 8 -1 -8 -.6 -16 Z" fill="#EFE6D0"/>
    <path d="M-2.6 12.6 L2.6 12.6 L2.6 18 C2.6 19 1.6 19.4 0 19.4 C-1.6 19.4 -2.6 19 -2.6 18 Z"
          fill="#B4231F"/>
    <g stroke="#E8B21C" stroke-width=".8">
      <path d="M-2.5 14.4 L2.5 14.4"/><path d="M-2.6 16.4 L2.6 16.4"/>
    </g></g>
  </g>
</svg>
