<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Two-Spirit</title>
  <!-- Two eagle feathers bound at the quill and hung point-down over the six
       colours, splaying apart as they fall: the mark for people who are both,
       carried in one flag. -->
  <style>
    .hang { animation: sway 10s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 0 }
    @keyframes sway { from { transform: rotate(-2.2deg) } to { transform: rotate(2.2deg) } }
    @media (prefers-reduced-motion: reduce) { .hang { animation: none } }
  </style>
  <defs>
    <linearGradient id="vaneA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3A2A1C"/><stop offset="42%" stop-color="#6B5238"/>
      <stop offset="62%" stop-color="#F2E8D6"/><stop offset="100%" stop-color="#D8CBB0"/>
    </linearGradient>
    <radialGradient id="behind" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#000000" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  <g id="fthr">
      <path d="M0 18 C2 15.8 3.6 12.8 4.6 9.4 C5.3 6.6 5.5 4.4 5.4 2.4
               C5.2 -2.6 4 -8.6 2 -13.6 C1.4 -15.1 1 -16.1 .7 -16.6
               L-.7 -16.6 C-1 -16.1 -1.4 -15.1 -2 -13.6
               C-4 -8.6 -5.2 -2.6 -5.4 2.4 C-5.5 4.4 -5.3 6.6 -4.6 9.4
               C-3.6 12.8 -2 15.8 0 18 Z" fill="url(#vaneA)" stroke="#2A1D12" stroke-width=".5"
            stroke-opacity=".6"/>
      <g stroke="#1A1410" stroke-width=".42" opacity=".4" fill="none">
        <path d="M0 13.4 L-2.95 10.2"/><path d="M0 13.4 L2.95 10.2"/>
        <path d="M0 10.4 L-3.88 7.2"/><path d="M0 10.4 L3.88 7.2"/>
        <path d="M0 7.4 L-4.35 4.2"/><path d="M0 7.4 L4.35 4.2"/>
        <path d="M0 4.4 L-4.65 1.2"/><path d="M0 4.4 L4.65 1.2"/>
        <path d="M0 1.4 L-4.82 -1.8"/><path d="M0 1.4 L4.82 -1.8"/>
        <path d="M0 -1.6 L-4.72 -4.8"/><path d="M0 -1.6 L4.72 -4.8"/>
        <path d="M0 -4.6 L-4.32 -7.8"/><path d="M0 -4.6 L4.32 -7.8"/>
        <path d="M0 -7.6 L-3.78 -10.8"/><path d="M0 -7.6 L3.78 -10.8"/>
        <path d="M0 -10.6 L-2.88 -13.8"/><path d="M0 -10.6 L2.88 -13.8"/>
      </g>
      <path d="M-.4 17.2 C.3 8 .5 -8 0 -18.6 L-.4 -18.6 C-.9 -8 -.7 8 -.4 17.2 Z"
            fill="#E4D8BE"/>
      <path d="M-1 -16 L1 -16 L1 -19 L-1 -19 Z" fill="#8A6034"/>
    </g>
  </defs>
  <rect x="0" y="0.00" width="160" height="6.69" fill="#E40303"/><rect x="0" y="6.67" width="160" height="6.69" fill="#FF8C00"/><rect x="0" y="13.33" width="160" height="6.69" fill="#FFED00"/><rect x="0" y="20.00" width="160" height="6.69" fill="#008026"/><rect x="0" y="26.67" width="160" height="6.69" fill="#004DFF"/><rect x="0" y="33.33" width="160" height="6.69" fill="#750787"/>
  <ellipse cx="80" cy="22" rx="30" ry="20" fill="url(#behind)"/>
  <g class="hang">
    <path d="M80 0 L80 6.4" stroke="#4A3620" stroke-width="1"/>
    <g transform="translate(80 6.8) scale(.95)">
      <use href="#fthr" transform="translate(-6.528 17.357) rotate(24)"/>
      <use href="#fthr" transform="translate(6.528 17.357) rotate(-24)"/>
    </g>
    <g transform="translate(80 7)">
      <path d="M-5.8 -1.8 C-2.7 -3 2.7 -3 5.8 -1.8 L5.8 3.2 C2.7 4.4 -2.7 4.4 -5.8 3.2 Z"
            fill="#B4231F"/>
      <g stroke="#E8B21C" stroke-width=".8" fill="none">
        <path d="M-5.7 .2 C-2.7 -.8 2.7 -.8 5.7 .2"/><path d="M-5.8 2.2 C-2.7 1.2 2.7 1.2 5.8 2.2"/>
      </g>
      <path d="M-5.8 -1.8 C-2.7 -3 2.7 -3 5.8 -1.8" fill="none" stroke="#7A1512" stroke-width=".5"/>
