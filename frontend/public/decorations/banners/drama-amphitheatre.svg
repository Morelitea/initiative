  <g fill="#EFE2C6">
    <path d="M56 18 L59 18 L59 8.6 L56 8.6 Z"/><path d="M68 18 L71 18 L71 8 L68 8 Z"/>
    <path d="M89 18 L92 18 L92 8 L89 8 Z"/><path d="M101 18 L104 18 L104 8.6 L101 8.6 Z"/>
    <path d="M53 8.6 L107 8.6 L107 6.6 L53 6.6 Z"/>
    <path d="M53 6.6 L107 6.6 L102 4 L58 4 Z"/>
  </g>
  <g fill="#C4AE88">
    <path d="M55 9 L60 9 L60 8 L55 8 Z"/><path d="M67 8.4 L72 8.4 L72 7.4 L67 7.4 Z"/>
    <path d="M88 8.4 L93 8.4 L93 7.4 L88 7.4 Z"/><path d="M100 9 L105 9 L105 8 L100 8 Z"/>
