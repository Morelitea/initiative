    <path d="M0 32 C30 29.6 130 29.6 160 32"/><path d="M0 38.6 C30 35.6 130 35.6 160 38.6"/>
    <path d="M30 19.6 L24 39"/><path d="M62 18.8 L60 39.4"/><path d="M98 18.8 L100 39.4"/>
    <path d="M130 19.6 L136 39"/>
  </g>
  <!-- The orchestra, and the altar in the middle of it. -->
  <ellipse cx="80" cy="20.6" rx="30" ry="4" fill="#EFE2C6"/>
  <ellipse cx="80" cy="20.6" rx="30" ry="4" fill="none" stroke="#A8916A" stroke-width=".7"/>
  <path d="M76 20.6 L84 20.6 L83 17 L77 17 Z" fill="#C4AE88"/>
  <path d="M75.4 17 L84.6 17 L84.6 16 L75.4 16 Z" fill="#EFE2C6"/>
