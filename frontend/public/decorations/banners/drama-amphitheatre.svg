<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Amphitheatre</title>
  <!-- Stone tiers with the sea behind them, an hour before. -->
  <defs>
    <linearGradient id="aegean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C88E"/><stop offset="55%" stop-color="#E8A06A"/>
      <stop offset="100%" stop-color="#B4744E"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#aegean)"/>
  <circle cx="118" cy="9" r="5.4" fill="#FFF0C8" opacity=".9"/>
  <path d="M0 12 C20 8.6 44 10.6 66 9 C88 7.4 112 10 134 8.6 C146 8 154 9.4 160 8.6
           L160 14 L0 14 Z" fill="#8A6A6E" opacity=".55"/>
  <path d="M0 14 L160 14 L160 18 L0 18 Z" fill="#2E6E88"/>
  <g stroke="#7FC0D8" stroke-width=".4" opacity=".5">
    <path d="M8 15.4 C20 15 32 15.6 44 15.2"/><path d="M96 16.6 C108 16.2 120 16.8 132 16.4"/>
  </g>
  <!-- The tiers, curving round. -->
  <path d="M0 18 L160 18 L160 40 L0 40 Z" fill="#D8C4A0"/>
  <g fill="#C4AE88">
    <path d="M0 21 C30 19.4 130 19.4 160 21 L160 23 C130 21.4 30 21.4 0 23 Z"/>
    <path d="M0 26 C30 24 130 24 160 26 L160 28 C130 26 30 26 0 28 Z"/>
    <path d="M0 32 C30 29.6 130 29.6 160 32 L160 34 C130 31.6 30 31.6 0 34 Z"/>
  </g>
  <g stroke="#A8916A" stroke-width=".7" fill="none">
