  <!-- The cat, checking whether anything has been left unattended. -->
  <clipPath id="overBench"><rect x="0" y="0" width="160" height="34"/></clipPath>
  <g clip-path="url(#overBench)">
    <g class="peek">
      <g transform="translate(28 34)">
        <g fill="#04020A">
          <path d="M-5.4 0 C-5.6 -3.2 -3.4 -5.4 0 -5.4 C3.4 -5.4 5.6 -3.2 5.4 0 Z"/>
          <path d="M-5.2 -3.4 C-5.6 -5.4 -5.2 -6.4 -4.4 -6.6 C-3.4 -6 -2.8 -5 -2.6 -4.2 Z"/>
          <path d="M5.2 -3.4 C5.6 -5.4 5.2 -6.4 4.4 -6.6 C3.4 -6 2.8 -5 2.6 -4.2 Z"/>
          <!-- Two paws hooked over the edge. -->
          <path d="M-4.6 -.6 C-4.6 -1.6 -3.6 -2.2 -2.6 -2.2 C-1.6 -2.2 -.8 -1.6 -.8 -.6 Z"/>
          <path d="M.8 -.6 C.8 -1.6 1.6 -2.2 2.6 -2.2 C3.6 -2.2 4.6 -1.6 4.6 -.6 Z"/>
        </g>
        <g fill="#8AE83A">
          <ellipse cx="-2.1" cy="-2.9" rx=".55" ry=".72"/>
          <ellipse cx="2.1" cy="-2.9" rx=".55" ry=".72"/>
        </g>
        <g fill="#2A1C10">
          <ellipse cx="-2.1" cy="-2.9" rx=".2" ry=".62"/>
          <ellipse cx="2.1" cy="-2.9" rx=".2" ry=".62"/>
        </g>
        <path d="M-.7 -1.5 L.7 -1.5 L0 -.9 Z" fill="#5E3A44"/>
        <g stroke="#2A1C10" stroke-width=".22" opacity=".55">
          <path d="M-1.8 -1.2 L-5.8 -1.8"/><path d="M-1.8 -.7 L-5.6 -.4"/>
          <path d="M1.8 -1.2 L5.8 -1.8"/><path d="M1.8 -.7 L5.6 -.4"/>
        </g>
      </g>
    </g>
  </g>
</svg>
