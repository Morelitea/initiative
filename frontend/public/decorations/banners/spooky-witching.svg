00001 L33.28 19.200000000000003" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="32.5" y="9.000000000000002" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g><g><path d="M38.92 20.6 L45.08 20.6 L45.08 16.200000000000003 L38.92 16.200000000000003 Z" fill="#7A9EA8" opacity=".42"/><path d="M39.228 20.200000000000003 L44.772 20.200000000000003 L44.772 17.520000000000003 L39.228 17.520000000000003 Z" fill="#E8C43A" opacity=".85"/><path d="M38.92 20.6 L45.08 20.6 L45.08 16.200000000000003 L38.92 16.200000000000003 Z" fill="none" stroke="#7A9EA8" stroke-width=".3" opacity=".8"/><path d="M41.28 17.6 L41.28 19.200000000000003" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="40.5" y="13.400000000000002" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g><g><path d="M48.8 14.000000000000002 L48.8 15.800000000000002 C47.492 16.400000000000002 47.492 20.6 50 20.6 C52.508 20.6 52.508 16.400000000000002 51.2 15.800000000000002 L51.2 14.000000000000002 Z" fill="#8E76B4" opacity=".42"/><path d="M47.69264 18.719 C48.2444 20.200000000000003 51.7556 20.200000000000003 52.30736 18.719 C51.254 19.2206 48.746 19.2206 47.69264 18.719 Z" fill="#4EBE3E" opacity=".85"/><path d="M48.8 14.000000000000002 L48.8 15.800000000000002 C47.492 16.400000000000002 47.492 20.6 50 20.6 C52.508 20.6 52.508 16.400000000000002 51.2 15.800000000000002 L51.2 14.000000000000002 Z" fill="none" stroke="#8E76B4" stroke-width=".3" opacity=".8"/><path d="M49.28 16.6 L49.28 19.200000000000003" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="48.5" y="12.400000000000002" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g><g><path d="M56.068 20.6 L59.932 20.6 L59.932 13.000000000000002 L59.08 11.400000000000002 L56.92 11.400000000000002 L56.068 13.000000000000002 Z" fill="#7A9EA8" opacity=".42"/><path d="M56.29984 20.200000000000003 L59.70016 20.200000000000003 L59.70016 15.264000000000003 L56.29984 15.264000000000003 Z" fill="#5A7EE8" opacity=".85"/><path d="M56.068 20.6 L59.932 20.6 L59.932 13.000000000000002 L59.08 11.400000000000002 L56.92 11.400000000000002 L56.068 13.000000000000002 Z" fill="none" stroke="#7A9EA8" stroke-width=".3" opacity=".8"/><path d="M57.28 14.000000000000002 L57.28 19.200000000000003" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="56.5" y="9.800000000000002" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g></g>

