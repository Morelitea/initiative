<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Witching hour</title>
  <!-- The bench at the hour the work gets done: a shelf of stock, a burner
       under something, and whatever is drying overhead. -->
  <style>
    .bub { animation: pop 3.4s ease-out infinite; transform-box: fill-box;
           transform-origin: 50% 50% }
    .b2 { animation-delay: -1.2s } .b3 { animation-delay: -2.4s }
    .b4 { animation-delay: -.6s } .b5 { animation-delay: -1.8s }
    @keyframes pop { 0% { transform: translateY(0) scale(.4); opacity: 0 }
                     30% { opacity: .85 }
                     100% { transform: translateY(-8px) scale(1.2); opacity: 0 } }
    .flame { animation: flick 1.7s ease-in-out infinite alternate;
             transform-box: fill-box; transform-origin: 50% 100% }
    .f2 { animation-delay: -.6s } .f3 { animation-delay: -1.1s }
    @keyframes flick { from { transform: scaleY(.86) scaleX(1.06) }
                       to { transform: scaleY(1.1) scaleX(.94) } }
    .hang { animation: swing 6s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 0 }
    .h1 { animation-duration: 7.4s } .h2 { animation-duration: 5.2s }
    @keyframes swing { from { transform: rotate(-3deg) } to { transform: rotate(3deg) } }
    .fume { animation: curl 7s ease-in-out infinite }
    @keyframes curl { 0% { transform: translate(0,0) scale(.6); opacity: 0 }
                      25% { opacity: .35 }
                      100% { transform: translate(4px,-13px) scale(1.5); opacity: 0 } }
    /* Up for a look, down again, over and over. */
    .peek { animation: peek 8s ease-in-out infinite }
    @keyframes peek { 0%,8% { transform: translateY(11px) }
                      26%,52% { transform: translateY(-.4px) }
                      70%,100% { transform: translateY(11px) } }
    .wheel { animation: turn 150s linear infinite;
             transform-box: view-box; transform-origin: 80px 18px }
    @keyframes turn { to { transform: rotate(360deg) } }
    .gleam { animation: pass 11s ease-in-out infinite }
    @keyframes pass { 0%,100% { transform: translateX(-46px) }
                      50% { transform: translateX(206px) } }
    @media (prefers-reduced-motion: reduce) {
      .bub, .flame, .hang, .fume, .peek, .wheel, .gleam { animation: none } }
  </style>
  <defs>
    <linearGradient id="wnight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0616"/><stop offset="100%" stop-color="#2A1140"/>
    </linearGradient>
    <linearGradient id="benchwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3D22"/><stop offset="100%" stop-color="#33220F"/>
    </linearGradient>
    <radialGradient id="lamplight" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#F6C24E" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#F6C24E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="potglow" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#6EE85A" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#6EE85A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#wnight)"/>
  <!-- On the wall behind everything, turning about as fast as an hour hand. -->
  <defs>
    <mask id="sheen">
      <rect x="0" y="0" width="160" height="40" fill="#000"/>
      <g class="gleam"><rect x="0" y="0" width="46" height="40" fill="url(#sheenband)"/></g>
    </mask>
    <linearGradient id="sheenband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/><stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>
  <g class="wheel">
    <g fill="none" stroke="#6E4AA8" stroke-width=".7" opacity=".2" stroke-linejoin="round">
      <path d="M80.00 2.50 L89.11 30.54 L65.26 13.21 L94.74 13.21 L70.89 30.54 Z"/>
      <circle cx="80" cy="18" r="15.5"/>
      <circle cx="80" cy="18" r="17.3"/>
    </g>
    <g fill="none" stroke="#C9A0F2" stroke-width=".9" mask="url(#sheen)"
       stroke-linejoin="round">
      <path d="M80.00 2.50 L89.11 30.54 L65.26 13.21 L94.74 13.21 L70.89 30.54 Z"/>
      <circle cx="80" cy="18" r="15.5"/>
      <circle cx="80" cy="18" r="17.3"/>
    </g>
  </g>
  <ellipse cx="80" cy="24" rx="66" ry="20" fill="url(#lamplight)"/>

  <!-- Drying overhead. -->
  <path d="M0 3 L160 3" stroke="#4A3620" stroke-width=".5"/>
  <g><g class="hang h0" style="animation-delay: -0.0s"><path d="M66 0 L66 4" stroke="#6B5238" stroke-width=".5"/><path d="M66 4 C63.6 7 64.4 11 66 13 C67.6 11 68.4 7 66 4 Z" fill="#3E5A32"/><path d="M66 5 L66 12.4" stroke="#2A4022" stroke-width=".3"/></g><g class="hang h1" style="animation-delay: -1.3s"><path d="M72 0 L72 5" stroke="#6B5238" stroke-width=".5"/><path d="M72 5 C69.6 8 70.4 12 72 14 C73.6 12 74.4 8 72 5 Z" fill="#3E5A32"/><path d="M72 6 L72 13.4" stroke="#2A4022" stroke-width=".3"/></g><g class="hang h2" style="animation-delay: -2.6s"><path d="M88 0 L88 6" stroke="#6B5238" stroke-width=".5"/><path d="M88 6 C85.6 9 86.4 13 88 15 C89.6 13 90.4 9 88 6 Z" fill="#3E5A32"/><path d="M88 7 L88 14.4" stroke="#2A4022" stroke-width=".3"/></g><g class="hang h0" style="animation-delay: -3.9s"><path d="M94 0 L94 4" stroke="#6B5238" stroke-width=".5"/><path d="M94 4 C91.6 7 92.4 11 94 13 C95.6 11 96.4 7 94 4 Z" fill="#3E5A32"/><path d="M94 5 L94 12.4" stroke="#2A4022" stroke-width=".3"/></g></g>

  <!-- The stock shelf. -->
  <path d="M8 20.6 L70 20.6 L70 22.2 L8 22.2 Z" fill="url(#benchwood)"/>
  <path d="M8 20.6 L70 20.6 L70 21.1 L8 21.1 Z" fill="#7A5330"/>
