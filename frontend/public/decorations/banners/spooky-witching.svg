122.736 29.2 121.2 28.6 L121.2 26.8 Z" fill="none" stroke="#7A9EA8" stroke-width=".3" opacity=".8"/><path d="M119.28 29.400000000000002 L119.28 32.6" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="118.5" y="25.2" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g><g><path d="M124.388 34 L131.612 34 L129.2 27.799999999999997 L129.2 25.4 L126.8 25.4 L126.8 27.799999999999997 Z" fill="#8E76B4" opacity=".42"/><path d="M124.67696 33.5 L131.32304 33.5 L129.4448 29.528 L126.5552 29.528 Z" fill="#8AE83A" opacity=".85"/><path d="M124.388 34 L131.612 34 L129.2 27.799999999999997 L129.2 25.4 L126.8 25.4 L126.8 27.799999999999997 Z" fill="none" stroke="#8E76B4" stroke-width=".3" opacity=".8"/><path d="M127.28 28.0 L127.28 32.6" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="126.5" y="23.799999999999997" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g><g><path d="M132.81 34 L139.19 34 L139.19 29.4 L132.81 29.4 Z" fill="#7A9EA8" opacity=".42"/><path d="M133.129 33.6 L138.871 33.6 L138.871 30.81 L133.129 30.81 Z" fill="#5A7EE8" opacity=".85"/><path d="M132.81 34 L139.19 34 L139.19 29.4 L132.81 29.4 Z" fill="none" stroke="#7A9EA8" stroke-width=".3" opacity=".8"/><path d="M135.28 30.8 L135.28 32.6" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="134.5" y="26.599999999999998" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g><g><path d="M142.152 34 L145.848 34 L145.848 26.8 L145.08 25.2 L142.92 25.2 L142.152 26.8 Z" fill="#8E76B4" opacity=".42"/><path d="M142.37376 33.6 L145.62624 33.6 L145.62624 28.896 L142.37376 28.896 Z" fill="#E8C43A" opacity=".85"/><path d="M142.152 34 L145.848 34 L145.848 26.8 L145.08 25.2 L142.92 25.2 L142.152 26.8 Z" fill="none" stroke="#8E76B4" stroke-width=".3" opacity=".8"/><path d="M143.28 27.8 L143.28 32.6" stroke="#FFFFFF" stroke-width=".28" opacity=".3" fill="none"/><rect x="142.5" y="23.599999999999998" width="3" height="1.8" rx=".4" fill="#5A3D22"/></g></g>
