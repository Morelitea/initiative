    <circle cx="50.5" cy="12.7" r="0.16" opacity="0.51"/><circle cx="68.4" cy="24.7" r="0.4" opacity="0.91"/><circle cx="58.6" cy="28.7" r="0.16" opacity="0.74"/><circle cx="71.3" cy="5.2" r="0.26" opacity="0.67"/><circle cx="154.8" cy="16.1" r="0.4" opacity="0.71"/><circle cx="130.2" cy="5.5" r="0.32" opacity="0.94"/><circle cx="105.8" cy="12.9" r="0.16" opacity="0.60"/><circle cx="0.5" cy="19.1" r="0.26" opacity="0.34"/>
