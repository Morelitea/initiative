<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Night sky</title>
  <!-- The desert is where you can still see it: the whole band of the galaxy,
       and every so often something falling through it. -->
  <style>
    .tw { animation: blink 4.2s ease-in-out infinite alternate }
    .t1 { animation-delay: -1.4s } .t2 { animation-delay: -2.8s }
    @keyframes blink { from { opacity: .35 } to { opacity: 1 } }
    .band { animation: breathe 16s ease-in-out infinite alternate }
    @keyframes breathe { from { opacity: .5 } to { opacity: .8 } }
    .fall { animation: streak 9s ease-in infinite }
    .f2 { animation-duration: 13s; animation-delay: -6s }
    .f4 { animation-duration: 11s; animation-delay: -3s }
    .f5 { animation-duration: 15s; animation-delay: -11s }
    .f8 { animation-duration: 19s; animation-delay: -7s }
    @keyframes streak { 0%,72% { transform: translate(0,0); opacity: 0 }
                        76% { opacity: 1 }
                        86%,100% { transform: translate(34px, 20px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .tw, .band, .fall { animation: none } .fall { opacity: 0 } }
    .wheel { animation: turn 220s linear infinite;
             transform-box: view-box; transform-origin: 80px 20px }
    @keyframes turn { to { transform: rotate(360deg) } }
    .fall2 { animation: streak2 17s ease-in infinite }
    .f3 { animation-duration: 23s; animation-delay: -9s }
    .f6 { animation-duration: 21s; animation-delay: -15s }
    .f7 { animation-duration: 26s; animation-delay: -5s }
    .f9 { animation-duration: 14s; animation-delay: -12s }
    /* One that is worth looking up for, rarely. */
    .bolide { animation: blaze 41s ease-in infinite }
    @keyframes blaze { 0%,88% { transform: translate(0,0); opacity: 0 }
                       90.5% { opacity: 1 }
                       97%,100% { transform: translate(58px,34px); opacity: 0 } }
    @keyframes streak2 { 0%,80% { transform: translate(0,0); opacity: 0 }
                         84% { opacity: 1 }
                         93%,100% { transform: translate(-30px,22px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .wheel, .fall2, .bolide { animation: none } .fall2, .bolide { opacity: 0 } }
  </style>
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060A1E"/><stop offset="58%" stop-color="#131A3E"/>
      <stop offset="100%" stop-color="#2E2450"/>
    </linearGradient>
    <linearGradient id="milky" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0%" stop-color="#8A96D8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#C0C6F0" stop-opacity=".55"/>
      <stop offset="62%" stop-color="#E8D8F0" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#8A96D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2E4A"/><stop offset="100%" stop-color="#1A1428"/>
    </linearGradient>
    <filter id="cloudy" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="lane" x="-25%" y="-200%" width="150%" height="500%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect width="160" height="40" fill="url(#deep)"/>

  <!-- The band, on the diagonal it actually runs. -->
  <g class="band" filter="url(#cloudy)">
    <path d="M-10 2 L46 -6 L138 26 L112 40 L28 16 Z" fill="url(#milky)"/>
    <path d="M6 0 L52 -4 L128 24 L108 34 L36 12 Z" fill="#D8D0F2" opacity=".16"/>
    <ellipse cx="52" cy="9" rx="20" ry="7" fill="#E8DCF4" opacity=".13"
             transform="rotate(21 52 9)"/>
  </g>
  <!-- The dark lanes that run down the middle of it. -->
  <g stroke="#0A0C22" stroke-width="2.4" opacity=".5" fill="none" filter="url(#lane)">
    <path d="M6 3 C36 8 70 17 104 28"/><path d="M18 -1 C48 5 82 15 116 26"/>
  </g>

