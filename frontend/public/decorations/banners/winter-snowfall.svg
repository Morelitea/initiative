    <circle class="twinkle t2" cx="88" cy="6" r=".32"/><circle class="twinkle t3" cx="108" cy="3" r=".28"/>
    <circle class="twinkle t1" cx="150" cy="4.4" r=".3"/>
  </g>

  <g opacity=".65"><path d="M3.60 29.74 L8 26.36 L12.40 29.74 Z" fill="#26365E"/><path d="M4.51 26.62 L8 23.24 L11.49 26.62 Z" fill="#26365E"/><path d="M5.42 23.50 L8 20.12 L10.58 23.50 Z" fill="#26365E"/><path d="M6.33 20.38 L8 17.00 L9.67 20.38 Z" fill="#26365E"/><path d="M7.47 30 L8.53 30 L8.40 27.40 L7.60 27.40 Z" fill="#3A2A1E"/><path d="M22.20 29.78 L26 26.92 L29.80 29.78 Z" fill="#26365E"/><path d="M22.99 27.14 L26 24.28 L29.01 27.14 Z" fill="#26365E"/><path d="M23.77 24.50 L26 21.64 L28.23 24.50 Z" fill="#26365E"/><path d="M24.56 21.86 L26 19.00 L27.44 21.86 Z" fill="#26365E"/><path d="M25.54 30 L26.46 30 L26.34 27.80 L25.66 27.80 Z" fill="#3A2A1E"/><path d="M47.40 29.72 L52 26.08 L56.60 29.72 Z" fill="#26365E"/><path d="M48.35 26.36 L52 22.72 L55.65 26.36 Z" fill="#26365E"/><path d="M49.30 23.00 L52 19.36 L54.70 23.00 Z" fill="#26365E"/><path d="M50.25 19.64 L52 16.00 L53.75 19.64 Z" fill="#26365E"/><path d="M51.45 30 L52.55 30 L52.41 27.20 L51.59 27.20 Z" fill="#3A2A1E"/><path d="M96.00 29.76 L100 26.64 L104.00 29.76 Z" fill="#26365E"/><path d="M96.83 26.88 L100 23.76 L103.17 26.88 Z" fill="#26365E"/><path d="M97.65 24.00 L100 20.88 L102.35 24.00 Z" fill="#26365E"/><path d="M98.48 21.12 L100 18.00 L101.52 21.12 Z" fill="#26365E"/><path d="M99.52 30 L100.48 30 L100.36 27.60 L99.64 27.60 Z" fill="#3A2A1E"/><path d="M119.00 29.70 L124 25.80 L129.00 29.70 Z" fill="#26365E"/><path d="M120.03 26.10 L124 22.20 L127.97 26.10 Z" fill="#26365E"/><path d="M121.07 22.50 L124 18.60 L126.93 22.50 Z" fill="#26365E"/><path d="M122.10 18.90 L124 15.00 L125.90 18.90 Z" fill="#26365E"/><path d="M123.40 30 L124.60 30 L124.45 27.00 L123.55 27.00 Z" fill="#3A2A1E"/><path d="M145.80 29.76 L150 26.64 L154.20 29.76 Z" fill="#26365E"/><path d="M146.67 26.88 L150 23.76 L153.33 26.88 Z" fill="#26365E"/><path d="M147.54 24.00 L150 20.88 L152.46 24.00 Z" fill="#26365E"/><path d="M148.40 21.12 L150 18.00 L151.60 21.12 Z" fill="#26365E"/><path d="M149.50 30 L150.50 30 L150.38 27.60 L149.