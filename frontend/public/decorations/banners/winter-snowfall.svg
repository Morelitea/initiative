<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Snowfall</title>
  <!-- It has been coming down since before anybody woke up. -->
  <style>
    .fall { animation: down 14s linear infinite }
    .f1 { animation-duration: 18s } .f2 { animation-duration: 10s }
    @keyframes down { from { transform: translateY(-10px) }
                      to { transform: translateY(46px) } }
    .lit { animation: warm 6s ease-in-out infinite alternate }
    .l2 { animation-delay: -2.4s }
    @keyframes warm { from { opacity: .78 } to { opacity: 1 } }
    .smoke { animation: curl 9s ease-out infinite }
    .s2 { animation-delay: -3s } .s3 { animation-delay: -6s }
    @keyframes curl { 0% { transform: translate(0,0) scale(.5); opacity: 0 }
                      20% { opacity: .34 }
                      100% { transform: translate(7px,-12px) scale(1.8); opacity: 0 } }
    .twinkle { animation: shine 3.4s ease-in-out infinite alternate }
    .t1 { animation-delay: -.9s } .t2 { animation-delay: -1.8s } .t3 { animation-delay: -2.7s }
    @keyframes shine { from { opacity: .4 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .fall, .lit, .smoke, .twinkle { animation: none } }
  </style>
  <defs>
    <linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1630"/><stop offset="65%" stop-color="#22305A"/>
      <stop offset="100%" stop-color="#42537E"/>
    </linearGradient>
    <linearGradient id="snowfield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6E2F2"/><stop offset="100%" stop-color="#F2F6FC"/>
    </linearGradient>
    <linearGradient id="logwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3E2A"/><stop offset="100%" stop-color="#3A2618"/>
    </linearGradient>
    <linearGradient id="rooflight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFDFF"/><stop offset="100%" stop-color="#CFDCEE"/>
    </linearGradient>
    <radialGradient id="moonring" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#DCE6FA" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#DCE6FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spill" cx=".5" cy=".3" r=".7">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#FFD79A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#wsky)"/>
  <circle cx="132" cy="8" r="18" fill="url(#moonring)"/>
  <circle cx="132" cy="8" r="4.6" fill="#EEF3FE"/>
  <g fill="#D8DEF0">
