<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     shape-rendering="crispEdges" role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Dice tower</title>
  <style>
    /* The roll the app already does when you finish a task: the faces flick
       past, then it lands on twenty and the sparks come out. The settled
       twenty is the resting state, so a renderer that never animates — or a
       reader who asked for less motion — gets the good frame rather than a
       blank die. */
    .face { opacity: 0 }
    .f20 { opacity: 1 }
    .f1  { animation: face1 4.5s steps(1, end) infinite }
    .f2  { animation: face2 4.5s steps(1, end) infinite }
    .f3  { animation: face3 4.5s steps(1, end) infinite }
    .f20 { animation: face20 4.5s steps(1, end) infinite }
    .die { animation: hop 4.5s cubic-bezier(.3,0,.4,1) infinite }
    .spark { opacity: 0; animation: spark 4.5s ease-out infinite }
    .s2 { animation-delay: .05s } .s3 { animation-delay: .1s }
    .s4 { animation-delay: .15s } .s5 { animation-delay: .2s }
    .mote { animation: drift 9s ease-in-out infinite alternate }
    .m2 { animation-delay: -3s } .m3 { animation-delay: -6s }

    @keyframes face1  { 0%,6%{opacity:1} 7%,100%{opacity:0} }
    @keyframes face2  { 0%,6%{opacity:0} 7%,13%{opacity:1} 14%,100%{opacity:0} }
    @keyframes face3  { 0%,13%{opacity:0} 14%,20%{opacity:1} 21%,100%{opacity:0} }
    @keyframes face20 { 0%,20%{opacity:0} 21%,100%{opacity:1} }
    @keyframes hop {
      0%   { transform: translateY(-7px) }
      8%   { transform: translateY(0) }
      13%  { transform: translateY(-2px) }
      18%  { transform: translateY(0) }
      100% { transform: translateY(0) }
    }
    @keyframes spark {
      0%,20% { opacity: 0; transform: scale(.4) }
      28%    { opacity: 1; transform: scale(1) }
      46%    { opacity: 0; transform: scale(1.6) }
      100%   { opacity: 0 }
    }
    @keyframes drift { from { transform: translateY(0) } to { transform: translateY(-3px) } }

    @media (prefers-reduced-motion: reduce) {
      .die, .spark, .mote, .f1, .f2, .f3, .f20 { animation: none }
    }
  </style>

  <!-- The table. Darkest at the left, where a face and a name sit. -->
  <rect width="160" height="40" fill="#12211c"/>
  <rect x="0" y="0" width="70" height="40" fill="#0b1310"/>
  <!-- Stepped rather than blended: a hard edge is the idiom here, and four of
       them read as shading where one reads as a mistake. -->
  <rect x="70" y="0" width="5" height="40" fill="#0c1512"/>
  <rect x="75" y="0" width="5" height="40" fill="#0e1814"/>
  <rect x="80" y="0" width="5" height="40" fill="#101c17"/>
  <g fill="#1b3229">
    <rect x="0" y="27" width="160" height="1"/>
    <rect x="0" y="34" width="160" height="1"/>
  </g>

  <!-- Dust in the lamplight. -->
  <g fill="#3f6f5c">
    <rect class="mote" x="70" y="9" width="1" height="1"/>
    <rect class="mote m2" x="100" y="5" width="1" height="1"/>
    <rect class="mote m3" x="152" y="30" width="1" height="1"/>
  </g>

  <!-- Two already thrown, sitting still: a d6 showing five, and one on edge. -->
