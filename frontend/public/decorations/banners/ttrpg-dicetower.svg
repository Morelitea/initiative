      <rect x="92" y="30" width="1" height="1"/>
      <rect x="90" y="32" width="1" height="1"/><rect x="94" y="32" width="1" height="1"/>
    </g>
  </g>
  <g>
    <rect x="101" y="30" width="7" height="5" fill="#5B21B6"/>
    <rect x="102" y="31" width="5" height="3" fill="#8B5CF6"/>
    <rect x="104" y="32" width="1" height="1" fill="#1E1B4B"/>
  </g>

