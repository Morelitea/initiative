    <rect x="88" y="26" width="9" height="9" fill="#5B21B6"/>
    <rect x="89" y="27" width="7" height="7" fill="#A78BFA"/>
    <rect x="89" y="27" width="7" height="1" fill="#DDD6FE"/>
    <g fill="#1E1B4B">
