<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Grove</title>
  <!-- A forest floor, not a row of one mushroom repeated: a morel, a fly
       agaric, a cluster of little brown toadstools and a bracket fungus on a
       fallen log. All curves — a cap is a dome and a stem is a taper, and
       neither has a straight edge in it. -->
  <style>
    .spore { animation: rise 11s linear infinite }
    .s2 { animation-delay: -3.7s } .s3 { animation-delay: -7.4s }
    @keyframes rise {
      0%   { transform: translate(0,0);      opacity: 0 }
      20%  { opacity: .75 }
      100% { transform: translate(3px,-24px); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) { .spore { animation: none; opacity: .45 } }
  </style>
  <defs>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a170f"/>
      <stop offset="70%" stop-color="#14261a"/>
      <stop offset="100%" stop-color="#1c3322"/>
    </linearGradient>
    <radialGradient id="morelCap" cx=".4" cy=".25" r=".9">
      <stop offset="0%" stop-color="#B4834B"/><stop offset="60%" stop-color="#8A5A2E"/>
      <stop offset="100%" stop-color="#5C3A1B"/>
    </radialGradient>
    <radialGradient id="agaric" cx=".38" cy=".3" r=".85">
      <stop offset="0%" stop-color="#F0563C"/><stop offset="70%" stop-color="#C62F1C"/>
      <stop offset="100%" stop-color="#8E1D10"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#canopy)"/>
  <!-- Light through the canopy. -->
  <g fill="#9FD07A" opacity=".07">
    <path d="M30 0 C36 0 44 0 48 0 L36 40 L20 40 Z"/>
    <path d="M104 0 L118 0 L112 40 L98 40 Z"/>
  </g>
  <!-- Floor: moss over leaf litter, with a soft edge rather than a ruled one. -->
  <path d="M0 31 C22 28.5 40 32 58 30.5 C78 28.8 96 32.5 116 30.5 C134 28.8 148 31.5 160 30 L160 40 L0 40 Z"
        fill="#1d3a22"/>
  <path d="M0 31 C22 28.5 40 32 58 30.5 C78 28.8 96 32.5 116 30.5 C134 28.8 148 31.5 160 30"
        fill="none" stroke="#2f5c30" stroke-width="1.2"/>
  <g fill="#3f7a3d" opacity=".8">
    <ellipse cx="12" cy="31" rx="6" ry="1.6"/><ellipse cx="52" cy="31.5" rx="7" ry="1.5"/>
    <ellipse cx="92" cy="31.2" rx="5" ry="1.4"/><ellipse cx="140" cy="31" rx="8" ry="1.7"/>
  </g>

  <!-- A fallen log, with bracket fungus stepping up its side. -->
  <path d="M108 33.5 C120 31.6 136 31.6 152 33 C152.6 35 152.6 36.6 152 38 C136 39 120 39 108 37.6 Z"
        fill="#3b2a1b"/>
  <path d="M108 33.5 C120 31.6 136 31.6 152 33 C152.4 33.9 152.5 34.6 152.4 35.3 C136 34 120 34 108 35.6 Z"
        fill="#4d3722"/>
  <g fill="#C89A4E">
    <path d="M118 33.4 C121.5 31.6 125 31.9 126 33.4 C124 34.4 120 34.4 118 33.4 Z"/>
    <path d="M129 34.4 C132 32.9 135.5 33.2 136.4 34.5 C134.4 35.4 131 35.4 129 34.4 Z"/>
    <path d="M141 33.6 C143.6 32.3 146.4 32.6 147.2 33.7 C145.6 34.5 142.6 34.5 141 33.6 Z"/>
  </g>

  <!-- The morel: the one the pack is named for, so it stands where the eye lands. -->
  <g>
    <path d="M77.6 24 C77 27.5 76.6 30 78 32 C79.6 33 81.4 33 83 32 C84.4 30 84 27.5 83.4 24 Z"
          fill="#E9DCBE"/>
    <path d="M81.6 24 C82.2 27.5 82.6 30 81.6 32 C82.6 32.6 83.2 32.2 83.6 31.4 C84.4 29.2 84 26.4 83.4 24 Z"
          fill="#B9A57A"/>
    <path d="M80.5 5 C86.5 6.6 89 12 89 17.6 C89 22.6 86 26.4 80.5 27.2 C75 26.4 72 22.6 72 17.6 C72 12 74.5 6.6 80.5 5 Z"
          fill="url(#morelCap)"/>
    <g fill="#3B2412" opacity=".85">
      <ellipse cx="80.5" cy="8.4" rx="2.1" ry="1.6"/>
      <ellipse cx="76.6" cy="11.4" rx="2.2" ry="1.8"/><ellipse cx="84.4" cy="11.4" rx="2.2" ry="1.8"/>
      <ellipse cx="74.4" cy="15.4" rx="2.2" ry="1.9"/><ellipse cx="80.5" cy="14.4" rx="2.3" ry="1.9"/>
      <ellipse cx="86.6" cy="15.4" rx="2.2" ry="1.9"/>
      <ellipse cx="76.2" cy="19.4" rx="2.3" ry="2"/><ellipse cx="84.8" cy="19.4" rx="2.3" ry="2"/>
      <ellipse cx="80.5" cy="22.6" rx="2.3" ry="1.9"/>
      <ellipse cx="75.2" cy="23.6" rx="1.8" ry="1.5"/><ellipse cx="85.8" cy="23.6" rx="1.8" ry="1.5"/>
    </g>
    <g fill="none" stroke="#D6A76B" stroke-opacity=".4" stroke-width=".9" stroke-linecap="round">
      <path d="M78.6 6.6 C77 11 76.6 17.6 77.4 25"/>
      <path d="M82.4 6.6 C84 11 84.4 17.6 83.6 25"/>
      <path d="M73.4 13.4 C77 12.6 84 12.6 87.6 13.4"/>
      <path d="M72.8 18 C77 17.2 84 17.2 88.2 18"/>
    </g>
  </g>

  <!-- A fly agaric: the other mushroom everybody can name. -->
  <g>
    <path d="M32.4 22.6 C31.8 26 31.6 29 33 31.4 C34.6 32.4 36.4 32.4 38 31.4 C39.4 29 39.2 26 38.6 22.6 Z"
          fill="#F3ECDA"/>
    <path d="M31.6 24.4 C33.6 23.4 37.4 23.4 39.4 24.4 C38.6 25.4 32.4 25.4 31.6 24.4 Z" fill="#E0D5B8"/>
    <path d="M35.5 10 C43 10 48.4 15 48.6 20.4 C48.6 22 47.4 22.8 45.6 22.8 L25.4 22.8 C23.6 22.8 22.4 22 22.4 20.4 C22.6 15 28 10 35.5 10 Z"
          fill="url(#agaric)"/>
    <g fill="#FBF3E4">
      <ellipse cx="30" cy="16" rx="1.9" ry="1.5"/><ellipse cx="38" cy="14.4" rx="2.1" ry="1.6"/>
      <ellipse cx="44" cy="18.6" rx="1.7" ry="1.3"/><ellipse cx="34.4" cy="19.6" rx="1.5" ry="1.2"/>
      <ellipse cx="26.4" cy="20" rx="1.4" ry="1.1"/><ellipse cx="41" cy="21" rx="1.2" ry="1"/>
    </g>
  </g>

  <!-- A cluster of little brown ones, the sort you actually trip over. -->
  <g fill="#6E4A2A">
    <path d="M57 26.4 C60.6 26.4 62.6 28.4 62.6 30 C62.6 30.8 62 31 61 31 L53 31 C52 31 51.4 30.8 51.4 30 C51.4 28.4 53.4 26.4 57 26.4 Z"/>
    <path d="M65.5 28 C68.2 28 69.8 29.4 69.8 30.6 C69.8 31.2 69.4 31.4 68.6 31.4 L62.4 31.4 C61.6 31.4 61.2 31.2 61.2 30.6 C61.2 29.4 62.8 28 65.5 28 Z"/>
    <path d="M48.5 28.6 C50.8 28.6 52.2 29.8 52.2 30.8 C52.2 31.3 51.8 31.5 51.2 31.5 L45.8 31.5 C45.2 31.5 44.8 31.3 44.8 30.8 C44.8 29.8 46.2 28.6 48.5 28.6 Z"/>
  </g>
  <g fill="#D9C9A6">
    <path d="M56.2 31 C55.9 33 55.8 34.6 56.6 35.6 L57.6 35.6 C58.2 34.6 58.1 33 57.8 31 Z"/>
    <path d="M64.9 31.4 C64.7 33 64.6 34.2 65.2 35 L66 35 C66.5 34.2 66.4 33 66.2 31.4 Z"/>
    <path d="M48 31.5 C47.8 33 47.8 34 48.3 34.7 L49 34.7 C49.4 34 49.4 33 49.2 31.5 Z"/>
  </g>

  <!-- Spores in the shaft of light. -->
  <g fill="#DDEEC4">
    <circle class="spore" cx="34" cy="26" r=".7"/>
    <circle class="spore s2" cx="43" cy="28" r=".55"/>
    <circle class="spore s3" cx="110" cy="27" r=".6"/>
  </g>
</svg>
