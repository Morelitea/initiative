    .b3 { animation-duration: 3s; animation-delay: -2.4s }
    @keyframes lbRise { 0% { opacity: 0; transform: translateY(2px) }
                        25% { opacity: .85 }
                        100% { opacity: 0; transform: translateY(-6px) } }
    .flame { animation: lbFlick 1.2s ease-in-out infinite alternate;
