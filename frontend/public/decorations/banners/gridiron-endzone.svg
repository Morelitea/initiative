<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>End zone</title>
  <!-- A kick on its way, with the uprights dead centre so a phone keeps them. -->
  <style>
    .spin { animation: tumble 1.6s linear infinite;
            transform-box: fill-box; transform-origin: 50% 50% }
    @keyframes tumble { to { transform: rotate(360deg) } }
    /* Up off the tee, between the uprights, and away. */
    .kick { animation: flight 5.4s ease-in infinite }
    @keyframes flight {
      0%   { transform: translate(-46px,18px); opacity: 0 }
      6%   { opacity: 1 }
      34%  { transform: translate(-22px,-1px) }
      58%  { transform: translate(0,-4px) }
      80%  { transform: translate(20px,-1px); opacity: 1 }
      92%  { transform: translate(34px,4px); opacity: 0 }
      100% { transform: translate(-46px,18px); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin, .kick { animation: none }
    }
  </style>
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070C16"/><stop offset="100%" stop-color="#101C2A"/>
    </linearGradient>
    <linearGradient id="gturf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E5231"/><stop offset="100%" stop-color="#123822"/>
    </linearGradient>
    <radialGradient id="glight" cx=".5" cy="0" r="1">
      <stop offset="0%" stop-color="#DDF0E4" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#DDF0E4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#gsky)"/>
  <path d="M0 8.6 L0 2.4 C40 1.2 120 1.2 160 2.4 L160 8.6 Z" fill="#0C1622"/>
  <g stroke="#16283A" stroke-width=".4">
    <path d="M0 3.6 C40 2.5 120 2.5 160 3.6"/><path d="M0 5 C40 4 120 4 160 5"/>
    <path d="M0 6.4 C40 5.5 120 5.5 160 6.4"/><path d="M0 7.8 C40 7 120 7 160 7.8"/>
  </g>
  <g fill="#25405A">
    <circle cx="22" cy="4.2" r=".3"/><circle cx="47" cy="6.4" r=".3"/>
    <circle cx="63" cy="3.4" r=".3"/><circle cx="99" cy="5.6" r=".3"/>
    <circle cx="121" cy="3.8" r=".3"/><circle cx="142" cy="6.8" r=".3"/>
  </g>
  <path d="M0 8.6 L160 8.6 L160 40 L0 40 Z" fill="url(#gturf)"/>
  <rect width="160" height="26" y="8.6" fill="url(#glight)"/>
  <!-- End zone, painted solid and hatched. -->
  <path d="M0 8.6 L160 8.6 L160 14 L0 14 Z" fill="#0F3A22"/>
  <g stroke="#17492B" stroke-width=".5">
    <path d="M4 14 L10 8.6"/><path d="M16 14 L22 8.6"/><path d="M28 14 L34 8.6"/>
    <path d="M40 14 L46 8.6"/><path d="M52 14 L58 8.6"/><path d="M64 14 L70 8.6"/>
    <path d="M92 14 L98 8.6"/><path d="M104 14 L110 8.6"/><path d="M116 14 L122 8.6"/>
    <path d="M128 14 L134 8.6"/><path d="M140 14 L146 8.6"/><path d="M152 14 L158 8.6"/>
  </g>
  <!-- Yard lines, spaced wider as they come towards you, with the hashes. -->
  <g stroke="#F0F5F0" fill="none" opacity=".85">
    <path d="M0 14 L160 14" stroke-width=".8"/>
    <path d="M0 17.4 L160 17.4" stroke-width=".6"/>
    <path d="M0 21.6 L160 21.6" stroke-width=".65"/>
    <path d="M0 27 L160 27" stroke-width=".7"/>
    <path d="M0 34 L160 34" stroke-width=".8"/>
  </g>
  <g stroke="#F0F5F0" stroke-width=".45" opacity=".6">
    <path d="M56 15.4 L56 16.2"/><path d="M104 15.4 L104 16.2"/>
    <path d="M56 19.2 L56 20.2"/><path d="M104 19.2 L104 20.2"/>
    <path d="M55 23.9 L55 25.1"/><path d="M105 23.9 L105 25.1"/>
    <path d="M54 29.9 L54 31.4"/><path d="M106 29.9 L106 31.4"/>
  </g>
  <!-- Yard numbers, which is what tells you where on the field this is. -->
  <g fill="none" stroke="#F0F5F0" stroke-width="1" stroke-linecap="round"
     stroke-linejoin="round" opacity=".75">
    <g transform="translate(46 18.4) scale(1.05)">
      <path d="M.2 .5 C.7 0 2.4 0 2.4 1.1 C2.4 1.9 1.6 2.2 1 2.2 C1.6 2.2 2.5 2.5 2.5 3.3
               C2.5 4.4 .7 4.4 .2 3.9"/>
      <path d="M5.3 0 C6 0 6.6 .7 6.6 1.5 L6.6 2.9 C6.6 3.7 6 4.4 5.3 4.4 C4.6 4.4 4 3.7 4 2.9
               L4 1.5 C4 .7 4.6 0 5.3 0 Z"/>
    </g>
    <g transform="translate(106 18.4) scale(1.05)">
      <path d="M1.9 4.4 L1.9 0 L0 3 L2.6 3"/>
      <path d="M5.3 0 C6 0 6.6 .7 6.6 1.5 L6.6 2.9 C6.6 3.7 6 4.4 5.3 4.4 C4.6 4.4 4 3.7 4 2.9
               L4 1.5 C4 .7 4.6 0 5.3 0 Z"/>
    </g>
  </g>
  <!-- The posts. -->
  <g stroke="#F2C023" fill="none" stroke-linecap="round">
    <path d="M80 13.6 L80 9.2" stroke-width="1.3"/>
    <path d="M71.4 9.2 L88.6 9.2" stroke-width="1.2"/>
    <path d="M71.4 9.2 L71.4 1.2" stroke-width="1.2"/>
    <path d="M88.6 9.2 L88.6 1.2" stroke-width="1.2"/>
  </g>
  <g fill="#D89C0C">
    <path d="M71.4 1.2 C71.9 .6 72.6 .4 73.2 .6 C72.6 1.1 72 1.6 71.6 2.4 Z"/>
    <path d="M88.6 1.2 C89.1 .6 89.8 .4 90.4 .6 C89.8 1.1 89.2 1.6 88.8 2.4 Z"/>
  </g>
  <!-- The kick. -->
  <g stroke="#F0F5F0" stroke-width=".4" fill="none" stroke-dasharray="1.4 2.2" opacity=".35">
    <path d="M34 24 C48 11 62 4.6 80 2"/>
  </g>
  <g class="kick">
    <g class="spin">
    <g transform="translate(80 6) rotate(-24)">
      <ellipse cx="0" cy="0" rx="4.4" ry="2.5" fill="#7B4423"/>
      <ellipse cx="0" cy="0" rx="4.4" ry="2.5" fill="none" stroke="#5A2F14" stroke-width=".35"/>
      <path d="M-4.4 0 C-2.6 -1.4 2.6 -1.4 4.4 0" fill="none" stroke="#5A2F14" stroke-width=".3"/>
      <g stroke="#F4EFE6" stroke-width=".38" stroke-linecap="round">
        <path d="M-1.5 -.75 L-1.5 .75"/><path d="M-.5 -.9 L-.5 .9"/>
        <path d="M.5 -.9 L.5 .9"/><path d="M1.5 -.75 L1.5 .75"/>
        <path d="M-1.9 0 L1.9 0"/>
      </g>
      <path d="M-3.4 -1 C-3.8 -.6 -3.9 .6 -3.4 1" fill="none" stroke="#F4EFE6" stroke-width=".38"/>
      <path d="M3.4 -1 C3.8 -.6 3.9 .6 3.4 1" fill="none" stroke="#F4EFE6" stroke-width=".38"/>
    </g>
    </g>
  </g>
</svg>
