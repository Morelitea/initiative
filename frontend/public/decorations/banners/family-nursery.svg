  <g class="mob">
    <path d="M95 7.6 L125 7.6 L125 9.2 L95 9.2 Z" fill="#C4A88E"/>
    <circle cx="110" cy="8.4" r="1.8" fill="#A88E70"/>
    <path d="M96 9.2 L96 16.4" stroke="#C4A88E" stroke-width=".4"/><g transform="translate(96 16.4)"><circle cx="0" cy="0" r="2.6" fill="#F2A8BC"/><circle cx="0" cy="0" r="1.2" fill="#FBDCE4"/></g><path d="M103 9.2 L103 14" stroke="#C4A88E" stroke-width=".4"/><g transform="translate(103 14)"><path d="M-2.6 0 C-2.6 -2.6 0 -3.4 0 -1.4 C0 -3.4 2.6 -2.6 2.6 0 C2.6 1.8 0 3.4 0 3.4 C0 3.4 -2.6 1.8 -2.6 0 Z" fill="#8ECFE4"/></g><path d="M110 9.2 L110 18" stroke="#C4A88E" stroke-width=".4"/><g transform="translate(110 18)"><path d="M0 -2.8 L0.8 -0.8 L2.8 0 L0.8 0.8 L0 2.8 L-0.8 0.8 L-2.8 0 L-0.8 -0.8 Z" fill="#F6CE86"/></g><path d="M117 9.2 L117 14.6" stroke="#C4A88E" stroke-width=".4"/><g transform="translate(117 14.6)"><circle cx="0" cy="0" r="2.4" fill="#C4A2E4"/></g><path d="M124 9.2 L124 16.8" stroke="#C4A88E" stroke-width=".4"/><g transform="translate(124 16.8)"><path d="M-2.6 1.8 C-2.6 -1.6 2.6 -1.6 2.6 1.8 Z" fill="#B9E08E"/></g>
