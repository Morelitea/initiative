<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Nursery</title>
  <!-- The lamp on, the mobile going round, and the ceiling full of stars that
       came out of a nightlight. -->
  <defs>
    <linearGradient id="nrWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2A50"/><stop offset="60%" stop-color="#453C68"/>
      <stop offset="100%" stop-color="#5E4E76"/>
    </linearGradient>
    <radialGradient id="nrGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#F6D89A" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#F6D89A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .st { animation: nrTw 4.6s ease-in-out infinite alternate }
    .s1 { animation-delay: -1.2s } .s2 { animation-delay: -2.3s } .s3 { animation-delay: -3.4s }
    @keyframes nrTw { from { opacity: .2 } to { opacity: .95 } }
    .mob { animation: nrTurn 11s ease-in-out infinite alternate;
           transform-box: view-box; transform-origin: 110px 8px }
    @keyframes nrTurn { from { transform: scaleX(1) } to { transform: scaleX(-1) } }
    .lamp { animation: nrBreathe 6s ease-in-out infinite alternate }
    @keyframes nrBreathe { from { opacity: .7 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .st, .mob, .lamp { animation: none } }
  </style>
  <rect width="160" height="40" fill="url(#nrWall)"/>
