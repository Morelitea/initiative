    <g fill="#D9C2A6"><path d="M91 26 L92.4 26 L92.4 40 L91 40 Z"/><path d="M96 26 L97.4 26 L97.4 40 L96 40 Z"/><path d="M101 26 L102.4 26 L102.4 40 L101 40 Z"/><path d="M106 26 L107.4 26 L107.4 40 L106 40 Z"/><path d="M111 26 L112.4 26 L112.4 40 L111 40 Z"/><path d="M116 26 L117.4 26 L117.4 40 L116 40 Z"/><path d="M121 26 L122.4 26 L122.4 40 L121 40 Z"/><path d="M126 26 L127.4 26 L127.4 40 L126 40 Z"/><path d="M131 26 L132.4 26 L132.4 40 L131 40 Z"/>
    </g>
    <path d="M88 33 L136 33 L136 40 L88 40 Z" fill="#E8DCEC"/>
    <path d="M88 33 C100 31.4 124 31.4 136 33 L136 35.4 C124 34 100 34 88 35.4 Z"
