<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Kente</title>
  <!-- Strip-woven cloth: narrow bands sewn edge to edge, warp one way and weft
       blocks the other. An original arrangement in the tradition's structure
       and palette, not a copy of any named pattern. -->
  <defs>
    <pattern id="warpA" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0E0C10"/>
      <rect x="0" y="0" width="8" height="1.6" fill="#E8B21C"/>
      <rect x="0" y="3.2" width="8" height="1.6" fill="#E8B21C"/>
      <rect x="0" y="6.4" width="8" height="1.6" fill="#E8B21C"/>
    </pattern>
    <pattern id="warpB" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1E7A46"/>
      <rect x="0" y="0" width="1.6" height="8" fill="#E8B21C"/>
      <rect x="3.2" y="0" width="1.6" height="8" fill="#0E0C10"/>
      <rect x="6.4" y="0" width="1.6" height="8" fill="#E8B21C"/>
    </pattern>
    <pattern id="warpC" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#B4231F"/>
      <rect x="0" y="0" width="8" height="2" fill="#0E0C10"/>
      <rect x="0" y="4" width="8" height="2" fill="#E8B21C"/>
    </pattern>
  </defs>
  <rect width="160" height="40" fill="#0E0C10"/>
  <!-- Six strips, each with its own run of blocks. -->
  <g>
    <rect x="0" y="0" width="160" height="6.4" fill="url(#warpA)"/>
    <rect x="0" y="6.4" width="160" height="1" fill="#5C4A16"/>
    <rect x="0" y="7.4" width="160" height="6.4" fill="url(#warpB)"/>
    <rect x="0" y="13.8" width="160" height="1" fill="#12482A"/>
    <rect x="0" y="14.8" width="160" height="6.4" fill="url(#warpC)"/>
    <rect x="0" y="21.2" width="160" height="1" fill="#6E1512"/>
    <rect x="0" y="22.2" width="160" height="6.4" fill="url(#warpA)"/>
    <rect x="0" y="28.6" width="160" height="1" fill="#5C4A16"/>
    <rect x="0" y="29.6" width="160" height="6.4" fill="url(#warpB)"/>
    <rect x="0" y="36" width="160" height="1" fill="#12482A"/>
    <rect x="0" y="37" width="160" height="3" fill="url(#warpC)"/>
  </g>
  <!-- Weft blocks, laid across the warp the way the loom lays them. -->
  <g>
    <rect x="10" y="0" width="12" height="6.4" fill="#B4231F"/>
    <rect x="10" y="1.4" width="12" height="1" fill="#E8B21C"/>
    <rect x="10" y="4" width="12" height="1" fill="#E8B21C"/>
    <rect x="46" y="0" width="12" height="6.4" fill="#1E7A46"/>
    <rect x="46" y="2.4" width="12" height="1.6" fill="#0E0C10"/>
    <rect x="86" y="0" width="12" height="6.4" fill="#B4231F"/>
    <rect x="86" y="1.4" width="12" height="1" fill="#E8B21C"/>
    <rect x="86" y="4" width="12" height="1" fill="#E8B21C"/>
    <rect x="126" y="0" width="12" height="6.4" fill="#1E7A46"/>
    <rect x="126" y="2.4" width="12" height="1.6" fill="#0E0C10"/>

    <rect x="26" y="7.4" width="14" height="6.4" fill="#E8B21C"/>
    <rect x="26" y="9.4" width="14" height="2.4" fill="#B4231F"/>
    <rect x="66" y="7.4" width="14" height="6.4" fill="#E8B21C"/>
    <rect x="66" y="9.4" width="14" height="2.4" fill="#0E0C10"/>
    <rect x="106" y="7.4" width="14" height="6.4" fill="#E8B21C"/>
    <rect x="106" y="9.4" width="14" height="2.4" fill="#B4231F"/>
    <rect x="146" y="7.4" width="14" height="6.4" fill="#E8B21C"/>
    <rect x="146" y="9.4" width="14" height="2.4" fill="#0E0C10"/>

    <rect x="0" y="14.8" width="12" height="6.4" fill="#0E0C10"/>
    <rect x="2" y="16.4" width="8" height="3.2" fill="#E8B21C"/>
    <rect x="40" y="14.8" width="12" height="6.4" fill="#0E0C10"/>
    <rect x="42" y="16.4" width="8" height="3.2" fill="#1E7A46"/>
    <rect x="80" y="14.8" width="12" height="6.4" fill="#0E0C10"/>
    <rect x="82" y="16.4" width="8" height="3.2" fill="#E8B21C"/>
    <rect x="120" y="14.8" width="12" height="6.4" fill="#0E0C10"/>
    <rect x="122" y="16.4" width="8" height="3.2" fill="#1E7A46"/>

    <rect x="18" y="22.2" width="12" height="6.4" fill="#1E7A46"/>
    <rect x="18" y="24.2" width="12" height="2.4" fill="#E8B21C"/>
    <rect x="58" y="22.2" width="12" height="6.4" fill="#B4231F"/>
    <rect x="58" y="24.2" width="12" height="2.4" fill="#E8B21C"/>
    <rect x="98" y="22.2" width="12" height="6.4" fill="#1E7A46"/>
    <rect x="98" y="24.2" width="12" height="2.4" fill="#E8B21C"/>
    <rect x="138" y="22.2" width="12" height="6.4" fill="#B4231F"/>
    <rect x="138" y="24.2" width="12" height="2.4" fill="#E8B21C"/>

    <rect x="34" y="29.6" width="14" height="6.4" fill="#E8B21C"/>
    <rect x="34" y="31.6" width="14" height="2.4" fill="#B4231F"/>
    <rect x="74" y="29.6" width="14" height="6.4" fill="#E8B21C"/>
    <rect x="74" y="31.6" width="14" height="2.4" fill="#0E0C10"/>
    <rect x="114" y="29.6" width="14" height="6.4" fill="#E8B21C"/>
    <rect x="114" y="31.6" width="14" height="2.4" fill="#B4231F"/>
  </g>
  <!-- The seams where the strips were sewn together. -->
  <g stroke="#0E0C10" stroke-width=".4" opacity=".55">
    <path d="M0 6.9 L160 6.9"/><path d="M0 14.3 L160 14.3"/><path d="M0 21.7 L160 21.7"/>
    <path d="M0 29.1 L160 29.1"/><path d="M0 36.5 L160 36.5"/>
  </g>
</svg>
