<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Parade</title>
  <!-- The Progress flag rather than the six stripes alone: the badge in this
       pack is the six everyone knows, and a banner has the room the badge
       does not to carry the chevron as well. -->
  <style>
    .sheen { animation: sweep 11s ease-in-out infinite }
    @keyframes sweep { 0%,100% { transform: translateX(-40px) } 50% { transform: translateX(200px) } }
    @media (prefers-reduced-motion: reduce) { .sheen { animation: none; opacity: 0 } }
  </style>
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="160" height="7" fill="#E40303"/>
  <rect x="0" y="7" width="160" height="6" fill="#FF8C00"/>
  <rect x="0" y="13" width="160" height="7" fill="#FFED00"/>
  <rect x="0" y="20" width="160" height="7" fill="#008026"/>
  <rect x="0" y="27" width="160" height="6" fill="#004DFF"/>
  <rect x="0" y="33" width="160" height="7" fill="#750787"/>
  <g>
    <path d="M0 0 L30 20 L0 40 Z" fill="#000000"/>
    <path d="M-6 0 L24 20 L-6 40 Z" fill="#613915"/>
    <path d="M-12 0 L18 20 L-12 40 Z" fill="#74D7EE"/>
    <path d="M-18 0 L12 20 L-18 40 Z" fill="#FFAFC8"/>
    <path d="M-24 0 L6 20 L-24 40 Z" fill="#FFFFFF"/>
  </g>
  <rect class="sheen" x="0" y="0" width="40" height="40" fill="url(#gloss)"/>
</svg>
