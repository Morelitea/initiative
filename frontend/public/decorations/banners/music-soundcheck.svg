<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Soundcheck</title>
  <!-- The room an hour before doors: one mic in the middle, the kit and the
       stack either side of it, and the meter running the whole back wall. -->
  <style>
    /* Each bar has its own tempo, so the row never marches in step — which is
       the difference between a band and a metronome. */
    .bar { animation: bounce 1.1s ease-in-out infinite alternate;
           transform-box: fill-box; transform-origin: 50% 100% }
    @keyframes bounce { from { transform: scaleY(.22) } to { transform: scaleY(1) } }
    .beam { animation: sweep 7s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 0 }
    .b2 { animation-duration: 9s; animation-delay: -3s }
    @keyframes sweep { from { transform: rotate(-8deg) } to { transform: rotate(8deg) } }
    .haze { animation: drift 16s ease-in-out infinite alternate }
    @keyframes drift { from { transform: translateX(-4px) } to { transform: translateX(4px) } }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: scaleY(.7) }
      .beam, .haze { animation: none }
    }
  </style>
  <defs>
    <linearGradient id="venue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080714"/><stop offset="100%" stop-color="#181430"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151228"/><stop offset="100%" stop-color="#0A0916"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#venue)"/>

