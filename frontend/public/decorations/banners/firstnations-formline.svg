<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Formline</title>
  <!-- The Northwest Coast design system by its own parts: one continuous
       primary line, swelling at the joints and drawn in at the waists, with
       ovoids sitting in it and U-forms springing off it — black primary, red
       and blue-green within. An original arrangement of the elements, and no
       crest: crests belong to families and are not ours to draw. -->
  <style>
    .firelight { animation: warm 17s ease-in-out infinite alternate }
    @keyframes warm { from { transform: translateX(-18px); opacity: .14 }
                      to { transform: translateX(18px); opacity: .32 } }
    @media (prefers-reduced-motion: reduce) { .firelight { animation: none } }
  </style>
