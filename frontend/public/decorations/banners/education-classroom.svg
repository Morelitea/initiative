<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Classroom</title>
  <!-- The wall it all happens on: the letters up over the board, the lesson
       going on to it, and the small chairs waiting. -->
  <defs>
    <linearGradient id="clWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2E4C6"/><stop offset="100%" stop-color="#DCC79E"/>
    </linearGradient>
    <linearGradient id="clSlate" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0%" stop-color="#35493D"/><stop offset="100%" stop-color="#22322B"/>
    </linearGradient>
  </defs>
  <style>
    .ch { fill: none; stroke: #F2F6EE; stroke-width: 1.1; stroke-linecap: round;
          stroke-linejoin: round; animation: clWrite 11s ease-in-out infinite }
    @keyframes clWrite { 0%, 92%, 100% { opacity: .12 } 34%, 72% { opacity: .95 } }
    .mob { animation: clTurn 14s ease-in-out infinite alternate;
           transform-box: view-box; transform-origin: 150px 0px }
    @keyframes clTurn { from { transform: rotate(-6deg) } to { transform: rotate(6deg) } }
    @media (prefers-reduced-motion: reduce) { .ch, .mob { animation: none } .ch { opacity: .7 } }
  </style>
  <rect width="160" height="40" fill="url(#clWall)"/>
