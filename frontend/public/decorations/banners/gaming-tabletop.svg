    <path d="M71 9.4 C71 5.6 75 4 80 4 C85 4 89 5.6 89 9.4 Z" fill="#4A3A6B"/>
    <path d="M71 9.4 C71 5.6 75 4 80 4 C77 5.4 75.4 7.2 74.8 9.4 Z" fill="#6B54A0"/>
    <path class="warm" d="M71.6 9.4 L88.4 9.4 L88.4 10.3 L71.6 10.3 Z" fill="#FFE7B8"/>
  </g>

