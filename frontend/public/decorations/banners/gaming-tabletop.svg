<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Games night</title>
  <!-- Four hours in, and somebody is still reading the rules. -->
  <style>
    .warm { animation: glow 8s ease-in-out infinite alternate }
    @keyframes glow { from { opacity: .45 } to { opacity: .82 } }
    .tap { animation: fidget 3.6s ease-in-out infinite;
           transform-box: fill-box; transform-origin: 50% 100% }
    @keyframes fidget { 0%,70% { transform: translateY(0) rotate(0) }
                        78% { transform: translateY(-1.2px) rotate(-7deg) }
                        86% { transform: translateY(0) rotate(5deg) }
                        100% { transform: translateY(0) rotate(0) } }
    .sway { animation: hang 9s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 0 }
    @keyframes hang { from { transform: rotate(-1.1deg) } to { transform: rotate(1.1deg) } }
    @media (prefers-reduced-motion: reduce) { .warm, .tap, .sway { animation: none } }
  </style>
  <defs>
    <linearGradient id="gameroom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140E22"/><stop offset="100%" stop-color="#2A1E3E"/>
    </linearGradient>
    <linearGradient id="gametable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A5432"/><stop offset="100%" stop-color="#3E2A18"/>
    </linearGradient>
    <radialGradient id="pendant" cx=".5" cy=".08" r=".8">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#FFD79A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#gameroom)"/>
  <ellipse class="warm" cx="80" cy="4" rx="62" ry="28" fill="url(#pendant)"/>

  <!-- The table, seen from where you are sitting. -->
  <path d="M0 17 C30 13.6 60 12.4 80 12.4 C100 12.4 130 13.6 160 17 L160 40 L0 40 Z"
        fill="url(#gametable)"/>
  <path d="M0 17 C30 13.6 60 12.4 80 12.4 C100 12.4 130 13.6 160 17 L160 17.9
           C130 14.5 100 13.3 80 13.3 C60 13.3 30 14.5 0 17.9 Z" fill="#A87C48"/>
  <g stroke="#5A3A22" stroke-width=".35" opacity=".45" fill="none">
    <path d="M0 24 C40 21.6 120 21.6 160 24"/><path d="M0 31 C40 29 120 29 160 31"/>
  </g>

