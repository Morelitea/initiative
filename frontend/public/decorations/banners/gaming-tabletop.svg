<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Games night</title>
  <!-- Four hours in, and somebody is still reading the rules. -->
  <style>
    .warm { animation: glow 8s ease-in-out infinite alternate }
    @keyframes glow { from { opacity: .45 } to { opacity: .8 } }
    .tap { animation: fidget 3.4s ease-in-out infinite;
           transform-box: fill-box; transform-origin: 50% 100% }
    @keyframes fidget { 0%,72% { transform: rotate(0) } 80% { transform: rotate(-9deg) }
                        88% { transform: rotate(6deg) } 100% { transform: rotate(0) } }
    @media (prefers-reduced-motion: reduce) { .warm, .tap { animation: none } }
  </style>
  <defs>
    <linearGradient id="gameroom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140E22"/><stop offset="100%" stop-color="#2A1E3E"/>
    </linearGradient>
    <linearGradient id="gametable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4A2E"/><stop offset="100%" stop-color="#3E2A18"/>
    </linearGradient>
    <radialGradient id="pendant" cx=".5" cy=".1" r=".8">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFD79A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#gameroom)"/>
  <ellipse class="warm" cx="80" cy="6" rx="60" ry="26" fill="url(#pendant)"/>
  <!-- The lamp over the table. -->
  <path d="M79.4 0 L80.6 0 L80.6 4 L79.4 4 Z" fill="#3A3050"/>
  <path d="M72 9 C72 5.4 76 4 80 4 C84 4 88 5.4 88 9 Z" fill="#4A3A6B"/>
  <path class="warm" d="M72.6 9 L87.4 9 L87.4 9.8 L72.6 9.8 Z" fill="#FFE7B8"/>

  <path d="M0 24 L160 24 L160 40 L0 40 Z" fill="url(#gametable)"/>
  <path d="M0 24 L160 24 L160 24.8 L0 24.8 Z" fill="#8A6034"/>

  <!-- The board, mid-game. -->
  <g transform="rotate(-2 80 25)">
    <path d="M56 14.4 L100 14.4 L100 35 L56 35 Z" fill="#2A2038"/>
    <g transform="translate(-1.6 -1.6)"><rect x="58.0" y="16.0" width="5.4" height="3.6" fill="#6B5A94"/><rect x="63.4" y="16.0" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="68.8" y="16.0" width="5.4" height="3.6" fill="#6B5A94"/><rect x="74.2" y="16.0" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="79.6" y="16.0" width="5.4" height="3.6" fill="#6B5A94"/><rect x="85.0" y="16.0" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="90.4" y="16.0" width="5.4" height="3.6" fill="#6B5A94"/><rect x="95.8" y="16.0" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="58.0" y="19.6" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="63.4" y="19.6" width="5.4" height="3.6" fill="#6B5A94"/><rect x="68.8" y="19.6" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="74.2" y="19.6" width="5.4" height="3.6" fill="#6B5A94"/><rect x="79.6" y="19.6" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="85.0" y="19.6" width="5.4" height="3.6" fill="#6B5A94"/><rect x="90.4" y="19.6" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="95.8" y="19.6" width="5.4" height="3.6" fill="#6B5A94"/><rect x="58.0" y="23.2" width="5.4" height="3.6" fill="#6B5A94"/><rect x="63.4" y="23.2" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="68.8" y="23.2" width="5.4" height="3.6" fill="#6B5A94"/><rect x="74.2" y="23.2" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="79.6" y="23.2" width="5.4" height="3.6" fill="#6B5A94"/><rect x="85.0" y="23.2" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="90.4" y="23.2" width="5.4" height="3.6" fill="#6B5A94"/><rect x="95.8" y="23.2" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="58.0" y="26.8" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="63.4" y="26.8" width="5.4" height="3.6" fill="#6B5A94"/><rect x="68.8" y="26.8" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="74.2" y="26.8" width="5.4" height="3.6" fill="#6B5A94"/><rect x="79.6" y="26.8" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="85.0" y="26.8" width="5.4" height="3.6" fill="#6B5A94"/><rect x="90.4" y="26.8" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="95.8" y="26.8" width="5.4" height="3.6" fill="#6B5A94"/><rect x="58.0" y="30.4" width="5.4" height="3.6" fill="#6B5A94"/><rect x="63.4" y="30.4" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="68.8" y="30.4" width="5.4" height="3.6" fill="#6B5A94"/><rect x="74.2" y="30.4" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="79.6" y="30.4" width="5.4" height="3.6" fill="#6B5A94"/><rect x="85.0" y="30.4" width="5.4" height="3.6" fill="#4A3A6B"/><rect x="90.4" y="30.4" width="5.4" height="3.6" fill="#6B5A94"/><rect x="95.8" y="30.4" width="5.4" height="3.6" fill="#4A3A6B"/></g>
    <path d="M56 14.4 L100 14.4 L100 35 L56 35 Z" fill="none" stroke="#8A76B4" stroke-width=".6"/>
  </g>
  <g>
    <g transform="translate(64 22) rotate(-6) scale(0.52)"><path d="M0 9.4 C-4.4 9.4 -6.4 8.6 -6.4 6.6 C-6.4 4.2 -4.6 2.2 -2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C2.4 -6 4.4 -4.4 4.4 -2.2 C4.4 -.8 3.6 .4 2.2 1.2 C4.6 2.2 6.4 4.2 6.4 6.6 C6.4 8.6 4.4 9.4 0 9.4 Z" fill="#E8483A"/><path d="M-2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C-1.2 -5 -1.8 -3.8 -1.8 -2.2 C-1.8 -.8 -1.4 .4 -.6 1.2 Z" fill="#FFFFFF" opacity=".22"/></g><g transform="translate(72 26) rotate(4) scale(0.52)"><path d="M0 9.4 C-4.4 9.4 -6.4 8.6 -6.4 6.6 C-6.4 4.2 -4.6 2.2 -2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C2.4 -6 4.4 -4.4 4.4 -2.2 C4.4 -.8 3.6 .4 2.2 1.2 C4.6 2.2 6.4 4.2 6.4 6.6 C6.4 8.6 4.4 9.4 0 9.4 Z" fill="#4CE08A"/><path d="M-2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C-1.2 -5 -1.8 -3.8 -1.8 -2.2 C-1.8 -.8 -1.4 .4 -.6 1.2 Z" fill="#FFFFFF" opacity=".22"/></g>
    <g transform="translate(80 20) rotate(-2) scale(0.52)"><path d="M0 9.4 C-4.4 9.4 -6.4 8.6 -6.4 6.6 C-6.4 4.2 -4.6 2.2 -2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C2.4 -6 4.4 -4.4 4.4 -2.2 C4.4 -.8 3.6 .4 2.2 1.2 C4.6 2.2 6.4 4.2 6.4 6.6 C6.4 8.6 4.4 9.4 0 9.4 Z" fill="#39E8FF"/><path d="M-2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C-1.2 -5 -1.8 -3.8 -1.8 -2.2 C-1.8 -.8 -1.4 .4 -.6 1.2 Z" fill="#FFFFFF" opacity=".22"/></g><g transform="translate(88 27) rotate(8) scale(0.52)"><path d="M0 9.4 C-4.4 9.4 -6.4 8.6 -6.4 6.6 C-6.4 4.2 -4.6 2.2 -2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C2.4 -6 4.4 -4.4 4.4 -2.2 C4.4 -.8 3.6 .4 2.2 1.2 C4.6 2.2 6.4 4.2 6.4 6.6 C6.4 8.6 4.4 9.4 0 9.4 Z" fill="#FFC83D"/><path d="M-2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C-1.2 -5 -1.8 -3.8 -1.8 -2.2 C-1.8 -.8 -1.4 .4 -.6 1.2 Z" fill="#FFFFFF" opacity=".22"/></g>
    <g transform="translate(94 21) rotate(-5) scale(0.52)"><path d="M0 9.4 C-4.4 9.4 -6.4 8.6 -6.4 6.6 C-6.4 4.2 -4.6 2.2 -2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C2.4 -6 4.4 -4.4 4.4 -2.2 C4.4 -.8 3.6 .4 2.2 1.2 C4.6 2.2 6.4 4.2 6.4 6.6 C6.4 8.6 4.4 9.4 0 9.4 Z" fill="#FF5FD2"/><path d="M-2.2 1.2 C-3.6 .4 -4.4 -.8 -4.4 -2.2 C-4.4 -4.4 -2.4 -6 0 -6 C-1.2 -5 -1.8 -3.8 -1.8 -2.2 C-1.8 -.8 -1.4 .4 -.6 1.2 Z" fill="#FFFFFF" opacity=".22"/></g>
  </g>

  <!-- Dice, thrown. -->
  <g>
    <g class="tap">
      <rect x="42" y="27" width="7" height="7" rx="1.4" fill="#EFEAF8"
            transform="rotate(-12 45.5 30.5)"/>
      <circle cx="44.00" cy="29.00" r="0.42" fill="#2A2038"/><circle cx="47.00" cy="29.00" r="0.42" fill="#2A2038"/><circle cx="45.50" cy="30.50" r="0.42" fill="#2A2038"/><circle cx="44.00" cy="32.00" r="0.42" fill="#2A2038"/><circle cx="47.00" cy="32.00" r="0.42" fill="#2A2038"/>
    </g>
    <rect x="34" y="30.4" width="6" height="6" rx="1.2" fill="#EFEAF8"
          transform="rotate(16 37 33.4)"/>
    <circle cx="35.50" cy="31.90" r="0.38" fill="#2A2038"/><circle cx="37.00" cy="33.40" r="0.38" fill="#2A2038"/><circle cx="38.50" cy="34.90" r="0.38" fill="#2A2038"/>
  </g>

  <!-- A hand of cards, face down, and the rules nobody has finished. -->
  <g>
    <g transform="rotate(-14 116 31)">
      <rect x="108" y="24" width="9" height="13" rx="1.2" fill="#8E3A5A"/>
      <rect x="109.4" y="25.4" width="6.2" height="10.2" rx=".8" fill="#C46A88" opacity=".55"/>
    </g>
    <g transform="rotate(-4 122 31)">
      <rect x="115" y="24" width="9" height="13" rx="1.2" fill="#8E3A5A"/>
      <rect x="116.4" y="25.4" width="6.2" height="10.2" rx=".8" fill="#C46A88" opacity=".55"/>
    </g>
    <g transform="rotate(7 128 31)">
      <rect x="122" y="24" width="9" height="13" rx="1.2" fill="#8E3A5A"/>
      <rect x="123.4" y="25.4" width="6.2" height="10.2" rx=".8" fill="#C46A88" opacity=".55"/>
    </g>
  </g>
  <g transform="rotate(6 142 31)">
    <path d="M134 26 L152 26 L152 36 L134 36 Z" fill="#EFEAF8"/>
    <path d="M134 26 L143 26 L143 36 L134 36 Z" fill="#DCD4EC"/>
    <g stroke="#A89CC4" stroke-width=".4">
      <path d="M136 29 L141 29"/><path d="M136 31 L141 31"/><path d="M136 33 L140 33"/>
      <path d="M145 29 L150 29"/><path d="M145 31 L150 31"/><path d="M145 33 L149 33"/>
    </g>
  </g>
  <!-- Snacks, obviously. -->
  <g transform="translate(18 31)">
    <path d="M-7 0 C-7 -4.4 7 -4.4 7 0 C7 3.4 -7 3.4 -7 0 Z" fill="#4A3A6B"/>
    <ellipse cx="0" cy="-1.6" rx="6.4" ry="2.4" fill="#2A2038"/>
    <g fill="#E8C43A">
      <circle cx="-3" cy="-2" r="1.3"/><circle cx="0" cy="-2.6" r="1.5"/>
      <circle cx="3" cy="-1.8" r="1.2"/><circle cx="-1.4" cy="-3.4" r="1.1"/>
    </g>
  </g>
</svg>
