<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Commencement</title>
  <!-- The four seconds at the end. Caps up, tassels turning, and nobody
       catching their own. -->
  <defs>
    <filter id="cmSoft" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="cmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E4C86"/><stop offset="52%" stop-color="#7E6AA0"/>
      <stop offset="100%" stop-color="#E8A860"/>
    </linearGradient>
  </defs>
  <style>
    .cap { animation: cmToss var(--d) ease-in-out infinite; animation-delay: var(--dl);
           transform-box: view-box; transform-origin: var(--x) 22px }
    @keyframes cmToss {
      0%   { transform: translateY(12px) }
      50%  { transform: translateY(-16px) }
      100% { transform: translateY(12px) }
    }
    .spin { animation: cmSpin var(--d) linear infinite; animation-delay: var(--dl);
            transform-box: fill-box; transform-origin: 50% 50% }
    @keyframes cmSpin { to { transform: rotate(var(--r)) } }
    .cf { animation: cmFall 9s linear infinite }
    .f1 { animation-duration: 12s; animation-delay: -3s }
    .f2 { animation-duration: 7.5s; animation-delay: -5s }
    .f3 { animation-duration: 10.5s; animation-delay: -7s }
    .f4 { animation-duration: 8.4s; animation-delay: -1.5s }
    @keyframes cmFall { 0% { opacity: 0; transform: translateY(-6px) }
                        18% { opacity: .9 } 82% { opacity: .9 }
                        100% { opacity: 0; transform: translateY(14px) } }
    @media (prefers-reduced-motion: reduce) { .cap, .spin, .cf { animation: none } }
  </style>
  <rect width="160" height="40" fill="url(#cmSky)"/>
  <g fill="#F6E2C0" opacity=".22" filter="url(#cmSoft)">
    <ellipse cx="30" cy="10" rx="16" ry="4"/><ellipse cx="112" cy="7" rx="20" ry="4.4"/>
  </g>
