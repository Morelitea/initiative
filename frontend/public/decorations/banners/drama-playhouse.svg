    <path d="M66 28.6 L94 28.6 L94 9 L66 9 Z"/>
  </g>
  <g fill="#C9A063" opacity=".75">
    <circle cx="80" cy="14" r="3.4"/>
    <path d="M80 17.4 C77.4 19.4 76 22 76 25 L84 25 C84 22 82.6 19.4 80 17.4 Z"/>
  </g>
  <g fill="#8E1B28">
    <path d="M66 9 L74 9 C72 15 72 22.6 74 28.6 L66 28.6 Z"/>
    <path d="M94 9 L86 9 C88 15 88 22.6 86 28.6 L94 28.6 Z"/>
  </g>
