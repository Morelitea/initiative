      <stop offset="0%" stop-color="#5A79A8"/><stop offset="100%" stop-color="#C9B48E"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#skyO)"/>
  <!-- Galleries, curving away either side. -->
  <path d="M0 40 L0 6 C24 2 48 0 80 0 C112 0 136 2 160 6 L160 40 Z" fill="#E4D3AC"/>
  <g fill="#C9B48E">
    <path d="M0 14 C24 10.6 48 9 80 9 C112 9 136 10.6 160 14 L160 21
             C136 17.6 112 16 80 16 C48 16 24 17.6 0 21 Z"/>
    <path d="M0 27 C24 23.6 48 22 80 22 C112 22 136 23.6 160 27 L160 32
             C136 28.6 112 27 80 27 C48 27 24 28.6 0 32 Z"/>
  </g>
  <g stroke="#8A6A44" stroke-width="1.4" fill="none">
    <path d="M0 14 C24 10.6 48 9 80 9 C112 9 136 10.6 160 14"/>
    <path d="M0 21 C24 17.6 48 16 80 16 C112 16 136 17.6 160 21"/>
    <path d="M0 27 C24 23.6 48 22 80 22 C112 22 136 23.6 160 27"/>
    <path d="M0 32 C24 28.6 48 27 80 27 C112 27 136 28.6 160 32"/>
    <path d="M14 12.4 L14 30.6"/><path d="M34 10.6 L34 28.6"/><path d="M54 9.6 L54 27.4"/>
    <path d="M106 9.6 L106 27.4"/><path d="M126 10.6 L126 28.6"/><path d="M146 12.4 L146 30.6"/>
  </g>
  <g fill="#6B4A2A" opacity=".5">
    <ellipse cx="24" cy="18.6" rx="2.6" ry="2.2"/><ellipse cx="44" cy="17.4" rx="2.6" ry="2.2"/>
    <ellipse cx="116" cy="17.4" rx="2.6" ry="2.2"/><ellipse cx="136" cy="18.6" rx="2.6" ry="2.2"/>
    <ellipse cx="24" cy="30" rx="2.6" ry="2.2"/><ellipse cx="136" cy="30" rx="2.6" ry="2.2"/>
  </g>
  <!-- The thrust stage, and the two pillars holding the heavens up. -->
  <path d="M60 40 L100 40 L100 30 L60 30 Z" fill="#8A6A44"/>
  <path d="M58 30 L102 30 L102 28.6 L58 28.6 Z" fill="#A87C48"/>
  <path d="M62 28.6 L66 28.6 L66 8 L62 8 Z" fill="#7A5330"/>
  <path d="M94 28.6 L98 28.6 L98 8 L94 8 Z" fill="#7A5330"/>
  <path d="M58 9 L102 9 L102 5.4 L58 5.4 Z" fill="#5E3F22"/>
  <path d="M58 5.4 L102 5.4 L80 0 Z" fill="#4A3018"/>
