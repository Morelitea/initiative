    <path d="M13.4 22.6 C13.6 21.6 14 21 14 20.4 C14 21 14.4 21.6 14.6 22.6"/>
    <path d="M19.4 22 C19.6 21 20 20.4 20 19.8 C20 20.4 20.4 21 20.6 22"/>
