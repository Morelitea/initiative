<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Manor</title>
  <!-- The one at the end of the drive, with one light on. -->
  <style>
    .lit { animation: flick 5s ease-in-out infinite }
    .l2 { animation-delay: -1.8s }
    @keyframes flick { 0%,100% { opacity: 1 } 44% { opacity: .5 } 56% { opacity: .9 } }
    @media (prefers-reduced-motion: reduce) { .lit { animation: none } }
  </style>
  <defs>
    <linearGradient id="mnight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0616"/><stop offset="100%" stop-color="#231239"/>
    </linearGradient>
    <radialGradient id="mhaze" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#4A2A66" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#4A2A66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#mnight)"/>
  <ellipse cx="80" cy="26" rx="76" ry="12" fill="url(#mhaze)"/>
  <circle cx="118" cy="8" r="5" fill="#F6EDD2" opacity=".9"/>
  <g fill="#F4E9C8">
    <circle cx="16" cy="5" r=".3" opacity=".7"/><circle cx="44" cy="8" r=".26" opacity=".6"/>
    <circle cx="66" cy="4" r=".3" opacity=".65"/><circle cx="142" cy="6" r=".28" opacity=".6"/>
  </g>
