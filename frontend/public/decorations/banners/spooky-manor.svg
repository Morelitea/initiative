  <path d="M50 14.6 L80 4 L110 14.6 Z" fill="#0A0512"/>
  <path d="M60 30 L60 8.6 L68 8.6 L68 30 Z" fill="#0C0716"/>
  <path d="M58 9 L70 9 L64 2.6 Z" fill="#0A0512"/>
  <path d="M96 30 L96 10.6 L104 10.6 L104 30 Z" fill="#0C0716"/>
  <path d="M94 11 L106 11 L100 4.6 Z" fill="#0A0512"/>
  <g fill="#E8A33A">
    <path class="lit" d="M62 18 L66 18 L66 23 L62 23 Z"/>
    <path class="lit l2" d="M98 20 L102 20 L102 24.6 L98 24.6 Z" opacity=".5"/>
    <path class="lit" d="M74 20 L78 20 L78 24 L74 24 Z" opacity=".35"/>
  </g>
  <path d="M84 30 L84 22 C84 20 86 19 88 19 C90 19 92 20 92 22 L92 30 Z" fill="#1A0E26"/>
