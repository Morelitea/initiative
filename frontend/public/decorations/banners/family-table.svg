<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>The table</title>
  <!-- From above, because a table laid for people is a plan rather than a
       view: places down both sides, one of them smaller, and whatever is in
       the middle still warm. -->
  <defs>
    <linearGradient id="tbOak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E5630"/><stop offset="50%" stop-color="#94693C"/>
      <stop offset="100%" stop-color="#6E4726"/>
    </linearGradient>
    <radialGradient id="tbLamp" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FFE0A8" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#FFE0A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tbFlame" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FFEBB4" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#F2A03C" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#F2A03C" stop-opacity="0"/>
    </radialGradient>
    <filter id="tbSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <style>
    .glow { animation: tbWarm 7s ease-in-out infinite alternate }
    @keyframes tbWarm { from { opacity: .74 } to { opacity: 1 } }
    .wick { animation: tbFlicker 1.7s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: center }
    .w2 { animation-duration: 2.3s; animation-delay: -.8s }
    @keyframes tbFlicker { from { transform: scale(.84); opacity: .7 }
                           to { transform: scale(1.12); opacity: 1 } }
    .steam { animation: tbRise 5.5s ease-out infinite }
    .v2 { animation-delay: -1.8s } .v3 { animation-delay: -3.6s }
    @keyframes tbRise { 0% { opacity: 0; transform: scale(.5) }
                        35% { opacity: .38 }
                        100% { opacity: 0; transform: scale(1.5) } }
    @media (prefers-reduced-motion: reduce) {
      .glow, .wick, .steam { animation: none } .steam { opacity: 0 } }
  </style>
