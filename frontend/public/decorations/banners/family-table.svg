    <path d="M80 22.6 C84.6 22.6 88.4 24.6 88.4 28.6 C88.4 30.4 84.6 31.6 80 31.6 Z"
          fill="#9C4A32" opacity=".5"/>
    <ellipse cx="80" cy="23.4" rx="8" ry="2.4" fill="#E8B48E"/>
    <ellipse cx="80" cy="23" rx="6.4" ry="1.8" fill="#F2CDA8"/>
  </g>
  <g fill="none" stroke="#F6EEDE" stroke-width="1" stroke-linecap="round">
    <path class="steam" d="M76 21 C74.4 18 77 16 75.4 13"/>
    <path class="steam v2" d="M80 20.6 C78.4 17.6 81 15.6 79.4 12.6"/>
    <path class="steam v3" d="M84 21 C82.4 18 85 16 83.4 13"/>
  </g>
</svg>
