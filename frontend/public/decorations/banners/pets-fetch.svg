<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Fetch</title>
  <!-- Best hour of the day, and he knows it. -->
  <style>
    .bound { animation: hop 1.1s ease-in-out infinite;
             transform-box: fill-box; transform-origin: 50% 100% }
    @keyframes hop { 0%,100% { transform: translateY(0) rotate(-2deg) }
                     45% { transform: translateY(-3.2px) rotate(3deg) } }
    .ear { animation: flap 1.1s ease-in-out infinite;
           transform-box: fill-box; transform-origin: 50% 0 }
    @keyframes flap { 0%,100% { transform: rotate(6deg) } 45% { transform: rotate(-20deg) } }
    .wag { animation: swish .55s ease-in-out infinite alternate;
           transform-box: fill-box; transform-origin: 0% 100% }
    @keyframes swish { from { transform: rotate(-24deg) } to { transform: rotate(24deg) } }
    .tongue { animation: loll 1.1s ease-in-out infinite;
              transform-box: fill-box; transform-origin: 50% 0 }
    @keyframes loll { 0%,100% { transform: rotate(-7deg) } 45% { transform: rotate(9deg) } }
    .ball { animation: arc 2.6s ease-in-out infinite }
    @keyframes arc { 0% { transform: translate(0,0) } 100% { transform: translate(56px,0) } }
    .ballhop { animation: bounce 1.3s ease-in-out infinite;
               transform-box: fill-box; transform-origin: 50% 100% }
    @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-13px) } }
    .grass { animation: breeze 5s ease-in-out infinite alternate;
             transform-box: view-box; transform-origin: 80px 40px }
    @keyframes breeze { from { transform: skewX(-1.6deg) } to { transform: skewX(1.6deg) } }
    @media (prefers-reduced-motion: reduce) {
      .bound, .ear, .wag, .tongue, .ball, .ballhop, .grass { animation: none } }
  </style>
  <defs>
    <linearGradient id="parksky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EBCE4"/><stop offset="100%" stop-color="#CFE8F0"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EA84E"/><stop offset="100%" stop-color="#3E7A38"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A055"/><stop offset="100%" stop-color="#A87232"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#parksky)"/>
  <g fill="#FFFFFF" opacity=".7">
    <ellipse cx="26" cy="7" rx="11" ry="2.6"/><ellipse cx="33" cy="5.6" rx="7" ry="2.2"/>
    <ellipse cx="132" cy="6" rx="9" ry="2.2"/><ellipse cx="126" cy="7.2" rx="6" ry="1.8"/>
  </g>
  <!-- Trees, back a bit. -->
  <g>
    <path d="M14 24 L14 18" stroke="#6B4526" stroke-width="1.6"/>
    <circle cx="14" cy="15" r="5.4" fill="#4E8E4A"/><circle cx="10.4" cy="17" r="3.6" fill="#5E9E56"/>
    <path d="M148 24 L148 17.4" stroke="#6B4526" stroke-width="1.8"/>
    <circle cx="148" cy="14" r="6" fill="#4E8E4A"/><circle cx="152.4" cy="16.4" r="4" fill="#5E9E56"/>
  </g>
  <path d="M0 22 C26 20.6 54 22.4 82 21.4 C110 20.4 138 22 160 21 L160 26 L0 26 Z"
        fill="#8ABE64" opacity=".7"/>
  <path d="M0 25 C28 23.6 58 25.4 88 24.4 C116 23.4 140 25 160 24 L160 40 L0 40 Z"
        fill="url(#lawn)"/>

  <!-- Him. -->
  <g transform="translate(74 34)">
    <ellipse cx="1" cy="2.6" rx="15" ry="2.4" fill="#2E5E2A" opacity=".35"/>
    <g class="bound">
      <!-- Back legs, front legs. -->
      <g stroke="#A87232" stroke-width="2.8" stroke-linecap="round" fill="none">
        <path d="M7.4 -2 L9.6 2"/><path d="M4.6 -2 L5.6 2.2"/>
        <path d="M-6 -2 L-8 2"/><path d="M-3.4 -2 L-4 2.2"/>
      </g>
      <!-- Body. -->
      <path d="M-8.6 -3 C-9.6 -7.4 -6.4 -10.4 -1 -10.6 C4.6 -10.8 9 -8.6 9.8 -4.8
               C10.4 -2.2 8.6 -1 4 -1 L-4.6 -1 C-7.4 -1 -8.4 -1.6 -8.6 -3 Z" fill="url(#coat)"/>
      <path d="M-6 -2.2 C-2 -.8 4 -.8 8 -2.4 C7.4 -1.2 5.6 -.6 2 -.6 C-2 -.6 -5 -1.2 -6 -2.2 Z"
            fill="#F0D0A0" opacity=".8"/>
      <!-- Tail, going. -->
      <g class="wag">
        <path d="M9.4 -6.6 C12.6 -8.2 14.6 -10.4 15.2 -13" fill="none" stroke="#C9954A"
              stroke-width="2.6" stroke-linecap="round"/>
      </g>
      <!-- Head. -->
      <g transform="translate(-11.4 -11.4)">
        <path d="M-4.6 2.6 C-5.4 -1.4 -3 -4.4 .6 -4.4 C4.2 -4.4 6.2 -2 5.8 1.4
                 C5.4 4.4 3 6 -.2 6 C-3 6 -4.2 4.8 -4.6 2.6 Z" fill="#E0AC62"/>
        <!-- Muzzle. -->
        <path d="M-4.8 2.4 C-7.4 2.2 -9 3.2 -9 4.6 C-9 6 -7.4 6.8 -4.6 6.6
                 C-2.6 6.4 -1.6 5.2 -1.8 3.8 Z" fill="#F0D0A0"/>
        <ellipse cx="-8.6" cy="4.2" rx="1.5" ry="1.2" fill="#2E2116"/>
        <g class="tongue">
          <path d="M-6.4 6.2 C-6.4 8.4 -5.6 9.6 -4.4 9.6 C-3.4 9.6 -2.8 8.4 -3 6.4 Z"
                fill="#E07A82"/>
          <path d="M-4.7 6.4 L-4.7 9" stroke="#C4626A" stroke-width=".4"/>
        </g>
        <path d="M-6.6 5.8 C-5.4 6.6 -3.8 6.6 -2.6 5.8" fill="none" stroke="#2E2116"
              stroke-width=".5" stroke-linecap="round"/>
        <!-- Eye, and a brow that means it. -->
        <circle cx="-1.6" cy="1" r="1.1" fill="#2E2116"/>
        <circle cx="-1.2" cy=".6" r=".38" fill="#FFFFFF"/>
        <path d="M-3 -.8 C-2.4 -1.4 -1 -1.5 -.2 -1" fill="none" stroke="#A87232"
              stroke-width=".5" stroke-linecap="round"/>
        <!-- Ear, flapping. -->
        <g class="ear">
          <path d="M2.6 -2.6 C6.4 -2.6 8 -.2 7.6 3.6 C7.4 6 6 7.4 4.4 7 C2.6 6.6 1.6 4.4 1.8 1 Z"
                fill="#A87232"/>
        </g>
      </g>
      <!-- Collar. -->
      <path d="M-8.6 -8.6 C-6.6 -7 -4.4 -6.6 -2.4 -7.2" fill="none" stroke="#C9564C"
            stroke-width="1.6"/>
      <circle cx="-4.6" cy="-6.4" r=".9" fill="#E8C43A"/>
    </g>
  </g>

  <!-- The ball, still in play. -->
  <g class="ball">
    <g class="ballhop">
      <circle cx="104" cy="34" r="2.6" fill="#D8E84A"/>
      <path d="M101.6 33 C103 34 103 34.6 101.6 35.6" fill="none" stroke="#A8B82A"
            stroke-width=".5"/>
      <path d="M106.4 33 C105 34 105 34.6 106.4 35.6" fill="none" stroke="#A8B82A"
            stroke-width=".5"/>
    </g>
  </g>

  <!-- Grass, up close. -->
  <g class="grass" stroke="#2E6B2A" stroke-width=".55" fill="none" opacity=".75"
     stroke-linecap="round">
    <path d="M6 40 C5 37 4.4 35.6 3.4 34.6"/><path d="M9 40 C9 37 9.4 35.4 10.4 34.4"/>
    <path d="M24 40 C23 37.4 22.4 36 21.4 35"/><path d="M27 40 C27.2 37.4 28 36 29 35.2"/>
    <path d="M46 40 C45 37 44.4 35.8 43.4 34.8"/><path d="M50 40 C50.2 37.2 51 35.8 52 35"/>
    <path d="M118 40 C117 37.4 116.4 36 115.4 35"/><path d="M122 40 C122.2 37.2 123 35.8 124 35"/>
    <path d="M140 40 C139 37 138.4 35.6 137.4 34.6"/><path d="M144 40 C144.2 37.4 145 36 146 35.2"/>
  </g>
</svg>
