<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Hearth</title>
  <!-- The fire is going and nobody is going anywhere. -->
  <style>
    .lick { animation: flick 1.6s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 100% }
    .l2 { animation-duration: 1.15s }
    @keyframes flick { from { transform: scaleY(.84) scaleX(1.08) } to { transform: scaleY(1.12) scaleX(.94) } }
    .glow { animation: breathe 4.6s ease-in-out infinite }
    @keyframes breathe { 0%,100% { opacity: .5 } 50% { opacity: .8 } }
    @media (prefers-reduced-motion: reduce) { .lick, .glow { animation: none } }
  </style>
  <defs>
    <linearGradient id="room3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1E20"/><stop offset="100%" stop-color="#41302C"/>
    </linearGradient>
    <radialGradient id="fireglow" cx=".5" cy=".6" r=".6">
      <stop offset="0%" stop-color="#FF9C2A" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FF9C2A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#room3)"/>
  <ellipse class="glow" cx="80" cy="28" rx="66" ry="20" fill="url(#fireglow)"/>
  <!-- The chimney breast and the mantel. -->
  <path d="M44 40 L44 6 L116 6 L116 40 Z" fill="#5A4038"/>
  <g stroke="#4A322C" stroke-width=".5" opacity=".7">
    <path d="M44 12 L116 12"/><path d="M44 18 L116 18"/><path d="M44 24 L116 24"/>
    <path d="M56 6 L56 12"/><path d="M68 12 L68 18"/><path d="M80 6 L80 12"/>
    <path d="M92 12 L92 18"/><path d="M104 6 L104 12"/><path d="M62 18 L62 24"/>
    <path d="M86 18 L86 24"/><path d="M110 18 L110 24"/>
  </g>
  <path d="M40 14 L120 14 L120 17 L40 17 Z" fill="#8A6034"/>
  <path d="M40 14 L120 14 L120 14.8 L40 14.8 Z" fill="#A87C48"/>
  <!-- The opening, and what is in it. -->
  <path d="M58 40 L58 20 C58 18.6 59 17.6 60.4 17.6 L99.6 17.6 C101 17.6 102 18.6 102 20
           L102 40 Z" fill="#1A1012"/>
  <g fill="#3A2A1C">
    <path d="M64 36 L94 36 L94 38.6 L64 38.6 Z"/>
    <path d="M66 33.6 L92 33.6 L92 36 L66 36 Z"/>
  </g>
  <g transform="rotate(-14 76 33)"><path d="M64 32 L92 34 L92 36 L64 34 Z" fill="#6B4526"/></g>
  <g transform="rotate(12 84 33)"><path d="M68 33 L96 31 L96 33 L68 35 Z" fill="#8A6034"/></g>
  <g class="lick">
    <path d="M80 20 C86 25 89 29 89 32.4 C89 36 85 38.6 80 38.6 C75 38.6 71 36 71 32.4
             C71 29 74 25 80 20 Z" fill="#E8730C"/>
  </g>
  <g class="lick l2">
    <path d="M80 25.6 C83.4 28.6 85 31 85 33.4 C85 35.6 82.8 37 80 37 C77.2 37 75 35.6 75 33.4
             C75 31 76.6 28.6 80 25.6 Z" fill="#FFC83D"/>
  </g>
  <path d="M80 30.6 C81.6 32.4 82.4 33.8 82.4 35 C82.4 36.2 81.4 37 80 37 C78.6 37 77.6 36.2 77.6 35
           C77.6 33.8 78.4 32.4 80 30.6 Z" fill="#FFF0B8"/>
  <!-- Stockings on the mantel, and something on it. -->
  <g>
    <path d="M52 17 L58 17 L58 24 C58 26 56 27.4 53 27.4 L50 27.4 L50 24 L52 24 Z"
          fill="#C0221E"/>
    <path d="M51.4 17 L58.6 17 L58.6 19.4 L51.4 19.4 Z" fill="#F2F8FC"/>
    <path d="M102 17 L108 17 L108 24 C108 26 106 27.4 103 27.4 L100 27.4 L100 24 L102 24 Z"
          fill="#1B7A3E"/>
    <path d="M101.4 17 L108.6 17 L108.6 19.4 L101.4 19.4 Z" fill="#F2F8FC"/>
  </g>
  <g>
    <path d="M76 14 L84 14 L84 8 C84 7 83.4 6.4 82.4 6.4 L77.6 6.4 C76.6 6.4 76 7 76 8 Z"
          fill="#C9A063"/>
    <circle cx="80" cy="10.4" r="1.6" fill="#3A2A1C"/>
    <path d="M80 10.4 L80 8.4" stroke="#3A2A1C" stroke-width=".6"/>
  </g>
  <g fill="#1E5E32">
    <ellipse cx="24" cy="20" rx="9" ry="3.4"/><ellipse cx="136" cy="20" rx="9" ry="3.4"/>
  </g>
  <g fill="#C0221E">
    <circle cx="20" cy="20" r="1.2"/><circle cx="28" cy="21" r="1.2"/>
    <circle cx="132" cy="21" r="1.2"/><circle cx="140" cy="20" r="1.2"/>
  </g></svg>
