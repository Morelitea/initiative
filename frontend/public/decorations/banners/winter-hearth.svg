<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Hearth</title>
  <!-- The fire is going and nobody is going anywhere. -->
  <style>
    .lick { animation: flick 1.6s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 100% }
    .l2 { animation-duration: 1.15s }
    @keyframes flick { from { transform: scaleY(.84) scaleX(1.08) } to { transform: scaleY(1.12) scaleX(.94) } }
    .glow { animation: breathe 4.6s ease-in-out infinite }
    @keyframes breathe { 0%,100% { opacity: .5 } 50% { opacity: .8 } }
    .spark { animation: up 5.5s ease-out infinite }
    .k2 { animation-delay: -1.8s } .k3 { animation-delay: -3.6s } .k4 { animation-delay: -4.6s }
    @keyframes up { 0% { transform: translate(0,0); opacity: 0 }
                    18% { opacity: .9 }
                    100% { transform: translate(-4px,-19px); opacity: 0 } }
    .hang { animation: sway 7s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 0 }
    .g1 { animation-duration: 8.4s } .g2 { animation-duration: 6.2s }
    @keyframes sway { from { transform: rotate(-2.4deg) } to { transform: rotate(2.4deg) } }
    .tick { animation: tock 2s steps(2, end) infinite;
            transform-box: fill-box; transform-origin: 50% 100% }
    @keyframes tock { from { transform: rotate(-9deg) } to { transform: rotate(9deg) } }
    @media (prefers-reduced-motion: reduce) {
      .lick, .glow, .spark, .hang, .tick { animation: none } }
  </style>
  <defs>
    <linearGradient id="room3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1E20"/><stop offset="100%" stop-color="#41302C"/>
    </linearGradient>
    <radialGradient id="fireglow" cx=".5" cy=".6" r=".6">
      <stop offset="0%" stop-color="#FF9C2A" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FF9C2A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#room3)"/>
  <ellipse class="glow" cx="80" cy="28" rx="66" ry="20" fill="url(#fireglow)"/>
  <!-- The chimney breast and the mantel. -->
  <path d="M44 40 L44 6 L116 6 L116 40 Z" fill="#5A4038"/>
  <g stroke="#4A322C" stroke-width=".5" opacity=".7">
    <path d="M44 12 L116 12"/><path d="M44 18 L116 18"/><path d="M44 24 L116 24"/>
    <path d="M56 6 L56 12"/><path d="M68 12 L68 18"/><path d="M80 6 L80 12"/>
    <path d="M92 12 L92 18"/><path d="M104 6 L104 12"/><path d="M62 18 L62 24"/>
    <path d="M86 18 L86 24"/><path d="M110 18 L110 24"/>
  </g>
  <path d="M40 14 L120 14 L120 17 L40 17 Z" fill="#8A6034"/>
  <path d="M40 14 L120 14 L120 14.8 L40 14.8 Z" fill="#A87C48"/>
  <!-- The opening, and what is in it. -->
  <path d="M58 40 L58 20 C58 18.6 59 17.6 60.4 17.6 L99.6 17.6 C101 17.6 102 18.6 102 20
           L102 40 Z" fill="#1A1012"/>
  <g fill="#3A2A1C">
    <path d="M64 36 L94 36 L94 38.6 L64 38.6 Z"/>
    <path d="M66 33.6 L92 33.6 L92 36 L66 36 Z"/>
  </g>
  <g transform="rotate(-14 76 33)"><path d="M64 32 L92 34 L92 36 L64 34 Z" fill="#6B4526"/></g>
  <g transform="rotate(12 84 33)"><path d="M68 33 L96 31 L96 33 L68 35 Z" fill="#8A6034"/></g>
  <g class="lick">
    <path d="M80 20 C86 25 89 29 89 32.4 C89 36 85 38.6 80 38.6 C75 38.6 71 36 71 32.4
             C71 29 74 25 80 20 Z" fill="#E8730C"/>
  </g>
  <g class="lick l2">
    <path d="M80 25.6 C83.4 28.6 85 31 85 33.4 C85 35.6 82.8 37 80 37 C77.2 37 75 35.6 75 33.4
             C75 31 76.6 28.6 80 25.6 Z" fill="#FFC83D"/>
  </g>
  <path d="M80 30.6 C81.6 32.4 82.4 33.8 82.4 35 C82.4 36.2 81.4 37 80 37 C78.6 37 77.6 36.2 77.6 35
           C77.6 33.8 78.4 32.4 80 30.6 Z" fill="#FFF0B8"/>
  <!-- Stockings on the mantel, and something on it. -->
  <g>
    <g transform="translate(54 17)"><g class="hang g1">
    <path d="M-2 0 L4 0 L4 7 C4 9 2 10.4 -1 10.4 L-4 10.4 L-4 7 L-2 7 Z"
          fill="#C0221E"/>
    <path d="M-1.4 2.4 L3.4 2.4 L3.4 3.4 L-1.4 3.4 Z" fill="#8E1C18"/>
    <circle cx="-1.6" cy="8.6" r=".9" fill="#E8C43A"/>
    </g></g></g>

    <g transform="translate(104 17)"><g class="hang g2">
    <path d="M-2 0 L4 0 L4 7 C4 9 2 10.4 -1 10.4 L-4 10.4 L-4 7 L-2 7 Z"
          fill="#1B7A3E"/>
    <path d="M-1.4 2.4 L3.4 2.4 L3.4 3.4 L-1.4 3.4 Z" fill="#14562C"/>
    <circle cx="-1.6" cy="8.6" r=".9" fill="#E8C43A"/>
    </g>

  </g>
  <g>
    <path d="M76 14 L84 14 L84 8 C84 7 83.4 6.4 82.4 6.4 L77.6 6.4 C76.6 6.4 76 7 76 8 Z"
          fill="#C9A063"/>
    <circle cx="80" cy="10.4" r="1.6" fill="#3A2A1C"/>
    <path d="M80 10.4 L80 8.4" stroke="#3A2A1C" stroke-width=".6"/>
  </g>
  <!-- Holly, either side. -->
  <g>
    <g transform="translate(24 20)">
      <path d="M0 0 C-2.6 -1.6 -5 -1.4 -6.6 -.2 C-5.6 -.2 -5 .2 -5.2 .8
               C-4 .4 -3.2 .6 -2.8 1.4 C-2.2 .6 -1.2 .2 0 0 Z" fill="#1E5E32"/>
      <path d="M0 0 C2.6 -1.6 5 -1.4 6.6 -.2 C5.6 -.2 5 .2 5.2 .8
               C4 .4 3.2 .6 2.8 1.4 C2.2 .6 1.2 .2 0 0 Z" fill="#2A7440"/>
      <path d="M0 .4 C-1 2.4 -.6 4.2 .6 5.2 C.4 4.2 .8 3.6 1.6 3.6
               C1 2.6 .8 1.6 0 .4 Z" fill="#1E5E32"/>
      <g fill="#C0221E">
        <circle cx="-.6" cy="-.4" r="1"/><circle cx="1" cy=".4" r=".9"/>
        <circle cx="-.2" cy="1.2" r=".8"/>
      </g>
    </g>
    <g transform="translate(136 20)">
      <path d="M0 0 C-2.6 -1.6 -5 -1.4 -6.6 -.2 C-5.6 -.2 -5 .2 -5.2 .8
               C-4 .4 -3.2 .6 -2.8 1.4 C-2.2 .6 -1.2 .2 0 0 Z" fill="#2A7440"/>
      <path d="M0 0 C2.6 -1.6 5 -1.4 6.6 -.2 C5.6 -.2 5 .2 5.2 .8
               C4 .4 3.2 .6 2.8 1.4 C2.2 .6 1.2 .2 0 0 Z" fill="#1E5E32"/>
      <path d="M0 .4 C1 2.4 .6 4.2 -.6 5.2 C-.4 4.2 -.8 3.6 -1.6 3.6
               C-1 2.6 -.8 1.6 0 .4 Z" fill="#1E5E32"/>
      <g fill="#C0221E">
        <circle cx=".6" cy="-.4" r="1"/><circle cx="-1" cy=".4" r=".9"/>
        <circle cx=".2" cy="1.2" r=".8"/>
      </g>
    </g>
  </g>  <!-- Sparks, going where sparks go. -->
  <g fill="#FFC46A">
    <circle class="spark" cx="74" cy="30" r=".34" opacity=".8"/>
    <circle class="spark k2" cx="80" cy="31" r=".28" opacity=".7"/>
    <circle class="spark k3" cx="86" cy="30.4" r=".3" opacity=".75"/>
    <circle class="spark k4" cx="78" cy="32" r=".26" opacity=".65"/>
  </g>
  <!-- Garland along the mantel. -->
  <g>
    <path d="M42 14 C56 20 104 20 118 14" fill="none" stroke="#2E6B36" stroke-width="2.4"/>
    <path d="M42 14 C56 20 104 20 118 14" fill="none" stroke="#3E8446" stroke-width="1.1"
          stroke-dasharray="2.4 2" opacity=".8"/>
    <g fill="#C9564C">
      <circle cx="54" cy="17" r=".8"/><circle cx="68" cy="18.4" r=".8"/>
      <circle cx="80" cy="18.8" r=".8"/><circle cx="94" cy="18.4" r=".8"/>
      <circle cx="107" cy="17" r=".8"/>
    </g>
  </g>
  <!-- Two candles, either end.
       (The clock is on the mantel already.) -->
  <g transform="translate(50 8.4)">
    <path d="M-1.1 5.6 L1.1 5.6 L1.1 0 L-1.1 0 Z" fill="#F2EDE0"/>
    <path d="M-1.1 5.6 L1.1 5.6 L1.1 4.8 L-1.1 4.8 Z" fill="#D8D0BE"/>
    <path d="M0 0 L0 -1" stroke="#6B5238" stroke-width=".4"/>
    <path class="lick" d="M0 -1 C-1.1 -2.2 -.8 -3.4 0 -4.4 C.8 -3.4 1.1 -2.2 0 -1 Z"
          fill="#FFB63A"/>
  </g>
  <g transform="translate(110 9.4)">
    <path d="M-1 4.6 L1 4.6 L1 0 L-1 0 Z" fill="#F2EDE0"/>
    <path d="M0 0 L0 -1" stroke="#6B5238" stroke-width=".4"/>
    <path class="lick l2" d="M0 -1 C-1 -2 -.7 -3.1 0 -4 C.7 -3.1 1 -2 0 -1 Z" fill="#FFB63A"/>
  </g>
  <!-- The rug, a mug, and the boots that came off at the door. -->
  <ellipse cx="80" cy="38.4" rx="46" ry="2.6" fill="#7A3E36" opacity=".55"/>
  <ellipse cx="80" cy="38.4" rx="38" ry="1.9" fill="#9E4E44" opacity=".55"/>
  <g transform="translate(126 33)">
    <path d="M-3.4 0 L3.4 0 L2.6 5.4 L-2.6 5.4 Z" fill="#E8E2D6"/>
    <ellipse cx="0" cy="0" rx="3.4" ry="1" fill="#B4703A"/>
    <path d="M3.4 1.2 C5.6 1.2 6.6 2.2 6.6 3.4 C6.6 4.6 5.6 5.4 3.6 5.4" fill="none"
          stroke="#E8E2D6" stroke-width="1.1"/>
    <g fill="#F2EDE0" opacity=".7">
      <circle class="spark" cx="0" cy="-1" r=".7"/>
      <circle class="spark k2" cx="1.4" cy="-1.4" r=".55"/>
    </g>
  </g>
  <g transform="translate(34 34)">
    <path d="M-4 5.4 L-4 1.4 C-4 .4 -3.2 0 -2.2 0 L-.6 0 C.4 0 1 .6 1 1.6 L1 3.4
             C1 4.4 2 4.8 3.6 5 C4.8 5.2 5.4 5.4 5.4 5.4 Z" fill="#4A322C"/>
    <path d="M-4.4 5.4 L5.8 5.4 L5.8 6.4 L-4.4 6.4 Z" fill="#2E211C"/>
    <path d="M-4 1.4 C-3 .8 -.4 .8 1 1.4" fill="none" stroke="#6B4A40" stroke-width=".5"/>
  </g>
</svg>
