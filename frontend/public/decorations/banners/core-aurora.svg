<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="presentation">
  <style>
    .veil { animation: hang 22s ease-in-out infinite alternate;
            transform-box: view-box; transform-origin: 600px 0 }
    .v2 { animation-duration: 29s; animation-delay: -9s }
    @keyframes hang { from { transform: translateX(-26px) scaleY(.96) }
                      to { transform: translateX(26px) scaleY(1.05) } }
    .star { animation: blink 5s ease-in-out infinite alternate }
    .s2 { animation-delay: -1.7s } .s3 { animation-delay: -3.4s }
    @keyframes blink { from { opacity: .35 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .veil, .star { animation: none } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#132447"/>
      <stop offset="100%" stop-color="#1d3b6e"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="75%" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <path class="veil" d="M0 210 C 180 120 320 250 480 160 S 820 60 1000 150 1200 120 1200 120 L1200 300 L0 300 Z" fill="url(#veil)"/>
  <path class="veil v2" d="M0 250 C 220 180 360 280 560 210 S 900 130 1200 190 L1200 300 L0 300 Z" fill="#0b1026" opacity=".45"/>
  <g fill="#e2e8f0">
    <circle class="star s1" cx="140" cy="70" r="2.5" opacity=".9"/>
    <circle class="star s2" cx="320" cy="46" r="1.8" opacity=".7"/>
    <circle class="star s0" cx="520" cy="88" r="2.2" opacity=".8"/>
    <circle class="star s1" cx="760" cy="52" r="1.6" opacity=".6"/>
    <circle class="star s2" cx="960" cy="96" r="2.4" opacity=".85"/>
    <circle class="star s0" cx="1100" cy="60" r="1.9" opacity=".7"/>
  </g>
</svg>
