     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Parfleche</title>
  <!-- Painted rawhide, in the Plains manner: bordered panels, bilateral
       symmetry, earth pigment. An original arrangement in that geometry rather
       than a copy of any family's design. -->
  <style>
    .hide { animation: flex 21s ease-in-out infinite alternate;
            transform-box: view-box; transform-origin: 80px 20px }
    @keyframes flex { from { transform: skewY(-.28deg) } to { transform: skewY(.28deg) } }
    .lamp { animation: cross 19s ease-in-out infinite alternate }
    @keyframes cross { from { transform: translateX(-20px); opacity: .12 }
                       to { transform: translateX(20px); opacity: .3 } }
    @media (prefers-reduced-motion: reduce) { .hide, .lamp { animation: none } }
  </style>
