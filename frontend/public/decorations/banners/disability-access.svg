<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Access</title>
  <!-- A street where the getting in was thought about: a ramp beside the steps,
       a dropped kerb with the studs you can feel, a door wide enough, and a
       button at the height of a hand. -->
  <style>
    .press { animation: lit 4.4s ease-in-out infinite }
    @keyframes lit { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .press { animation: none } }
  </style>
  <defs>
    <linearGradient id="daysky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FBEDC"/><stop offset="100%" stop-color="#D8E8EE"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#daysky)"/>
  <!-- The building. -->
  <path d="M0 4 L112 4 L112 30 L0 30 Z" fill="#C9BFA6"/>
  <path d="M0 4 L112 4 L112 6.6 L0 6.6 Z" fill="#A89E88"/>
  <g fill="#8FA8B8">
    <rect x="10" y="11" width="12" height="10" rx="1"/>
    <rect x="30" y="11" width="12" height="10" rx="1"/>
    <rect x="88" y="11" width="12" height="10" rx="1"/>
  </g>
  <!-- A door wide enough to get through. -->
  <path d="M54 30 L54 10 C54 8.6 55 7.6 56.4 7.6 L75.6 7.6 C77 7.6 78 8.6 78 10 L78 30 Z"
        fill="#3E5B6E"/>
  <path d="M56 28.6 L56 11 C56 10 56.6 9.4 57.6 9.4 L65 9.4 L65 28.6 Z" fill="#BFD8E4"
        opacity=".8"/>
  <path d="M67 28.6 L67 9.4 L74.4 9.4 C75.4 9.4 76 10 76 11 L76 28.6 Z" fill="#BFD8E4"
        opacity=".8"/>
  <g fill="#E8E8E8">
    <rect x="63.4" y="16" width="1.4" height="7" rx=".7"/>
    <rect x="67.2" y="16" width="1.4" height="7" rx=".7"/>
  </g>
  <!-- The button, at the height of a hand. -->
  <g>
    <rect x="82" y="18" width="5" height="5" rx="2.5" fill="#3BB07D"/>
    <circle class="press" cx="84.5" cy="20.5" r="1.6" fill="#DFFAEC"/>
    <path d="M83.4 24 L85.6 24 L85.6 30 L83.4 30 Z" fill="#8A9098"/>
  </g>
  <!-- Steps, and the ramp beside them. -->
  <g fill="#A89E88">
    <path d="M30 30 L52 30 L52 32 L30 32 Z"/>
    <path d="M28 32 L52 32 L52 34 L28 34 Z"/>
    <path d="M26 34 L52 34 L52 36 L26 36 Z"/>
  </g>
  <path d="M80 30 L128 30 L128 33 L92 33 L80 33 Z" fill="#B8AE96"/>
  <path d="M80 30 L128 30 L128 31 L80 31 Z" fill="#D8CEB6"/>
  <g stroke="#7A8A98" stroke-width="1" fill="none">
    <path d="M80 26 L128 26"/><path d="M80 22.6 L128 22.6"/>
    <path d="M82 22.6 L82 30"/><path d="M96 22.6 L96 30"/><path d="M110 22.6 L110 30"/>
    <path d="M124 22.6 L124 30"/>
  </g>
  <!-- Pavement, and the dropped kerb with tactile studs on it. -->
  <path d="M0 36 L160 36 L160 40 L0 40 Z" fill="#8A9098"/>
  <path d="M0 33 L160 33 L160 36 L0 36 Z" fill="#B4BAC0"/>
  <path d="M128 33 L146 33 L150 36 L128 36 Z" fill="#EEDE77"/>
  <g fill="#C9BB4E">
    <circle cx="131" cy="34" r=".8"/><circle cx="135" cy="34" r=".8"/>
    <circle cx="139" cy="34" r=".8"/><circle cx="143" cy="34" r=".8"/>
    <circle cx="133" cy="35.4" r=".8"/><circle cx="137" cy="35.4" r=".8"/>
    <circle cx="141" cy="35.4" r=".8"/><circle cx="145" cy="35.4" r=".8"/>
  </g>
  <!-- A bay marked out, and the symbol painted in it. -->
  <path d="M0 30 L26 30 L26 36 L0 36 Z" fill="#3C7CD6" opacity=".22"/>
  <g stroke="#F2F4F0" stroke-width=".7" fill="none">
    <path d="M0 30 L26 30 L26 36"/>
  </g>
  <g fill="#F2F4F0" transform="translate(13 33) scale(.34)">
    <circle cx="-4" cy="-13" r="4.4"/>
    <path d="M-1.4 -8 C2.6 -7 5.6 -4 7.2 0 L12.6 -2 L14 2 L6.6 4.6 C5.4 5 4.4 4.6 3.6 3.4
             L1.4 -.6 L1.4 7 L-4 7 C-6 7 -7 5.6 -6.6 3.6 L-5 -5 C-4.6 -7 -3.4 -8.2 -1.4 -8 Z"/>
    <path d="M1.4 7 L11 11 C12.6 11.8 13 13.2 12 14.6 C11 16 9.6 16.2 8 15.4 L-2 11"
          fill="none" stroke="#F2F4F0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="11" fill="none" stroke="#F2F4F0" stroke-width="2.4"/>
  </g>
</svg>
