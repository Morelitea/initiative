<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Rink</title>
  <!-- The centre dot, the red line and a puck already gone: the middle of the
       ice, which is the part of it a phone keeps. -->
  <style>
    .glide { animation: away 3.2s cubic-bezier(.2,.7,.5,1) infinite }
    @keyframes away {
      0% { transform: translateX(-26px); opacity: 0 }
      12% { opacity: 1 }
      85% { opacity: 1 }
      100% { transform: translateX(26px); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) { .glide { animation: none } }
  </style>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F7FC"/>
      <stop offset="45%" stop-color="#D6E9F5"/>
      <stop offset="100%" stop-color="#A8CBE2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FB9D4" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#CFE4F1" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="#0B1621"/>
  <!-- Behind the glass. -->
  <g fill="#16293A">
    <ellipse cx="14" cy="5.4" rx="3.4" ry="4"/><ellipse cx="26" cy="4.8" rx="3.8" ry="4.4"/>
    <ellipse cx="40" cy="5.6" rx="3.2" ry="3.8"/><ellipse cx="54" cy="4.6" rx="3.6" ry="4.4"/>
    <ellipse cx="70" cy="5.4" rx="3.4" ry="4"/><ellipse cx="86" cy="4.8" rx="3.8" ry="4.4"/>
    <ellipse cx="102" cy="5.6" rx="3.2" ry="3.8"/><ellipse cx="118" cy="4.6" rx="3.6" ry="4.4"/>
    <ellipse cx="132" cy="5.4" rx="3.4" ry="4"/><ellipse cx="146" cy="4.8" rx="3.8" ry="4.4"/>
  </g>
  <rect width="160" height="9" fill="url(#glass)"/>
  <g stroke="#DCEBF5" stroke-width=".35" opacity=".5">
    <path d="M20 0 L20 9"/><path d="M52 0 L52 9"/><path d="M84 0 L84 9"/>
    <path d="M116 0 L116 9"/><path d="M148 0 L148 9"/>
  </g>
  <!-- The boards. -->
  <path d="M0 9 L160 9 L160 12.4 L0 12.4 Z" fill="#EEF4F8"/>
  <path d="M0 12.4 L160 12.4 L160 13.4 L0 13.4 Z" fill="#E0B429"/>
  <path d="M0 9 L160 9 L160 9.6 L0 9.6 Z" fill="#C6D6E1"/>
  <!-- The ice. -->
  <path d="M0 13.4 L160 13.4 L160 40 L0 40 Z" fill="url(#ice)"/>
  <g stroke="#FFFFFF" stroke-width=".4" fill="none" opacity=".7" stroke-linecap="round">
    <path d="M8 34 C22 30 34 27.6 48 26.6"/><path d="M14 36.4 C28 32.6 40 30 54 29"/>
    <path d="M96 22 C110 21 124 21.6 138 23"/><path d="M104 25 C118 24 132 24.6 146 26"/>
    <path d="M30 20 C42 19 54 19.2 66 20"/><path d="M112 32 C126 30 138 29 150 29"/>
  </g>
  <path d="M38.6 13.4 L41.4 13.4 L41.4 40 L38.6 40 Z" fill="#2B5FBF" opacity=".85"/>
  <path d="M118.6 13.4 L121.4 13.4 L121.4 40 L118.6 40 Z" fill="#2B5FBF" opacity=".85"/>
  <path d="M78.7 13.4 L81.3 13.4 L81.3 40 L78.7 40 Z" fill="#C22B2B" opacity=".9"/>
  <ellipse cx="80" cy="23" rx="23" ry="7.6" fill="none" stroke="#2B5FBF" stroke-width=".8"
           opacity=".85"/>
  <circle cx="80" cy="23" r="1.4" fill="#2B5FBF" opacity=".9"/>
  <g fill="#C22B2B" opacity=".85">
    <ellipse cx="24" cy="19.6" rx="1.1" ry=".4"/><ellipse cx="136" cy="19.6" rx="1.1" ry=".4"/>
    <ellipse cx="24" cy="31" rx="1.3" ry=".5"/><ellipse cx="136" cy="31" rx="1.3" ry=".5"/>
  </g>
  <!-- The puck, and the ice it kicked up. -->
  <g class="glide">
    <g opacity=".55">
      <path d="M74 21.9 L64 21.6 L64 22.5 L74 22.3 Z" fill="#FFFFFF"/>
      <path d="M74.4 22.6 L66 23.6 L66.2 24.2 L74.4 23.2 Z" fill="#FFFFFF" opacity=".7"/>
    </g>
    <ellipse cx="80" cy="23.6" rx="2.6" ry=".8" fill="#5E86A3" opacity=".45"/>
    <path d="M77.4 21 C77.4 20.2 82.6 20.2 82.6 21 L82.6 22.2 C82.6 23 77.4 23 77.4 22.2 Z"
          fill="#16181C"/>
    <ellipse cx="80" cy="21" rx="2.6" ry=".85" fill="#26292F"/>
    <ellipse cx="80" cy="21" rx="1.5" ry=".45" fill="#16181C"/>
    <g fill="#FFFFFF" opacity=".8">
      <circle cx="72.6" cy="20.4" r=".22"/><circle cx="70.4" cy="24" r=".18"/>
      <circle cx="75" cy="24.6" r=".2"/><circle cx="68" cy="21.6" r=".16"/>
    </g>
  </g>
</svg>
