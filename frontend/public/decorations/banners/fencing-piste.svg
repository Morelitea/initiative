<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Piste</title>
  <!-- Two blades crossed over the centre of the strip, with the box either side
       waiting to say who arrived first. -->
  <style>
    .hit { animation: touch 4.2s steps(1, end) infinite }
    @keyframes touch { 0%,45% { opacity: 1 } 46%,100% { opacity: .15 } }
    .hit2 { animation: touch2 4.2s steps(1, end) infinite }
    @keyframes touch2 { 0%,45% { opacity: .15 } 46%,100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .hit, .hit2 { animation: none; opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0B10"/><stop offset="100%" stop-color="#161A24"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C8593"/><stop offset="100%" stop-color="#4E5867"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2F8"/><stop offset="45%" stop-color="#AEB7C6"/>
      <stop offset="100%" stop-color="#6E7889"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".2" r=".8">
      <stop offset="0%" stop-color="#D6E2F2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#D6E2F2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#hall)"/>
  <ellipse cx="80" cy="18" rx="72" ry="22" fill="url(#pool)"/>
  <!-- The strip, running away from you. -->
  <path d="M0 20.6 L160 20.6 L160 40 L0 40 Z" fill="url(#strip)"/>
  <path d="M0 20.6 L160 20.6 L160 21.2 L0 21.2 Z" fill="#98A2B0"/>
  <g stroke="#EDF1F6" stroke-width=".6" fill="none" opacity=".8">
    <path d="M79 21.2 L79 40"/><path d="M81 21.2 L81 40"/>
    <path d="M42 21.2 L38 40"/><path d="M118 21.2 L122 40"/>
    <path d="M20 21.2 L12 40" stroke-dasharray="1.6 2.4" opacity=".55"/>
    <path d="M140 21.2 L148 40" stroke-dasharray="1.6 2.4" opacity=".55"/>
  </g>
  <g stroke="#3D4756" stroke-width=".3" opacity=".6">
    <path d="M0 25 L160 25"/><path d="M0 30 L160 30"/><path d="M0 36 L160 36"/>
  </g>
  <!-- The apparatus, either side. -->
  <g>
    <path d="M36 10.4 L54 10.4 L54 18.6 L36 18.6 Z" fill="#2A3140"/>
    <path d="M36 10.4 L54 10.4 L54 18.6 L36 18.6 Z" fill="none" stroke="#5B6879" stroke-width=".5"/>
    <path d="M36 10.4 L54 10.4 L54 11.2 L36 11.2 Z" fill="#49556A"/>
    <path d="M44.6 18.6 L45.4 18.6 L45.4 20.6 L44.6 20.6 Z" fill="#2A3140"/>
    <circle class="hit" cx="41.4" cy="14.4" r="1.7" fill="#E03A32"/>
    <circle class="hit" cx="41.4" cy="14.4" r="3.4" fill="#E03A32" opacity=".25"/>
    <circle class="hit2" cx="48.6" cy="14.4" r="1.7" fill="#2FBF5A"/>
    <circle class="hit2" cx="48.6" cy="14.4" r="3.4" fill="#2FBF5A" opacity=".25"/>
  </g>
  <g>
    <path d="M106 10.4 L124 10.4 L124 18.6 L106 18.6 Z" fill="#2A3140"/>
    <path d="M106 10.4 L124 10.4 L124 18.6 L106 18.6 Z" fill="none" stroke="#5B6879" stroke-width=".5"/>
    <path d="M106 10.4 L124 10.4 L124 11.2 L106 11.2 Z" fill="#49556A"/>
    <path d="M114.6 18.6 L115.4 18.6 L115.4 20.6 L114.6 20.6 Z" fill="#2A3140"/>
    <circle class="hit2" cx="111.4" cy="14.4" r="1.7" fill="#2FBF5A"/>
    <circle class="hit2" cx="111.4" cy="14.4" r="3.4" fill="#2FBF5A" opacity=".25"/>
    <circle class="hit" cx="118.6" cy="14.4" r="1.7" fill="#E03A32"/>
    <circle class="hit" cx="118.6" cy="14.4" r="3.4" fill="#E03A32" opacity=".25"/>
  </g>
  <!-- Two blades, crossed. -->
  <g transform="translate(80 11) scale(.66)">
    <g transform="rotate(-32)">
      <path d="M-30 0 C-16 -.5 4 -.6 22 -.35 L24 0 L22 .35 C4 .6 -16 .5 -30 0 Z"
            fill="url(#steel)"/>
      <path d="M-30 -.1 C-16 -.6 4 -.7 22 -.45" fill="none" stroke="#FFFFFF" stroke-width=".28"
            opacity=".7"/>
      <path d="M-30 0 C-33.4 -2.6 -33.4 2.6 -30 0 Z" fill="#8E97A6"/>
      <path d="M-31.6 -3.6 C-35.6 -3.6 -37.4 -1.8 -37.4 0 C-37.4 1.8 -35.6 3.6 -31.6 3.6
               C-33.4 2 -33.4 -2 -31.6 -3.6 Z" fill="#C0C8D4"/>
      <path d="M-31.6 -3.6 C-33.4 -2 -33.4 2 -31.6 3.6" fill="none" stroke="#8E97A6"
            stroke-width=".4"/>
      <path d="M-37.4 -1.2 L-43.6 -1.2 C-44.6 -1.2 -44.6 1.2 -43.6 1.2 L-37.4 1.2 Z"
            fill="#2A303B"/>
      <ellipse cx="-44.6" cy="0" rx="1.2" ry="1.5" fill="#8E97A6"/>
    </g>
    <g transform="rotate(-148)">
      <path d="M-30 0 C-16 -.5 4 -.6 22 -.35 L24 0 L22 .35 C4 .6 -16 .5 -30 0 Z"
            fill="url(#steel)"/>
      <path d="M-30 -.1 C-16 -.6 4 -.7 22 -.45" fill="none" stroke="#FFFFFF" stroke-width=".28"
            opacity=".7"/>
      <path d="M-31.6 -3.6 C-35.6 -3.6 -37.4 -1.8 -37.4 0 C-37.4 1.8 -35.6 3.6 -31.6 3.6
               C-33.4 2 -33.4 -2 -31.6 -3.6 Z" fill="#C0C8D4"/>
      <path d="M-31.6 -3.6 C-33.4 -2 -33.4 2 -31.6 3.6" fill="none" stroke="#8E97A6"
            stroke-width=".4"/>
      <path d="M-37.4 -1.2 L-43.6 -1.2 C-44.6 -1.2 -44.6 1.2 -43.6 1.2 L-37.4 1.2 Z"
            fill="#2A303B"/>
      <ellipse cx="-44.6" cy="0" rx="1.2" ry="1.5" fill="#8E97A6"/>
    </g>
    <circle cx="0" cy="0" r="1.6" fill="#F4F8FF" opacity=".35"/>
  </g>
</svg>
