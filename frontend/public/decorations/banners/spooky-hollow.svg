    <circle cx="151" cy="4" r=".24" opacity=".55"/><circle cx="157" cy="12" r=".28" opacity=".62"/>
    <circle cx="8" cy="16" r=".22" opacity=".42"/><circle cx="22" cy="19" r=".2" opacity=".38"/>
    <circle cx="36" cy="17" r=".22" opacity=".42"/><circle cx="128" cy="17" r=".2" opacity=".38"/>
    <circle cx="142" cy="15" r=".24" opacity=".45"/><circle cx="152" cy="18" r=".2" opacity=".38"/>
