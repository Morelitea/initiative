<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Hollow</title>
  <!-- A hollow between two dead trees, lit by two things and nothing else: a
       moon that rims everything it can reach in cold silver, and a lantern
       somebody left burning that rims the near side of everything around it in
       orange. Both lights are drawn, not implied — that is the whole picture.

       A banner is cropped to the middle of its width on a phone and dissolves
       from about two thirds down, so the moon and the lantern stand dead
       centre and the mist is what the page eats. -->
  <style>
    .bat { animation: flit 9s linear infinite }
    .b2 { animation-delay: -3s } .b3 { animation-delay: -6s }
    @keyframes flit {
      0%   { transform: translate(0,0) }
      25%  { transform: translate(22px,-3.5px) }
      50%  { transform: translate(46px,1.5px) }
      75%  { transform: translate(70px,-2.5px) }
      100% { transform: translate(94px,0) }
    }
    /* The wings, on their own box so each bat beats about its own middle. */
    .wing { animation: beat .9s ease-in-out infinite alternate;
            transform-box: fill-box; transform-origin: 50% 40% }
    .w2 { animation-duration: 1.1s } .w3 { animation-duration: .75s }
    @keyframes beat { from { transform: scaleY(1) } to { transform: scaleY(.45) } }
    .flicker { animation: lit 3.4s ease-in-out infinite }
    @keyframes lit { 0%,100% { opacity: 1 } 38% { opacity: .62 } 52% { opacity: .95 } 70% { opacity: .74 } }
    .wisp { animation: bob 6.5s ease-in-out infinite alternate }
    .p2 { animation-delay: -3.2s }
    @keyframes bob { from { transform: translate(0,0); opacity: .35 }
                     to   { transform: translate(2px,-3px); opacity: .8 } }
    .mist { animation: creep 24s ease-in-out infinite alternate }
    @keyframes creep { from { transform: translateX(-4px) } to { transform: translateX(4px) } }
    @media (prefers-reduced-motion: reduce) {
      .bat, .wing, .flicker, .wisp, .mist { animation: none }
    }
  </style>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060310"/>
      <stop offset="55%" stop-color="#0E0719"/>
      <stop offset="100%" stop-color="#1A0D28"/>
    </linearGradient>
    <radialGradient id="moonHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#F4E9C8" stop-opacity=".30"/>
      <stop offset="45%" stop-color="#B08FCE" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#B08FCE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FF9C2A" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#E8730C" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#E8730C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#4A2A66" stop-opacity=".42"/>
      <stop offset="60%" stop-color="#3A1F52" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#3A1F52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gourd" cx=".38" cy=".3" r=".8">
      <stop offset="0%" stop-color="#FFA43A"/>
      <stop offset="60%" stop-color="#E8730C"/>
      <stop offset="100%" stop-color="#A64A05"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation=".75"/>
    </filter>
    <clipPath id="moonFace"><circle cx="80" cy="7.4" r="4.8"/></clipPath>
    <!-- One bat: ears, a body, and two wings with the scallop a wing has. -->
    <path id="bat" d="M0 1.5 C-.9 1.6 -1.6 1.1 -2 .4 C-2.9 1 -3.9 1.2 -4.9 .9
                      C-4.1 .3 -3.7 -.5 -3.7 -1.4 C-2.7 -.8 -1.7 -.4 -.85 -.2
                      C-.65 -.95 -.25 -1.4 0 -1.4 C.25 -1.4 .65 -.95 .85 -.2
                      C1.7 -.4 2.7 -.8 3.7 -1.4 C3.7 -.5 4.1 .3 4.9 .9
                      C3.9 1.2 2.9 1 2 .4 C1.6 1.1 .9 1.6 0 1.5 Z"/>
  </defs>

  <rect width="160" height="40" fill="url(#night)"/>

  <!-- Stars, thinning out towards the moon the way they do. -->
  <g fill="#F4E9C8">
    <circle cx="6" cy="4" r=".34" opacity=".8"/><circle cx="12" cy="10" r=".24" opacity=".6"/>
    <circle cx="18" cy="3" r=".3" opacity=".7"/><circle cx="25" cy="8" r=".26" opacity=".62"/>
    <circle cx="31" cy="4" r=".34" opacity=".78"/><circle cx="37" cy="11" r=".22" opacity=".5"/>
