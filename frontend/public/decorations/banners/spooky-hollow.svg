    <path d="M43.4 17.2 Q50 12.6 56.6 17.2 Z"/>
    <path d="M56.2 22.2 L56.2 13.6 L59.4 13.6 L59.4 22.2 Z"/>
    <path d="M55.4 13.9 Q57.8 8.6 58.6 6.4 Q59.4 9.4 60.2 13.9 Z"/>
