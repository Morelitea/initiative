<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Open doors</title>
  <!-- Five doorways in five idioms, all of them standing open, all of them
       with the light on. -->
  <defs>
    <linearGradient id="odWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3448"/><stop offset="58%" stop-color="#2A2537"/>
      <stop offset="100%" stop-color="#191527"/>
    </linearGradient>
    <linearGradient id="odPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4C878" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#F4C878" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="odWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B06A20"/><stop offset="52%" stop-color="#F2AE50"/>
      <stop offset="100%" stop-color="#FFE4A8"/>
    </linearGradient>
  </defs>
  <style>
    .door { animation: odGlow 8s ease-in-out infinite }
    .d1 { animation-delay: -1.6s } .d2 { animation-delay: -3.2s }
    .d3 { animation-delay: -4.8s } .d4 { animation-delay: -6.4s }
    @keyframes odGlow { 0%, 100% { opacity: .58 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .door { animation: none; opacity: .85 } }
  </style>
  <rect width="160" height="40" fill="url(#odWall)"/>
  <g fill="none" stroke="#4A4257" stroke-width=".7" opacity=".7">
    <path d="M0 6 L160 6 M0 14 L160 14 M0 22 L160 22 M0 30 L160 30"/>
    <path d="M8 0 L8 6 M28 6 L28 14 M44 0 L44 6 M60 14 L60 22 M76 0 L76 6
             M92 6 L92 14 M108 22 L108 30 M124 0 L124 6 M140 14 L140 22"/>
  </g>
  <path d="M0 33 L160 33 L160 40 L0 40 Z" fill="#221D30"/><path d="M0 33 L160 33 L160 33.8 L0 33.8 Z" fill="#7E6E92" opacity=".45"/>
  <g class="door d0"><path d="M6.5 33.0 L6.5 12.0 A9.5 9.5 0 0 1 25.5 12.0 L25.5 33.0 Z" fill="url(#odWarm)"/><path d="M2.5 40 L8.1 33.0 L23.9 33.0 L29.5 40 Z" fill="url(#odPool)"/></g><path d="M6.5 33.0 L6.5 12.0 A9.5 9.5 0 0 1 25.5 12.0 L25.5 33.0 Z" fill="none" stroke="#171423" stroke-width="1.2"/><g class="door d1"><path d="M38.5 33.0 L38.5 14.0 Q47 5.0 48 3.0 Q49 5.0 57.5 14.0 L57.5 33.0 Z" fill="url(#odWarm)"/><path d="M34.5 40 L40.1 33.0 L55.9 33.0 L61.5 40 Z" fill="url(#odPool)"/></g><path d="M38.5 33.0 L38.5 14.0 Q47 5.0 48 3.0 Q49 5.0 57.5 14.0 L57.5 33.0 Z" fill="none" stroke="#171423" stroke-width="1.2"/><g class="door d2"><path d="M70.21 33.0 L70.21 21.11 A12.10 12.10 0 1 1 89.79 21.11 L89.79 33.0 Z" fill="url(#odWarm)"/><path d="M66.5 40 L72.1 33.0 L87.9 33.0 L93.5 40 Z" fill="url(#odPool)"/></g><path d="M70.21 33.0 L70.21 21.11 A12.10 12.10 0 1 1 89.79 21.11 L89.79 33.0 Z" fill="none" stroke="#171423" stroke-width="1.2"/><g class="door d3"><path d="M102.5 33.0 L102.5 15.0 C102.5 8.0 109.6 10.0 112 3.0 C114.4 10.0 121.5 8.0 121.5 15.0 L121.5 33.0 Z" fill="url(#odWarm)"/><path d="M98.5 40 L104.1 33.0 L119.9 33.0 L125.5 40 Z" fill="url(#odPool)"/></g><path d="M102.5 33.0 L102.5 15.0 C102.5 8.0 109.6 10.0 112 3.0 C114.4 10.0 121.5 8.0 121.5 15.0 L121.5 33.0 Z" fill="none" stroke="#171423" stroke-width="1.2"/><g class="door d4"><path d="M134.5 33.0 L134.5 12.6 L153.5 12.6 L153.5 33.0 Z" fill="url(#odWarm)"/><path d="M130.5 40 L136.1 33.0 L151.9 33.0 L157.5 40 Z" fill="url(#odPool)"/></g><path d="M134.5 33.0 L134.5 12.6 L153.5 12.6 L153.5 33.0 Z" fill="none" stroke="#171423" stroke-width="1.2"/><g fill="#A47B4E"><path d="M131.3 33.0 L131.3 12.6 L134.5 12.6 L134.5 33.0 Z"/><path d="M156.7 33.0 L156.7 12.6 L153.5 12.6 L153.5 33.0 Z"/><path d="M130.1 10.2 L157.9 10.2 L157.9 12.6 L130.1 12.6 Z"/><path d="M128.1 4.6 C139 6.1 149 6.1 159.9 4.6 L159.9 7.6 C149 9.1 139 9.1 128.1 7.6 Z"/></g><g fill="#6B4C2C" opacity=".5"><path d="M130.1 11.9 L157.9 11.9 L157.9 12.6 L130.1 12.6 Z"/></g>
</svg>
