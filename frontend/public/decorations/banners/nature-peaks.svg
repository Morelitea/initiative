<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Peaks</title>
  <!-- First light on the tops, before it reaches the valley. -->
  <style>
    .haze { animation: drift 30s ease-in-out infinite alternate }
    .h2 { animation-duration: 38s; animation-delay: -12s }
    @keyframes drift { from { transform: translateX(-7px) } to { transform: translateX(7px) } }
    .rise { animation: warm 12s ease-in-out infinite alternate }
    @keyframes warm { from { opacity: .82 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .haze, .rise { animation: none } }
  </style>
  <defs>
    <filter id="soft" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3E6E"/><stop offset="50%" stop-color="#E08A6A"/>
      <stop offset="100%" stop-color="#F6C98E"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#dawn)"/>
  <circle class="rise" cx="112" cy="17" r="5" fill="#FFE7B8" opacity=".9"/>
  <circle class="rise" cx="112" cy="17" r="11" fill="#FFE7B8" opacity=".16"/>
  <path d="M0 26 L20 12 L34 22 L46 10 L64 26 Z" fill="#5A6E8C" opacity=".7"/>
  <path d="M96 26 L112 14 L126 24 L140 11 L160 26 Z" fill="#5A6E8C" opacity=".7"/>
  <path d="M0 30 L26 8 L44 22 L58 6 L84 30 Z" fill="#3E5470"/>
  <path d="M26 8 L44 22 L36 22 L20 13 Z" fill="#5E7794"/>
  <path d="M58 6 L84 30 L70 30 L52 12 Z" fill="#2E4258"/>
  <path d="M76 30 L100 10 L120 24 L136 8 L160 30 Z" fill="#2E4258"/>
  <path d="M100 10 L120 24 L112 24 L94 14 Z" fill="#48607C"/>
  <g fill="#F2F8FC">
    <path d="M26 8 L32 13 L29.4 12.4 L27 13.6 L24.6 12.4 L22 13.6 Z"/>
    <path d="M58 6 L64 12 L61.4 11.4 L59 12.6 L56.6 11.4 L54 12.6 Z"/>
    <path d="M100 10 L105.4 14.6 L103 14 L100.6 15.2 L98.4 14 L96 15.2 Z"/>
    <path d="M136 8 L142 13.4 L139.4 12.8 L137 14 L134.6 12.8 L132 14 Z"/>
  </g>
  <path d="M0 30 C30 27.6 60 31 90 29 C118 27.2 142 30 160 28.6 L160 40 L0 40 Z"
        fill="#1E3A34"/>
  <g fill="#16302A">
    <path d="M12 30 C12 26.6 13.4 24 15 22.6 C16.6 24 18 26.6 18 30 Z"/>
    <path d="M22 31 C22 28 23.2 25.6 24.6 24.4 C26 25.6 27.2 28 27.2 31 Z"/>
    <path d="M132 29.6 C132 26.4 133.4 24 135 22.6 C136.6 24 138 26.4 138 29.6 Z"/>
    <path d="M144 30.4 C144 27.4 145.2 25.2 146.6 24 C148 25.2 149.2 27.4 149.2 30.4 Z"/>
  </g>
  <ellipse cx="66" cy="34" rx="46" ry="4" fill="#FFFFFF" opacity=".16"
           filter="url(#soft)"/>  <!-- Valley cloud, moving the way it does before the sun gets down there. -->
  <g fill="#F2E4E0" filter="url(#soft)">
    <ellipse class="haze" cx="46" cy="27.6" rx="34" ry="2.2" opacity=".35"/>
    <ellipse class="haze h2" cx="116" cy="29.4" rx="40" ry="2.6" opacity=".3"/>
    <ellipse class="haze h2" cx="80" cy="25.4" rx="24" ry="1.6" opacity=".22"/>
  </g>
</svg>
