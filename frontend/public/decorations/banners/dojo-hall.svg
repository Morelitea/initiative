  <g>
    <path d="M61.4 17 L61.4 20.4 L62.6 20.4 L62.6 17 Z" fill="#6B4A2A"/>
    <path d="M67.4 17 L67.4 20.4 L68.6 20.4 L68.6 17 Z" fill="#6B4A2A"/>
