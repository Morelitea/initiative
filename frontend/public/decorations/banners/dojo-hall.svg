<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Dojo</title>
  <!-- The alcove at the head of the hall, centred, with the mats running away
       from it and the belts on their rack down one wall. -->
  <style>
    .lamp { animation: warm 6s ease-in-out infinite }
    @keyframes warm { 0%,100% { opacity: 1 } 50% { opacity: .82 } }
    .brush { stroke-dasharray: 120; stroke-dashoffset: 0 }
    @media (prefers-reduced-motion: reduce) { .lamp { animation: none } }
  </style>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E2C2"/><stop offset="100%" stop-color="#D9C49A"/>
    </linearGradient>
    <linearGradient id="tatami" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C3AC72"/><stop offset="100%" stop-color="#9C8551"/>
    </linearGradient>
    <radialGradient id="lantern" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#FFD79A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="#2E1F13"/>
  <!-- Shoji, panel by panel. -->
  <path d="M0 3 L160 3 L160 21 L0 21 Z" fill="url(#paper)"/>
