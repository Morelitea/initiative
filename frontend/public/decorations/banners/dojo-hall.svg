    <path d="M120 3 L120 21"/><path d="M130 3 L130 21"/><path d="M140 3 L140 21"/>
    <path d="M150 3 L150 21"/>
  </g>
  <g stroke="#5A3D22" stroke-width="1.4">
    <path d="M0 3 L160 3"/><path d="M56 3 L56 21"/><path d="M104 3 L104 21"/>
  </g>
  <path d="M0 0 L160 0 L160 3.2 L0 3.2 Z" fill="#4A3119"/>
  <path d="M0 2.6 L160 2.6 L160 3.2 L0 3.2 Z" fill="#654327"/>
