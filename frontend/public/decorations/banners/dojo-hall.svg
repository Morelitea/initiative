    <path d="M129.8 7.4 L131.8 7.4 L131.8 16.4 L129.8 16.4 Z" fill="#4F8A3E"/>
    <path d="M134.4 7.4 L136.4 7.4 L136.4 17.4 L134.4 17.4 Z" fill="#2F63A8"/>
    <path d="M139 7.4 L141 7.4 L141 16.8 L139 16.8 Z" fill="#7A4A22"/>
    <path d="M143.6 7.4 L145.6 7.4 L145.6 18 L143.6 18 Z" fill="#1A1A1E"/>
    <g fill="#000000" opacity=".14">
      <path d="M117.2 7.4 L118 7.4 L118 17.6 L117.2 17.6 Z"/>
      <path d="M126.4 7.4 L127.2 7.4 L127.2 17.8 L126.4 17.8 Z"/>
      <path d="M135.6 7.4 L136.4 7.4 L136.4 17.4 L135.6 17.4 Z"/>
      <path d="M144.8 7.4 L145.6 7.4 L145.6 18 L144.8 18 Z"/>
