     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Morning star</title>
  <!-- An eight-pointed star pieced out of diamonds, the way a star quilt is
       pieced, on a dark ground. An original arrangement of that geometry. -->
  <style>
    .shine { animation: lift 9s ease-in-out infinite }
    @keyframes lift { 0%,100% { opacity: .16 } 50% { opacity: .34 } }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none } }
    .tw { animation: wink 4.6s ease-in-out infinite alternate }
    .t1 { animation-duration: 3.4s } .t2 { animation-duration: 5.8s }
    .t3 { animation-duration: 6.6s }
    @keyframes wink { from { opacity: .12 } to { opacity: .85 } }
    @media (prefers-reduced-motion: reduce) { .tw { animation: none; opacity: .5 } }
  </style>
