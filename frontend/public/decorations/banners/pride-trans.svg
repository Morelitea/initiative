<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Trans</title>
  <!-- The flag, run full width, with the light a hanging one catches. -->
  <style>
    .ripple { animation: wave 14s ease-in-out infinite alternate }
    @keyframes wave { from { transform: translateX(-6px) } to { transform: translateX(6px) } }
    @media (prefers-reduced-motion: reduce) { .ripple { animation: none } }
    .sheen { animation: sweep 11s ease-in-out infinite }
    @keyframes sweep { 0%,100% { transform: translateX(-40px) }
                       50% { transform: translateX(200px) } }
    @media (prefers-reduced-motion: reduce) { .sheen { animation: none; opacity: 0 } }
  </style>
  <defs>
    <linearGradient id="foldtrans" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0%" stop-color="#000000" stop-opacity=".16"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset="38%" stop-color="#000000" stop-opacity=".13"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="78%" stop-color="#000000" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="glosstrans" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="160" height="8.02" fill="#5BCEFA"/><rect x="0" y="8" width="160" height="8.02" fill="#F5A9B8"/><rect x="0" y="16" width="160" height="8.02" fill="#FFFFFF"/><rect x="0" y="24" width="160" height="8.02" fill="#F5A9B8"/><rect x="0" y="32" width="160" height="8.02" fill="#5BCEFA"/>
  <rect class="ripple" x="-8" y="0" width="176" height="40" fill="url(#foldtrans)"/>
  <rect class="sheen" x="0" y="0" width="40" height="40" fill="url(#glosstrans)"/>
</svg>
