<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Caddies</title>
  <!-- The shelf you keep meaning to label properly. -->
  <style>
    .warm { animation: glow 8s ease-in-out infinite alternate }
    @keyframes glow { from { opacity: .45 } to { opacity: .8 } }
    .curl { animation: rise 8s ease-out infinite }
    .c2 { animation-delay: -2.6s } .c3 { animation-delay: -5.2s }
    @keyframes rise { 0% { transform: translate(0,0) scale(.5); opacity: 0 }
                      22% { opacity: .5 }
                      100% { transform: translate(-3px,-10px) scale(1.5); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .warm, .curl { animation: none } }
  </style>
  <defs>
