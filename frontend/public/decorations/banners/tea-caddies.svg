    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A6034"/><stop offset="100%" stop-color="#4A3018"/>
    </linearGradient>
    <linearGradient id="glassjar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8E2DC" stop-opacity=".5"/>
      <stop offset="42%" stop-color="#F2F6F2" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#A8B4AE" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="pantrylight" cx=".5" cy=".2" r=".75">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#FFD79A" stop-opacity="0"/>
