<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>Record shop</title>
  <!-- An hour in, three maybes, no decision. -->
  <style>
    .flip { animation: nudge 6s ease-in-out infinite alternate }
    @keyframes nudge { from { transform: translateX(-1px) rotate(-1deg) } to { transform: translateX(1px) rotate(1deg) } }
    .flip { transform-box: fill-box; transform-origin: 50% 100% }
    @media (prefers-reduced-motion: reduce) { .flip { animation: none } }
  </style>
  <defs>
    <linearGradient id="shop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#211A2E"/><stop offset="100%" stop-color="#3A2C42"/>
    </linearGradient>
  </defs>
  <rect width="160" height="40" fill="url(#shop)"/>
  <!-- Sleeves pinned up on the back wall. -->
  <g>
    <rect x="8" y="4" width="13" height="13" rx=".6" fill="#F0567A"/>
    <circle cx="14.5" cy="10.5" r="4" fill="#241A33"/>
