    <path d="M26 15.4 L30 9 L34 15.4 Z" fill="#EAF8FF"/>
    <rect x="40" y="4" width="13" height="13" rx=".6" fill="#E8B21C"/>
    <g stroke="#241A33" stroke-width="1.2"><path d="M42.6 14 L50.4 14"/><path d="M42.6 11 L50.4 11"/></g>
