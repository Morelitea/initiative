<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="1600" height="400"
     role="presentation" preserveAspectRatio="xMidYMid slice">
  <title>North star</title>
  <!-- The drinking gourd, the star its lip points to, and a quilt laid out
       under both. -->
  <style>
    .twinkle { animation: pulse 6s ease-in-out infinite }
    .slow { animation: pulse 9s ease-in-out infinite; animation-delay: -3s }
    .tw { animation: wink 4.4s ease-in-out infinite alternate }
    .w1 { animation-delay: -.7s; animation-duration: 5.6s }
    .w2 { animation-delay: -1.4s; animation-duration: 3.8s }
    .w3 { animation-delay: -2.1s; animation-duration: 6.2s }
    .w4 { animation-delay: -2.8s; animation-duration: 4.9s }
    @keyframes wink { from { opacity: .2 } to { opacity: 1 } }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    .beam { animation: breathe 7s ease-in-out infinite;
            transform-box: view-box; transform-origin: 80px 9px }
    @keyframes breathe { 0%,100% { transform: scale(.9); opacity: .5 }
                         50% { transform: scale(1.08); opacity: .85 } }
    @media (prefers-reduced-motion: reduce) {
      .twinkle, .slow, .beam, .tw { animation: none } }
  </style>
  <defs>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1030"/><stop offset="55%" stop-color="#1B2154"/>
      <stop offset="100%" stop-color="#3A2456"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#F6D98A" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#F6D98A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="40" fill="url(#nightsky)"/>

  <!-- The field of stars behind everything. -->
  <g fill="#FFF6E0" class="slow">
    <circle cx="72.4" cy="14.6" r="0.42" opacity="0.60"/><circle class="tw w2" cx="136.8" cy="4.9" r="0.42" opacity="0.70"/><circle cx="126.9" cy="2.4" r="0.34" opacity="0.43"/><circle class="tw w4" cx="86.2" cy="23.1" r="0.22" opacity="0.68"/><circle cx="63.4" cy="11.8" r="0.28" opacity="0.69"/><circle class="tw w1" cx="133.1" cy="1.6" r="0.22" opacity="0.45"/><circle cx="38.7" cy="0.8" r="0.42" opacity="0.53"/>
    <circle class="tw w3" cx="94.6" cy="5.1" r="0.28" opacity="0.70"/><circle cx="80.0" cy="17.2" r="0.42" opacity="0.71"/><circle class="tw w0" cx="65.1" cy="14.3" r="0.22" opacity="0.74"/><circle cx="50.4" cy="6.0" r="0.34" opacity="0.37"/><circle class="tw w2" cx="90.1" cy="2.8" r="0.22" opacity="0.82"/><circle cx="61.8" cy="24.9" r="0.22" opacity="0.47"/><circle class="tw w4" cx="148.3" cy="1.4" r="0.42" opacity="0.89"/>
    <circle cx="63.6" cy="1.9" r="0.28" opacity="0.78"/><circle class="tw w1" cx="43.2" cy="2.3" r="0.34" opacity="0.36"/><circle cx="65.6" cy="24.0" r="0.28" opacity="0.49"/><circle class="tw w3" cx="16.2" cy="1.6" r="0.42" opacity="0.45"/><circle cx="89.5" cy="11.6" r="0.28" opacity="0.89"/><circle class="tw w0" cx="123.1" cy="10.9" r="0.42" opacity="0.41"/><circle cx="67.3" cy="5.5" r="0.34" opacity="0.83"/>
    <circle class="tw w2" cx="156.0" cy="15.4" r="0.22" opacity="0.47"/><circle cx="63.1" cy="22.2" r="0.22" opacity="0.37"/><circle class="tw w4" cx="23.4" cy="11.5" r="0.22" opacity="0.77"/><circle cx="52.6" cy="7.7" r="0.22" opacity="0.39"/><circle class="tw w1" cx="33.4" cy="16.6" r="0.22" opacity="0.68"/><circle cx="59.5" cy="11.8" r="0.42" opacity="0.81"/><circle class="tw w3" cx="21.7" cy="10.0" r="0.28" opacity="0.52"/>
    <circle cx="36.5" cy="15.9" r="0.28" opacity="0.44"/><circle class="tw w0" cx="100.6" cy="14.4" r="0.42" opacity="0.84"/><circle cx="96.6" cy="11.0" r="0.22" opacity="0.41"/><circle class="tw w2" cx="82.0" cy="6.6" r="0.42" opacity="0.49"/><circle cx="131.8" cy="15.5" r="0.34" opacity="0.64"/><circle class="tw w4" cx="148.7" cy="25.4" r="0.28" opacity="0.48"/><circle cx="89.5" cy="22.2" r="0.22" opacity="0.50"/>
    <circle class="tw w1" cx="146.8" cy="5.3" r="0.22" opacity="0.39"/><circle cx="65.8" cy="6.5" r="0.22" opacity="0.45"/><circle class="tw w3" cx="59.0" cy="14.9" r="0.28" opacity="0.40"/><circle cx="22.1" cy="11.7" r="0.34" opacity="0.71"/><circle class="tw w0" cx="110.6" cy="15.2" r="0.28" opacity="0.67"/><circle cx="147.8" cy="12.3" r="0.34" opacity="0.74"/><circle class="tw w2" cx="154.0" cy="0.6" r="0.22" opacity="0.62"/>
    <circle cx="116.9" cy="8.3" r="0.22" opacity="0.39"/><circle class="tw w4" cx="87.4" cy="19.2" r="0.28" opacity="0.79"/><circle cx="146.4" cy="9.1" r="0.42" opacity="0.85"/><circle class="tw w1" cx="139.4" cy="10.8" r="0.22" opacity="0.82"/><circle cx="91.6" cy="16.2" r="0.42" opacity="0.56"/><circle class="tw w3" cx="2.0" cy="1.9" r="0.22" opacity="0.70"/><circle cx="158.9" cy="22.9" r="0.34" opacity="0.56"/>
    <circle class="tw w0" cx="117.6" cy="15.1" r="0.42" opacity="0.60"/><circle cx="86.6" cy="13.5" r="0.22" opacity="0.52"/><circle class="tw w2" cx="14.0" cy="0.6" r="0.22" opacity="0.62"/><circle cx="98.3" cy="23.9" r="0.34" opacity="0.84"/><circle class="tw w4" cx="58.9" cy="3.7" r="0.28" opacity="0.64"/><circle cx="120.6" cy="8.9" r="0.42" opacity="0.62"/><circle class="tw w1" cx="38.6" cy="10.5" r="0.34" opacity="0.46"/>
    <circle cx="68.9" cy="21.0" r="0.28" opacity="0.83"/><circle class="tw w3" cx="61.5" cy="15.2" r="0.34" opacity="0.47"/><circle cx="21.5" cy="9.1" r="0.22" opacity="0.74"/><circle class="tw w0" cx="152.0" cy="7.2" r="0.28" opacity="0.41"/><circle cx="75.4" cy="24.1" r="0.42" opacity="0.56"/><circle class="tw w2" cx="83.2" cy="17.5" r="0.42" opacity="0.53"/><circle cx="132.6" cy="7.2" r="0.22" opacity="0.72"/>
    <circle class="tw w4" cx="45.0" cy="9.2" r="0.22" opacity="0.70"/><circle cx="64.8" cy="4.9" r="0.34" opacity="0.48"/><circle class="tw w1" cx="22.5" cy="1.2" r="0.22" opacity="0.60"/><circle cx="100.8" cy="17.0" r="0.34" opacity="0.88"/><circle class="tw w3" cx="109.5" cy="5.2" r="0.42" opacity="0.49"/><circle cx="114.3" cy="19.6" r="0.22" opacity="0.45"/><circle class="tw w0" cx="43.6" cy="9.0" r="0.28" opacity="0.57"/>
  </g>

  <!-- The gourd: seven stars, and the two at the lip that point the way. -->
  <g class="twinkle">
    <path d="M46 20.4 L52.6 21.6 L58.4 20.2 L63.4 18.2 L68.4 15.6 L72.4 12.8 L71.2 8.6" fill="none" stroke="#CFE0FF" stroke-width=".34" opacity=".4"/>
    <g fill="#EAF1FF"><circle cx="46" cy="20.4" r="0.85"/><circle cx="52.6" cy="21.6" r="0.85"/><circle cx="58.4" cy="20.2" r="0.85"/><circle cx="63.4" cy="18.2" r="0.85"/><circle cx="68.4" cy="15.6" r="0.85"/><circle cx="72.4" cy="12.8" r="1.05"/><circle cx="71.2" cy="8.6" r="1.05"/></g>
  </g>

  <!-- North. -->
  <circle class="beam" cx="80" cy="9" r="11" fill="url(#halo)"/>
  <g fill="#FFF6E0">
    <path d="M80 1.4 L81.5 7.5 L87.6 9 L81.5 10.5 L80 16.6 L78.5 10.5 L72.4 9 L78.5 7.5 Z"/>
    <path d="M80 4.6 L80.7 8.3 L84.4 9 L80.7 9.7 L80 13.4 L79.3 9.7 L75.6 9 L79.3 8.3 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- The quilt: blocks pieced from the strips at hand, laid across the foot. -->
  <g>
    <rect x="0" y="31" width="160" height="9" fill="#171021"/>
    <g>
      <rect x="0" y="31" width="20" height="9" fill="#1E6B3C"/>
      <rect x="20" y="31" width="20" height="9" fill="#9E2620"/>
      <rect x="40" y="31" width="20" height="9" fill="#C9931C"/>
      <rect x="60" y="31" width="20" height="9" fill="#241C36"/>
      <rect x="80" y="31" width="20" height="9" fill="#9E2620"/>
      <rect x="100" y="31" width="20" height="9" fill="#1E6B3C"/>
      <rect x="120" y="31" width="20" height="9" fill="#C9931C"/>
      <rect x="140" y="31" width="20" height="9" fill="#9E2620"/>
    </g>
    <!-- A star block in each square, the way a freedom quilt carried one. -->
    <g><path d="M10.00 32.26 L11.06 34.55 L13.60 35.50 L11.06 36.45 L10.00 38.74 L8.94 36.45 L6.40 35.50 L8.94 34.55 Z" fill="#F2E8D6" opacity=".9"/><path d="M30.00 32.26 L31.06 34.55 L33.60 35.50 L31.06 36.45 L30.00 38.74 L28.94 36.45 L26.40 35.50 L28.94 34.55 Z" fill="#F2E8D6" opacity=".9"/><path d="M50.00 32.26 L51.06 34.55 L53.60 35.50 L51.06 36.45 L50.00 38.74 L48.94 36.45 L46.40 35.50 L48.94 34.55 Z" fill="#F2E8D6" opacity=".9"/><path d="M70.00 32.26 L71.06 34.55 L73.60 35.50 L71.06 36.45 L70.00 38.74 L68.94 36.45 L66.40 35.50 L68.94 34.55 Z" fill="#F2E8D6" opacity=".9"/><path d="M90.00 32.26 L91.06 34.55 L93.60 35.50 L91.06 36.45 L90.00 38.74 L88.94 36.45 L86.40 35.50 L88.94 34.55 Z" fill="#F2E8D6" opacity=".9"/><path d="M110.00 32.26 L111.06 34.55 L113.60 35.50 L111.06 36.45 L110.00 38.74 L108.94 36.45 L106.40 35.50 L108.94 34.55 Z" fill="#F2E8D6" opacity=".9"/><path d="M130.00 32.26 L131.06 34.55 L133.60 35.50 L131.06 36.45 L130.00 38.74 L128.94 36.45 L126.40 35.50 L128.94 34.55 Z" fill="#F2E8D6" opacity=".9"/><path d="M150.00 32.26 L151.06 34.55 L153.60 35.50 L151.06 36.45 L150.00 38.74 L148.94 36.45 L146.40 35.50 L148.94 34.55 Z" fill="#F2E8D6" opacity=".9"/></g>
    <g><path d="M10.00 33.79 L10.57 34.99 L11.90 35.50 L10.57 36.01 L10.00 37.21 L9.43 36.01 L8.10 35.50 L9.43 34.99 Z" fill="#171021" opacity=".5"/><path d="M30.00 33.79 L30.57 34.99 L31.90 35.50 L30.57 36.01 L30.00 37.21 L29.43 36.01 L28.10 35.50 L29.43 34.99 Z" fill="#171021" opacity=".5"/><path d="M50.00 33.79 L50.57 34.99 L51.90 35.50 L50.57 36.01 L50.00 37.21 L49.43 36.01 L48.10 35.50 L49.43 34.99 Z" fill="#171021" opacity=".5"/><path d="M70.00 33.79 L70.57 34.99 L71.90 35.50 L70.57 36.01 L70.00 37.21 L69.43 36.01 L68.10 35.50 L69.43 34.99 Z" fill="#171021" opacity=".5"/><path d="M90.00 33.79 L90.57 34.99 L91.90 35.50 L90.57 36.01 L90.00 37.21 L89.43 36.01 L88.10 35.50 L89.43 34.99 Z" fill="#171021" opacity=".5"/><path d="M110.00 33.79 L110.57 34.99 L111.90 35.50 L110.57 36.01 L110.00 37.21 L109.43 36.01 L108.10 35.50 L109.43 34.99 Z" fill="#171021" opacity=".5"/><path d="M130.00 33.79 L130.57 34.99 L131.90 35.50 L130.57 36.01 L130.00 37.21 L129.43 36.01 L128.10 35.50 L129.43 34.99 Z" fill="#171021" opacity=".5"/><path d="M150.00 33.79 L150.57 34.99 L151.90 35.50 L150.57 36.01 L150.00 37.21 L149.43 36.01 L148.10 35.50 L149.43 34.99 Z" fill="#171021" opacity=".5"/></g>
    <!-- Seam stitching. -->
    <g stroke="#F2E8D6" stroke-width=".34" opacity=".45" stroke-dasharray="1.2 1.4" fill="none">
      <path d="M0 31.7 L160 31.7"/><path d="M0 39.3 L160 39.3"/>
      <path d="M20 31 L20 40"/><path d="M40 31 L40 40"/><path d="M60 31 L60 40"/>
      <path d="M80 31 L80 40"/><path d="M100 31 L100 40"/><path d="M120 31 L120 40"/>
      <path d="M140 31 L140 40"/>
    </g>
    <path d="M0 31 L160 31" stroke="#0B1030" stroke-width="1.2" opacity=".5"/>
  </g>
</svg>
