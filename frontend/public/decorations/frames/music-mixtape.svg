    <circle cx="24" cy="116" r="2.2"/><circle cx="104" cy="116" r="2.2"/>
  </g>
  <g fill="#5A616D">
    <circle cx="9" cy="9" r="2"/><circle cx="119" cy="9" r="2"/>
    <circle cx="9" cy="119" r="2"/><circle cx="119" cy="119" r="2"/>
  </g>
</svg>
