<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Polyamorous</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts.
       The flag's colours as 3 equal arcs, turning, the way Spectrum does. -->
  <style>
    .turn { animation: spin 24s linear infinite; transform-box: view-box; transform-origin: 64px 64px }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .turn { animation: none } }
  </style>
  <defs>
    <!-- Circumference at r=55 is 2πr ≈ 345.6; a 3th of it is 115.2. -->
    <circle id="band" cx="64" cy="64" r="55" fill="none" stroke-width="7"
            stroke-dasharray="115.19 230.38"/>
  </defs>
  <circle cx="64" cy="64" r="51" fill="none" stroke="#14121C" stroke-width="3"/>
  <g class="turn">
    <use href="#band" stroke="#0000FF" stroke-dashoffset="-0.00"/>
    <use href="#band" stroke="#D60270" stroke-dashoffset="-115.19"/>
    <use href="#band" stroke="#7B1FA2" stroke-dashoffset="-230.38"/>
  </g>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#14121C" stroke-opacity=".35" stroke-width="1"/>
  <!-- The heart the flag carries, held upright while the band turns. -->
  <g transform="translate(64 8.6) scale(.62)">
    <path d="M0 11 C-9 5 -11 -.4 -11 -3 C-11 -6.8 -7.8 -9.6 -4 -9.6
             C-2 -9.6 -.8 -8.6 0 -7.2 C.8 -8.6 2 -9.6 4 -9.6
             C7.8 -9.6 11 -6.8 11 -3 C11 -.4 9 5 0 11 Z" fill="#FCD62B"/>
    <path d="M0 11 C-9 5 -11 -.4 -11 -3 C-11 -6.8 -7.8 -9.6 -4 -9.6
             C-2 -9.6 -.8 -8.6 0 -7.2 C.8 -8.6 2 -9.6 4 -9.6
             C7.8 -9.6 11 -6.8 11 -3 C11 -.4 9 5 0 11 Z" fill="none" stroke="#14121C"
          stroke-width="1.6"/>
  </g>
</svg>
