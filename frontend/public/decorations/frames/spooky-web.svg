  <title>Cobweb</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts.
       The web lives entirely outside it, and it is spun rather than drafted —
       the spokes are unevenly spaced and unequal in length, every length of
       spiral sags back towards the hub, and one sector has given way and hangs
       loose. -->
  <style>
