<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Cobweb</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts.
       The whole web lives in the band outside it — silk over the picture would
       be a veil across someone's face rather than a frame around it. -->
  <style>
    .spider { animation: patrol 18s linear infinite; transform-origin: 64px 64px }
    @keyframes patrol { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .spider { animation: none } }
  </style>
  <circle cx="64" cy="64" r="51" fill="none" stroke="#1A0E26" stroke-width="3"/>
  <path d="M64 1 A63 63 0 1 0 64 127 A63 63 0 1 0 64 1 Z M64 15 A49 49 0 1 1 64 113 A49 49 0 1 1 64 15 Z"
        fill="#1A0E26" fill-opacity=".45" fill-rule="evenodd"/>
