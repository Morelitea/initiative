    <path d="M115.0 64.0 L127.0 64.0"/>
    <path d="M111.1 83.5 L122.2 88.1"/>
    <path d="M100.1 100.1 L108.5 108.5"/>
    <path d="M83.5 111.1 L88.1 122.2"/>
