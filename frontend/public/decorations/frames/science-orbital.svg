<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Orbital</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <style>
    .shell { transform-origin: 64px 64px }
    .a { animation: spin 7s linear infinite }
    .b { animation: spin 11s linear infinite reverse }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .shell { animation: none } }
  </style>
  <circle cx="64" cy="64" r="51" fill="none" stroke="#050914" stroke-width="3"/>
  <!-- The shell itself: a ring of ticks, like a dial. -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="#123055" stroke-width="4"/>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#2f6ea8" stroke-width="4"
          stroke-dasharray="1 7" stroke-linecap="butt"/>
  <!-- Two electrons, opposite ways round. -->
  <g class="shell a">
    <circle cx="64" cy="64" r="60.5" fill="none" stroke="#2f6ea8" stroke-width="1" opacity=".55"/>
    <circle cx="124.5" cy="64" r="3.5" fill="#7fd4ff"/>
    <circle cx="124.5" cy="64" r="1.3" fill="#eaf8ff"/>
  </g>
  <g class="shell b">
    <circle cx="3.5" cy="64" r="3" fill="#a8e9ff"/>
  </g>
</svg>
