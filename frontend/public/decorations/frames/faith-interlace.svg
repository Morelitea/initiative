  <title>Interlace</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <!-- Two strands over and under each other the whole way round, which is a
       thing knotwork, girih and a mandala border all do. The crossings catch
       the light in turn. -->
  <style>
    .gem { fill: #FFF0C4; animation: ilGlint 5.5s ease-in-out infinite }
    .m1 { animation-delay: -1.1s } .m2 { animation-delay: -2.2s }
    .m3 { animation-delay: -3.3s } .m4 { animation-delay: -4.4s }
    @keyframes ilGlint { 0%, 100% { opacity: .1 } 50% { opacity: .8 } }
    @media (prefers-reduced-motion: reduce) { .gem { animation: none; opacity: .35 } }
  </style>
