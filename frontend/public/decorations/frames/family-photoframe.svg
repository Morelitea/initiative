<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Photo frame</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <!-- The one on the wall at somebody's mother's house: gilt moulding, a mount,
       and four carved rosettes. It hangs very slightly crooked. -->
  <defs>
    <linearGradient id="pfGilt" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0%" stop-color="#E0C083"/><stop offset="45%" stop-color="#B08A46"/>
      <stop offset="100%" stop-color="#6E4E22"/>
    </linearGradient>
  </defs>
  <style>
    .hang { animation: pfTilt 11s ease-in-out infinite alternate;
            transform-box: view-box; transform-origin: 64px 4px }
    @keyframes pfTilt { from { transform: rotate(-1.4deg) } to { transform: rotate(1.5deg) } }
    @media (prefers-reduced-motion: reduce) { .hang { animation: none } }
  </style>
