      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F2F4F0"/>
      <stop offset="100%" stop-color="#B8BCB6"/>
    </radialGradient>
    <radialGradient id="brRead" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity=".7"/>
      <stop offset="60%" stop-color="#FFE9A8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .read { animation: brPass 11s linear infinite;
            transform-box: view-box; transform-origin: 64px 64px }
    @keyframes brPass { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .read { animation: none; opacity: .3 } }
  </style>
