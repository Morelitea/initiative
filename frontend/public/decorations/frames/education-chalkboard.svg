<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Chalkboard</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <!-- Slate in an oak frame, with a ledge across the bottom that has the chalk
       and the eraser on it. The marks come up the way they are written. -->
  <defs>
    <linearGradient id="cbOak" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0%" stop-color="#B4864E"/><stop offset="52%" stop-color="#8A5F32"/>
      <stop offset="100%" stop-color="#5E3E1E"/>
    </linearGradient>
  </defs>
  <style>
    .ck { fill: none; stroke: #F2F6EE; stroke-width: 1.5; stroke-linecap: round;
          stroke-linejoin: round; animation: cbWrite 7s ease-in-out infinite }
    .c1 { animation-delay: -1.4s } .c2 { animation-delay: -2.8s }
    .c3 { animation-delay: -4.2s } .c4 { animation-delay: -5.6s }
    @keyframes cbWrite { 0%, 100% { opacity: .18 } 45% { opacity: .9 } }
    @media (prefers-reduced-motion: reduce) { .ck { animation: none; opacity: .6 } }
  </style>
