<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Split</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts.
       What this frame looks like before anybody picks its colours. The worn one
       is drawn by TintedFrame, from the two the wearer chose. -->
  <defs>
    <clipPath id="splitBand">
      <path d="M64 .6 A63.4 63.4 0 1 0 64 127.4 A63.4 63.4 0 1 0 64 .6 Z
               M64 13.4 A50.6 50.6 0 1 1 64 114.6 A50.6 50.6 0 1 1 64 13.4 Z"
            clip-rule="evenodd"/>
    </clipPath>
    <linearGradient id="splitSheen" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".26"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#splitBand)">
    <rect x="0" y="0" width="64" height="128" fill="#1b5e32"/>
    <rect x="64" y="0" width="64" height="128" fill="#f2c230"/>
    <rect x="0" y="0" width="128" height="128" fill="url(#splitSheen)"/>
  </g>
  <g stroke="#0D0D10" stroke-width="1.6" opacity=".45">
    <path d="M64 .6 L64 13.4"/><path d="M64 114.6 L64 127.4"/>
  </g>
  <circle cx="64" cy="64" r="50.6" fill="none" stroke="#0D0D10" stroke-width="1.8"/>
  <circle cx="64" cy="64" r="63.4" fill="none" stroke="#0D0D10" stroke-width="1.4"/>
</svg>
