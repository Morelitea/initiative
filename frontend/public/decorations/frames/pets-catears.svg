<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Cat ears</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <!-- Not a ring: the ears sit on the picture rather than round it. Each is one
       shape with a bowed outer edge and a hollow inside it, and the fur along
       the base is what keeps them from looking stuck on. -->
  <defs>
    <linearGradient id="ctFur" x1="0" y1="1" x2=".25" y2="0">
      <stop offset="0%" stop-color="#8C837B"/><stop offset="55%" stop-color="#645C56"/>
      <stop offset="100%" stop-color="#3E3833"/>
    </linearGradient>
    <linearGradient id="ctPinna" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E9A9B2"/><stop offset="100%" stop-color="#C77C88"/>
    </linearGradient>
  </defs>
  <style>
    .earL { animation: ctTwitchL 7.5s ease-in-out infinite;
            transform-box: view-box; transform-origin: 35px 28px }
    .earR { animation: ctTwitchR 9.4s ease-in-out infinite;
            transform-box: view-box; transform-origin: 93px 28px }
    @keyframes ctTwitchL { 0%, 76%, 100% { transform: rotate(0) }
      80% { transform: rotate(-8deg) } 85% { transform: rotate(2deg) }
      90% { transform: rotate(-2deg) } }
    @keyframes ctTwitchR { 0%, 64%, 100% { transform: rotate(0) }
      68% { transform: rotate(9deg) } 74% { transform: rotate(-2deg) }
      80% { transform: rotate(3deg) } }
    .tail { animation: ctFlick 6.2s ease-in-out infinite alternate;
            transform-box: view-box; transform-origin: 98px 122px }
    @keyframes ctFlick { from { transform: rotate(-6deg) } to { transform: rotate(9deg) } }
    @media (prefers-reduced-motion: reduce) { .earL, .earR, .tail { animation: none } }
  </style>

