<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Trans</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts.
       The flag's stripes mirrored round the picture, so it reads the same
       whichever way you follow it: white at the top and bottom, then pink,
       then blue, on both sides of each. -->
  <style>
    .turn { animation: spin 24s linear infinite; transform-box: view-box; transform-origin: 64px 64px }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .turn { animation: none } }
  </style>
  <defs>
    <!-- Circumference at r=55 is 2πr ≈ 345.6; a tenth of it is 34.6. -->
    <circle id="band" cx="64" cy="64" r="55" fill="none" stroke-width="7"
            stroke-dasharray="34.56 311.02"/>
  </defs>
  <circle cx="64" cy="64" r="51" fill="none" stroke="#14121C" stroke-width="3"/>
  <g class="turn">
    <use href="#band" stroke="#FFFFFF" stroke-dashoffset="-241.90"/>
    <use href="#band" stroke="#F5A9B8" stroke-dashoffset="-276.46"/>
    <use href="#band" stroke="#5BCEFA" stroke-dashoffset="-311.02"/>
    <use href="#band" stroke="#5BCEFA" stroke-dashoffset="-345.58"/>
    <use href="#band" stroke="#F5A9B8" stroke-dashoffset="-380.13"/>
    <use href="#band" stroke="#FFFFFF" stroke-dashoffset="-414.69"/>
    <use href="#band" stroke="#F5A9B8" stroke-dashoffset="-449.25"/>
    <use href="#band" stroke="#5BCEFA" stroke-dashoffset="-483.81"/>
    <use href="#band" stroke="#5BCEFA" stroke-dashoffset="-518.36"/>
    <use href="#band" stroke="#F5A9B8" stroke-dashoffset="-552.92"/>
  </g>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#14121C" stroke-opacity=".35" stroke-width="1"/>
</svg>
