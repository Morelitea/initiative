<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Overgrown</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <style>
    /* Moss does not move. What moves is the light coming through the canopy
       onto it, which is slow enough to notice only if you stay. */
    .dapple { animation: drift 14s ease-in-out infinite }
    @keyframes drift { 0%,100% { opacity:.25 } 50% { opacity:.6 } }
    @media (prefers-reduced-motion: reduce) { .dapple { animation: none } }
  </style>
  <!-- Bark against the picture, then the moss growing over it. -->
  <circle cx="64" cy="64" r="51" fill="none" stroke="#3E2517" stroke-width="3"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#4A7A3A" stroke-width="7"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#6FA34C" stroke-width="7"
          stroke-dasharray="5 11" stroke-linecap="round" opacity=".85"/>
  <circle cx="64" cy="64" r="55" fill="none" stroke="#2F5626" stroke-width="7"
          stroke-dasharray="3 17" stroke-dashoffset="9" stroke-linecap="round"/>
  <circle class="dapple" cx="64" cy="64" r="55" fill="none" stroke="#C8E6A0"
          stroke-width="7" stroke-dasharray="2 30" stroke-linecap="round"/>
  <!-- Twigs, laid across the moss rather than under it. -->
  <g stroke="#5A3A1E" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M96 34 q8 -6 14 -4"/>
    <path d="M101 32 l3 -6"/>
    <path d="M26 88 q-8 7 -14 6"/>
    <path d="M20 92 l-3 6"/>
  </g>
  <!-- Three different mushrooms growing out of it, because a bank of moss
       never grows one thing: a morel, a red cap, and a pair of little brown
       ones. All curves, at the scale a frame gives them. -->
  <g>
    <g transform="translate(64 7)">
      <path d="M-1.6 3 C-2 6 -2 8.4 -1 9.6 C0 10.2 1 10.2 2 9.6 C3 8.4 3 6 2.6 3 Z" fill="#E9DCBE"/>
      <path d="M0.5 -5.5 C4.4 -4.6 6 -1.4 6 1.8 C6 4.8 4.2 7 0.5 7.4 C-3.2 7 -5 4.8 -5 1.8 C-5 -1.4 -3.4 -4.6 0.5 -5.5 Z"
            fill="#8A5A2E"/>
      <g fill="#3B2412" opacity=".85">
        <ellipse cx="0.5" cy="-3.4" rx="1.2" ry=".9"/>
        <ellipse cx="-2" cy="-1.2" rx="1.3" ry="1"/><ellipse cx="3" cy="-1.2" rx="1.3" ry="1"/>
        <ellipse cx="-1.4" cy="1.8" rx="1.3" ry="1.1"/><ellipse cx="2.4" cy="1.8" rx="1.3" ry="1.1"/>
        <ellipse cx="0.5" cy="4.6" rx="1.2" ry="1"/>
      </g>
    </g>
    <g transform="translate(110 86) rotate(52)">
      <path d="M-1.2 2.4 C-1.5 5 -1.5 6.8 -0.7 7.8 C0.1 8.3 0.9 8.3 1.7 7.8 C2.5 6.8 2.5 5 2.2 2.4 Z"
            fill="#F3ECDA"/>
      <path d="M0.5 -4.6 C4.4 -4.6 7.2 -2 7.3 0.8 C7.3 1.6 6.7 2 5.7 2 L-4.7 2 C-5.7 2 -6.3 1.6 -6.3 0.8 C-6.2 -2 -3.4 -4.6 0.5 -4.6 Z"
            fill="#C62F1C"/>
      <g fill="#FBF3E4">
        <ellipse cx="-2.4" cy="-1.4" rx="1" ry=".8"/><ellipse cx="1.8" cy="-2.4" rx="1.1" ry=".85"/>
        <ellipse cx="4.6" cy="-0.2" rx=".9" ry=".7"/>
      </g>
    </g>
    <g transform="translate(19 62) rotate(-68)">
      <path d="M-3.4 -1.4 C-1 -1.4 0.4 -0.2 0.4 0.8 C0.4 1.3 0 1.5 -0.6 1.5 L-6.2 1.5 C-6.8 1.5 -7.2 1.3 -7.2 0.8 C-7.2 -0.2 -5.8 -1.4 -3.4 -1.4 Z"
            fill="#6E4A2A"/>
      <path d="M-4.2 1.5 C-4.4 3.2 -4.4 4.4 -3.9 5.1 L-3.1 5.1 C-2.7 4.4 -2.7 3.2 -2.9 1.5 Z" fill="#D9C9A6"/>
      <path d="M3.4 -0.4 C5.4 -0.4 6.6 0.6 6.6 1.4 C6.6 1.8 6.3 2 5.8 2 L1 2 C0.5 2 0.2 1.8 0.2 1.4 C0.2 0.6 1.4 -0.4 3.4 -0.4 Z"
            fill="#7E5732"/>
      <path d="M2.8 2 C2.6 3.4 2.6 4.4 3 5 L3.7 5 C4.1 4.4 4.1 3.4 3.9 2 Z" fill="#D9C9A6"/>
    </g>
  </g>
</svg>
