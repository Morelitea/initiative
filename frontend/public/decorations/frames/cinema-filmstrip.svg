<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Filmstrip</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts.
       A length of stock bent round until its two ends meet, sprockets out. -->
  <style>
    .run { animation: feed 6s linear infinite; transform-box: view-box;
           transform-origin: 64px 64px }
    @keyframes feed { to { transform: rotate(15deg) } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none } }
  </style>
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="#2A2630" stroke-width="13"/>
  <circle cx="64" cy="64" r="51.4" fill="none" stroke="#14121C" stroke-width="1.4"/>
  <circle cx="64" cy="64" r="63.6" fill="none" stroke="#14121C" stroke-width="1.4"/>
