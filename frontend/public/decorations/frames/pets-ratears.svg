  <g class="rearR"><g transform="translate(128 0) scale(-1 1)">
    <circle cx="30.4" cy="32.6" r="13.6" fill="url(#rtFur)"/>
    <circle cx="31.8" cy="33.8" r="10.2" fill="url(#rtPinna)"/>
    <path d="M23.6 40.6 C26.6 44.4 34.6 44.8 39.2 41.6 C36 45.6 26.4 45.6 23.6 40.6 Z"
