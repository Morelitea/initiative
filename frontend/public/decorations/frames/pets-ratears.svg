    <g fill="none" stroke="#6E5254" stroke-width=".5" opacity=".5">
      <path d="M103 118.4 L103.6 122.6 M110 117.4 L110.4 121.6 M116 114.6 L117.2 118.4
               M120.6 110 L122.6 113 M123.4 104 L126 105.6 M124.2 97.6 L126.6 98
               M122.4 91.6 L124.6 90.6 M118.6 87 L120 85.4"/>
    </g>
  </g>

  <g class="rearL">
    <circle cx="30.4" cy="32.6" r="13.6" fill="url(#rtFur)"/>
    <circle cx="31.8" cy="33.8" r="10.2" fill="url(#rtPinna)"/>
