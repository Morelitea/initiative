<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Rat ears</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <!-- Not a ring: two big round ears set high on the picture, cupped forward,
       with the thin tail coming up the side. They swivel to what they heard. -->
  <defs>
    <radialGradient id="rtFur" cx=".38" cy=".3" r=".8">
      <stop offset="0%" stop-color="#A79A8E"/><stop offset="60%" stop-color="#7E7268"/>
      <stop offset="100%" stop-color="#544B44"/>
    </radialGradient>
    <radialGradient id="rtPinna" cx=".42" cy=".36" r=".75">
      <stop offset="0%" stop-color="#F0BAC0"/><stop offset="70%" stop-color="#D794A0"/>
      <stop offset="100%" stop-color="#A96B78"/>
    </radialGradient>
    <linearGradient id="rtTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C79A9C"/><stop offset="100%" stop-color="#8E6A6C"/>
    </linearGradient>
  </defs>
  <style>
    .rearL { animation: rtTurnL 6.8s ease-in-out infinite;
             transform-box: view-box; transform-origin: 30px 33px }
    .rearR { animation: rtTurnR 8.6s ease-in-out infinite;
             transform-box: view-box; transform-origin: 98px 33px }
    @keyframes rtTurnL { 0%, 70%, 100% { transform: rotate(0) }
      75% { transform: rotate(-7deg) } 82% { transform: rotate(2deg) } }
    @keyframes rtTurnR { 0%, 58%, 100% { transform: rotate(0) }
      63% { transform: rotate(7deg) } 71% { transform: rotate(-2deg) } }
    .rtail { animation: rtCurl 7.4s ease-in-out infinite alternate;
             transform-box: view-box; transform-origin: 97px 121px }
    @keyframes rtCurl { from { transform: rotate(-5deg) } to { transform: rotate(8deg) } }
    @media (prefers-reduced-motion: reduce) { .rearL, .rearR, .rtail { animation: none } }
  </style>

