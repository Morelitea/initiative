<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Spectrum</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <style>
    .turn { animation: spin 24s linear infinite; transform-box: view-box; transform-origin: 64px 64px }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .turn { animation: none } }
  </style>
  <defs>
    <!-- Six arcs of 60°, drawn as one dashed circle per colour so the band
         stays even: circumference at r=55 is 2πr ≈ 345.6, a sixth is 57.6. -->
    <circle id="band" cx="64" cy="64" r="55" fill="none" stroke-width="7"
            stroke-dasharray="57.6 288"/>
  </defs>
  <circle cx="64" cy="64" r="51" fill="none" stroke="#14121C" stroke-width="3"/>
  <g class="turn">
    <use href="#band" stroke="#E40303" stroke-dashoffset="0"/>
    <use href="#band" stroke="#FF8C00" stroke-dashoffset="-57.6"/>
    <use href="#band" stroke="#FFED00" stroke-dashoffset="-115.2"/>
    <use href="#band" stroke="#008026" stroke-dashoffset="-172.8"/>
    <use href="#band" stroke="#004DFF" stroke-dashoffset="-230.4"/>
    <use href="#band" stroke="#750787" stroke-dashoffset="-288"/>
  </g>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#14121C" stroke-opacity=".35" stroke-width="1"/>
</svg>
