<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Five stripes</title>
  <!-- Aperture r=50 at (64,64): see FRAME_APERTURE in lib/profileDecorations.ts. -->
  <!-- The five bands of the disability pride flag — physical, neurodivergence,
       what is not visible, psychiatric, sensory — laid round the picture side
       by side rather than nested, so each one gets the whole width of the
       band. They come round slowly. -->
  <path d="M64 0.6 A63.4 63.4 0 1 0 64 127.4 A63.4 63.4 0 1 0 64 0.6 Z M64 13.4 A50.6 50.6 0 1 1 64 114.6 A50.6 50.6 0 1 1 64 13.4 Z"
        fill="#4A4A4E" fill-rule="evenodd"/>
  <style>
    .wheel { animation: dsTurn 72s linear infinite;
             transform-box: view-box; transform-origin: 64px 64px }
    @keyframes dsTurn { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .wheel { animation: none } }
  </style>
  <g class="wheel" fill="none" stroke-width="12.6" stroke-linecap="butt">
    <path d="M65.19 7.01 A57 57 0 0 1 117.83 45.25" stroke="#CF7280"/><path d="M118.57 47.53 A57 57 0 0 1 98.46 109.40" stroke="#EEDE77"/><path d="M96.53 110.81 A57 57 0 0 1 31.47 110.81" stroke="#E8E8E8"/><path d="M29.54 109.40 A57 57 0 0 1 9.43 47.53" stroke="#7BC2E0"/><path d="M10.17 45.25 A57 57 0 0 1 62.81 7.01" stroke="#3BB07D"/>
  </g>
  <g fill="none" stroke="#2E2E32">
    <circle cx="64" cy="64" r="50.6" stroke-width="2"/>
    <circle cx="64" cy="64" r="63.4" stroke-width="1.6"/>
  </g>
</svg>
