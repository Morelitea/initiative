<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="presentation">
  <title>Vinyl</title>
  <style>
    .disc { animation: spin 6s linear infinite; transform-origin: 64px 64px }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .disc { animation: none } }
  </style>
  <g class="disc">
    <circle cx="64" cy="64" r="62" fill="#14121c"/>
    <!-- Grooves. The gaps in them are what make the spin visible at all. -->
    <g fill="none" stroke="#241f33" stroke-width="1">
      <circle cx="64" cy="64" r="59"/>
      <circle cx="64" cy="64" r="57"/>
      <circle cx="64" cy="64" r="55"/>
    </g>
    <g fill="none" stroke="#2f2942" stroke-width="1" stroke-dasharray="26 10">
      <circle cx="64" cy="64" r="60.5"/>
      <circle cx="64" cy="64" r="56"/>
    </g>
    <!-- The sheen you only see when it turns. -->
    <path d="M64 2 A62 62 0 0 1 126 64 L120 64 A56 56 0 0 0 64 8 Z" fill="#8d7fb8" opacity=".5"/>
    <path d="M64 126 A62 62 0 0 1 2 64 L8 64 A56 56 0 0 0 64 120 Z" fill="#8d7fb8" opacity=".22"/>
    <!-- Label. -->
    <circle cx="64" cy="64" r="54" fill="none" stroke="#f0567a" stroke-width="2"/>
  </g>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#0a0a14" stroke-width="3"/>
</svg>
