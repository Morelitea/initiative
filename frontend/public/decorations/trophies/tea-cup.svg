<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Cup</title>
  <style>
    .steam { animation: curl 5s ease-in-out infinite; transform-box: fill-box;
             transform-origin: 50% 100% }
    .s2 { animation-delay: -1.7s } .s3 { animation-delay: -3.4s }
    @keyframes curl {
      0%   { transform: translate(0,0) scaleX(1); opacity: 0 }
      25%  { opacity: .7 }
      100% { transform: translate(1.5px,-8px) scaleX(1.5); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) { .steam { animation: none; opacity: .4 } }
  </style>
  <defs>
    <linearGradient id="china" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0%" stop-color="#FBF7EE"/><stop offset="55%" stop-color="#E4DCCA"/>
      <stop offset="100%" stop-color="#B4A88E"/>
    </linearGradient>
    <radialGradient id="steep" cx=".4" cy=".3" r=".8">
      <stop offset="0%" stop-color="#C8823A"/><stop offset="100%" stop-color="#7E440F"/>
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#3E3226"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#8A6034" stroke-width="2"/>
  <g fill="none" stroke="#EFE6D0" stroke-width="1.5" stroke-linecap="round">
    <path class="steam" d="M20.4 17.6 C17.6 14.6 22 12 19.6 8.6"/>
    <path class="steam s2" d="M27.6 17.6 C30.4 14.6 26 12 28.4 8.6"/>
    <path class="steam s3" d="M24 16.6 C21.6 13.6 26 11 23.6 7.6"/>
  </g>
  <ellipse cx="24" cy="37.4" rx="15" ry="3.2" fill="#C4B9A4"/>
  <ellipse cx="24" cy="36.6" rx="15" ry="3.2" fill="url(#china)"/>
  <ellipse cx="24" cy="36.6" rx="8" ry="1.6" fill="#CFC5AE"/>
  <path d="M12.6 22.6 C12.6 32.6 16.6 35.4 24 35.4 C31.4 35.4 35.4 32.6 35.4 22.6 Z"
        fill="url(#china)"/>
  <ellipse cx="24" cy="22.6" rx="11.4" ry="3.6" fill="#F6F1E6"/>
  <ellipse cx="24" cy="22.8" rx="9.4" ry="2.8" fill="url(#steep)"/>
  <ellipse cx="21" cy="22" rx="2.6" ry=".9" fill="#E8B071" opacity=".5"/>
  <path d="M35.2 24.6 C39.6 24.6 41.6 26.8 41.6 29 C41.6 31.2 39.6 33.2 36.4 33.2"
