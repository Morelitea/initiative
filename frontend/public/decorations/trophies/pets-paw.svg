<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Paw print</title>
  <!-- Original to this project, drawn 2026-10-07, under the project's AGPL-3.0.
       One main pad and four toes, each its own shape on the disc. -->
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0%" stop-color="#F6CC85"/><stop offset="55%" stop-color="#F0B558"/>
      <stop offset="100%" stop-color="#C98A2E"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#2A1E14"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#E8A33A" stroke-width="2"/>
  <g fill="url(#pad)">
    <!-- The main pad: wide at the heel, with a dip in the middle of it. -->
    <path d="M24 22.4 C27.6 22.4 30.8 25.6 32.6 29 C34.2 32.2 32.6 35.8 29.6 35.8
             C27.6 35.8 26 34.6 24 34.6 C22 34.6 20.4 35.8 18.4 35.8
             C15.4 35.8 13.8 32.2 15.4 29 C17.2 25.6 20.4 22.4 24 22.4 Z"/>
    <!-- Toes: the middle two higher, the outer two lower and leaning out. -->
    <ellipse cx="20.1" cy="15.6" rx="3" ry="4" transform="rotate(-8 20.1 15.6)"/>
    <ellipse cx="27.9" cy="15.6" rx="3" ry="4" transform="rotate(8 27.9 15.6)"/>
    <ellipse cx="13.4" cy="21.2" rx="2.8" ry="3.7" transform="rotate(-28 13.4 21.2)"/>
    <ellipse cx="34.6" cy="21.2" rx="2.8" ry="3.7" transform="rotate(28 34.6 21.2)"/>
  </g>
</svg>
