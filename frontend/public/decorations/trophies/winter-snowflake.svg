      <stop offset="100%" stop-color="#9EC2DC"/>
    </linearGradient>
    <filter id="frost" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#0E1A2E"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#7FA6C4" stroke-width="2"/>
  <circle cx="24" cy="24" r="19" fill="url(#night)"/>

