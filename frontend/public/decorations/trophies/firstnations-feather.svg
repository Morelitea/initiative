      <stop offset="60%" stop-color="#F2E8D6"/><stop offset="100%" stop-color="#D8CBB0"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#1A1410"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#8A6A3C" stroke-width="2"/>
