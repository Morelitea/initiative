      <path d="M24 26.6 L17.6 30"/><path d="M24 29.6 L18.6 33"/><path d="M24 32.6 L20.4 35.6"/>
      <path d="M24 8.6 L28.4 12"/><path d="M24 11.6 L29.6 15"/><path d="M24 14.6 L30.4 18"/>
      <path d="M24 17.6 L31 21"/><path d="M24 20.6 L31.2 24"/><path d="M24 23.6 L31 27"/>
      <path d="M24 26.6 L30.4 30"/><path d="M24 29.6 L29.4 33"/><path d="M24 32.6 L27.6 35.6"/>
