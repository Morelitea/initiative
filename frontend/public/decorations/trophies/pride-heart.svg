<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Pride</title>
  <circle cx="24" cy="24" r="23" fill="#14121C"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#3A2B52" stroke-width="2"/>
  <defs>
    <clipPath id="heart">
      <path d="M24 39 C10 30 7 22 7 18 A8 8 0 0 1 24 14 A8 8 0 0 1 41 18 C41 22 38 30 24 39 Z"/>
    </clipPath>
  </defs>
  <!-- The six stripes, read through the heart. Horizontal bands rather than a
       chevron: at this size the progress flag's stripes would be a pixel each,
       and a flag nobody can resolve is worse than the six everyone knows. The
       banner in this pack carries the full flag. -->
  <g clip-path="url(#heart)">
    <rect x="0" y="10" width="48" height="5" fill="#E40303"/>
    <rect x="0" y="15" width="48" height="5" fill="#FF8C00"/>
    <rect x="0" y="20" width="48" height="5" fill="#FFED00"/>
    <rect x="0" y="25" width="48" height="5" fill="#008026"/>
    <rect x="0" y="30" width="48" height="5" fill="#004DFF"/>
    <rect x="0" y="35" width="48" height="6" fill="#750787"/>
  </g>
  <path d="M24 39 C10 30 7 22 7 18 A8 8 0 0 1 24 14 A8 8 0 0 1 41 18 C41 22 38 30 24 39 Z"
        fill="none" stroke="#14121C" stroke-width="2"/>
</svg>
