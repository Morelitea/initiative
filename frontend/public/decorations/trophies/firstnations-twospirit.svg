<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Two-Spirit</title>
  <!-- Two eagle feathers bound at the quill, hanging point-down and splayed
       apart, over the six colours. -->
  <defs>
    <clipPath id="tsDisc"><circle cx="24" cy="24" r="19"/></clipPath>
    <linearGradient id="vaneT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F0E2"/><stop offset="30%" stop-color="#D8CBB0"/>
      <stop offset="64%" stop-color="#6B5238"/><stop offset="100%" stop-color="#33241A"/>
    </linearGradient>
    <radialGradient id="tsShade" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#000000" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  <g id="tsFeather">
      <path d="M0 18 C2 15.8 3.6 12.8 4.6 9.4 C5.3 6.6 5.5 4.4 5.4 2.4
               C5.2 -2.6 4 -8.6 2 -13.6 C1.4 -15.1 1 -16.1 .7 -16.6
               L-.7 -16.6 C-1 -16.1 -1.4 -15.1 -2 -13.6
               C-4 -8.6 -5.2 -2.6 -5.4 2.4 C-5.5 4.4 -5.3 6.6 -4.6 9.4
               C-3.6 12.8 -2 15.8 0 18 Z" fill="url(#vaneT)" stroke="#2A1D12" stroke-width=".5"
            stroke-opacity=".6"/>
      <g stroke="#1A1410" stroke-width=".42" opacity=".4" fill="none">
        <path d="M0 13.4 L-2.95 10.2"/><path d="M0 13.4 L2.95 10.2"/>
        <path d="M0 10.4 L-3.88 7.2"/><path d="M0 10.4 L3.88 7.2"/>
        <path d="M0 7.4 L-4.35 4.2"/><path d="M0 7.4 L4.35 4.2"/>
        <path d="M0 4.4 L-4.65 1.2"/><path d="M0 4.4 L4.65 1.2"/>
        <path d="M0 1.4 L-4.82 -1.8"/><path d="M0 1.4 L4.82 -1.8"/>
        <path d="M0 -1.6 L-4.72 -4.8"/><path d="M0 -1.6 L4.72 -4.8"/>
        <path d="M0 -4.6 L-4.32 -7.8"/><path d="M0 -4.6 L4.32 -7.8"/>
        <path d="M0 -7.6 L-3.78 -10.8"/><path d="M0 -7.6 L3.78 -10.8"/>
        <path d="M0 -10.6 L-2.88 -13.8"/><path d="M0 -10.6 L2.88 -13.8"/>
      </g>
      <path d="M-.4 17.2 C.3 8 .5 -8 0 -18.6 L-.4 -18.6 C-.9 -8 -.7 8 -.4 17.2 Z"
            fill="#E4D8BE"/>
      <path d="M-1 -16 L1 -16 L1 -19 L-1 -19 Z" fill="#8A6034"/>
    </g>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#1A1410"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#8A6A3C" stroke-width="2"/>
  <g clip-path="url(#tsDisc)">
    <rect x="0" y="0.00" width="48" height="8.02" fill="#E40303"/><rect x="0" y="8.00" width="48" height="8.02" fill="#FF8C00"/><rect x="0" y="16.00" width="48" height="8.02" fill="#FFED00"/><rect x="0" y="24.00" width="48" height="8.02" fill="#008026"/><rect x="0" y="32.00" width="48" height="8.02" fill="#004DFF"/><rect x="0" y="40.00" width="48" height="8.02" fill="#750787"/>
    <circle cx="24" cy="24" r="19" fill="url(#tsShade)"/>
    <g transform="translate(24 12.2) scale(.76)">
      <use href="#tsFeather" transform="translate(-6.528 17.357) rotate(24)"/>
      <use href="#tsFeather" transform="translate(6.528 17.357) rotate(-24)"/>
    </g>
    <g transform="translate(24 12.4)">
      <path d="M-4.4 -1.6 C-2.1 -2.6 2.1 -2.6 4.4 -1.6 L4.4 2.6 C2.1 3.6 -2.1 3.6 -4.4 2.6 Z"
            fill="#B4231F"/>
      <g stroke="#E8B21C" stroke-width=".62" fill="none">
        <path d="M-4.3 -.1 C-2.1 -1 2.1 -1 4.3 -.1"/><path d="M-4.4 1.6 C-2.1 .7 2.1 .7 4.4 1.6"/>
      </g>
    </g>
  </g>
  <circle cx="24" cy="24" r="19" fill="none" stroke="#1A1410" stroke-width="1.4" opacity=".8"/>
</svg>
