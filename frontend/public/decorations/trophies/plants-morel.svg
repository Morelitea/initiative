<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Morel</title>
  <!-- A morel is identified by its surface, not its outline: the honeycomb of
       ridges and pits is the whole tell. Drawn in curves rather than on the
       pixel grid, because a pit is a dent and a dent has no straight edges. -->
  <defs>
    <radialGradient id="cap" cx=".38" cy=".26" r=".85">
      <stop offset="0%" stop-color="#B4834B"/>
      <stop offset="55%" stop-color="#8A5A2E"/>
      <stop offset="100%" stop-color="#5C3A1B"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F1E7CE"/>
      <stop offset="60%" stop-color="#DCCDA8"/>
      <stop offset="100%" stop-color="#B8A47C"/>
    </linearGradient>
    <clipPath id="capClip">
      <path d="M24 4 C31 6 34 13 34 21 C34 28 30 33 24 34 C18 33 14 28 14 21 C14 13 17 6 24 4 Z"/>
    </clipPath>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#16251A"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#2E4A34" stroke-width="2"/>
  <!-- Stem, swelling a little at the base the way a morel's does. -->
  <path d="M20.5 30 C20 34 19.5 38 21 41 C23 42.4 25 42.4 27 41 C28.5 38 28 34 27.5 30 Z"
        fill="url(#stem)"/>
  <path d="M26 30 C26.4 34 26.8 38 26 41 C26.8 41.6 27.4 41.4 27.9 40.6 C28.6 37.6 28.2 33.6 27.6 30 Z"
        fill="#A28E66" opacity=".7"/>
  <!-- Cap. -->
  <path d="M24 4 C31 6 34 13 34 21 C34 28 30 33 24 34 C18 33 14 28 14 21 C14 13 17 6 24 4 Z"
        fill="url(#cap)"/>
  <!-- The pits: soft-edged hollows, offset row to row, following the curve. -->
  <g clip-path="url(#capClip)" fill="#3B2412" opacity=".85">
    <ellipse cx="24" cy="8" rx="2.6" ry="2"/>
    <ellipse cx="19" cy="11.5" rx="2.8" ry="2.2"/><ellipse cx="29" cy="11.5" rx="2.8" ry="2.2"/>
    <ellipse cx="16" cy="16.5" rx="2.8" ry="2.4"/><ellipse cx="24" cy="15" rx="3" ry="2.4"/>
    <ellipse cx="32" cy="16.5" rx="2.8" ry="2.4"/>
    <ellipse cx="18.5" cy="21.5" rx="3" ry="2.5"/><ellipse cx="29.5" cy="21.5" rx="3" ry="2.5"/>
    <ellipse cx="24" cy="25.5" rx="3" ry="2.4"/>
    <ellipse cx="17" cy="27" rx="2.4" ry="2"/><ellipse cx="31" cy="27" rx="2.4" ry="2"/>
    <ellipse cx="24" cy="31" rx="2.4" ry="1.8"/>
  </g>
  <!-- The ridges between them catch the light on the near shoulder. -->
  <g clip-path="url(#capClip)" fill="none" stroke="#D6A76B" stroke-opacity=".45" stroke-width="1.1"
     stroke-linecap="round">
    <path d="M21.5 6 C19.5 12 19 20 20 30"/>
    <path d="M26.5 6 C28.5 12 29 20 28 30"/>
    <path d="M15.5 14 C20 13 28 13 32.5 14"/>
    <path d="M14.5 19 C20 18 28 18 33.5 19"/>
    <path d="M15.5 24 C20 23.4 28 23.4 32.5 24"/>
  </g>
  <path d="M24 4 C31 6 34 13 34 21 C34 28 30 33 24 34 C18 33 14 28 14 21 C14 13 17 6 24 4 Z"
        fill="none" stroke="#4A2E15" stroke-width="1.2"/>
</svg>
