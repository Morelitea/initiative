  <circle cx="24" cy="24" r="23" fill="#1B2036"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#5A628C" stroke-width="2"/>
  <g clip-path="url(#disc)">
  <rect x="0" y="0" width="48" height="48" fill="#FFFFFF"/>
  <g fill="#0D5EAF">
    <rect x="0" y="0" width="48" height="5.4"/><rect x="0" y="10.8" width="48" height="5.4"/>
    <rect x="0" y="21.6" width="48" height="5.4"/><rect x="0" y="32.4" width="48" height="5.4"/>
    <rect x="0" y="43.2" width="48" height="4.8"/>
    <rect x="0" y="0" width="27" height="27"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="10.8" y="0" width="5.4" height="27"/><rect x="0" y="10.8" width="27" height="5.4"/>
  </g>
  </g>
  <circle cx="24" cy="24" r="19" fill="none" stroke="#0E1122" stroke-width="1.4" opacity=".8"/>
