<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Ukraine</title>
  <!-- The flag as a roundel: the design, cut to a circle, on the same disc every
       other trophy sits on. -->
