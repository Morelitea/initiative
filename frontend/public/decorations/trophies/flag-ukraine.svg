  <circle cx="24" cy="24" r="23" fill="#1B2036"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#5A628C" stroke-width="2"/>
  <g clip-path="url(#disc)">
  <rect x="0" y="0" width="48" height="24" fill="#005BBB"/>
  <rect x="0" y="24" width="48" height="24" fill="#FFD500"/>
  </g>
  <circle cx="24" cy="24" r="19" fill="none" stroke="#0E1122" stroke-width="1.4" opacity=".8"/>
  <path d="M12.6 13.6 C15.4 10.8 19.4 9.2 23.4 9" fill="none" stroke="#FFFFFF"
        stroke-width="1.6" opacity=".22" stroke-linecap="round"/>
</svg>
