  <rect width="48" height="48" fill="#A51931"/>  <rect x="0" y="8" width="48" height="32" fill="#F4F5F8"/>  <rect x="0" y="16" width="48" height="16" fill="#2D2A4A"/>
  </g>
  <circle cx="24" cy="24" r="19" fill="none" stroke="#0E1122" stroke-width="1.4" opacity=".8"/>
