<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Raised fist</title>
  <!-- The silhouette everyone knows: knuckles across the top, the thumb laid
       over the fingers, and the forearm straight down out of frame. One shape,
       no interior lines — that is what makes it read at any size. -->
  <defs>
    <linearGradient id="skin" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0%" stop-color="#A9723E"/><stop offset="50%" stop-color="#7E4A22"/>
      <stop offset="100%" stop-color="#4A2A10"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#1E140C"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#E8B21C" stroke-width="2"/>
  <path d="M17.6 15.6 C17.6 13.4 18.9 12.2 20.7 12.2 C22.5 12.2 23.8 13.4 23.8 15.6
           L23.8 17.4 C23.8 15.2 25.1 14 26.9 14 C28.7 14 30 15.2 30 17.4
           L30 18.8 C30 16.8 31.2 15.7 32.9 15.7 C34.7 15.7 35.9 16.9 35.9 19
           L35.9 27.4 C35.9 29.4 35.4 31 34.4 32.2 C33.6 33.2 33.2 34.2 33.2 35.4
           L33.2 45 L15.4 45 L15.4 35.6 C15.4 34.2 15 33.2 14.1 32.2
           C12.9 30.9 12.3 29.2 12.3 27.2 L12.3 23.8 C12.3 22 13.3 20.9 14.9 20.9
           C16.4 20.9 17.4 21.9 17.6 23.6 Z" fill="url(#skin)"/>
  <!-- The thumb, across the front. -->
  <path d="M12.4 24.4 C14.6 23.8 17.6 24.2 19.6 25.4 C21.2 26.4 21.6 28 20.6 29.2
           C19.4 30.6 16.8 31 14.4 30 C13.2 29.5 12.5 28.6 12.4 27.4 Z"
        fill="#9E6A3C"/>
  <path d="M12.4 24.4 C14.6 23.8 17.6 24.2 19.6 25.4" fill="none" stroke="#3E2210"
        stroke-width=".8" opacity=".5"/>
  <!-- The cuff, which is where the arm leaves the picture. -->
  <path d="M14.2 36.6 L34.4 36.6 C35.4 36.6 36 37.2 36 38.2 L36 41
           C36 42 35.4 42.6 34.4 42.6 L14.2 42.6 C13.2 42.6 12.6 42 12.6 41
           L12.6 38.2 C12.6 37.2 13.2 36.6 14.2 36.6 Z" fill="#E8B21C"/>
  <path d="M14.2 36.6 L34.4 36.6 C35.4 36.6 36 37.2 36 38.2 L12.6 38.2
