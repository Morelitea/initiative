<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Raised fist</title>
  <!-- Original to this project, drawn 2026-10-07, under the project's AGPL-3.0.
       A raised fist seen from the front: four curled fingers, the thumb across
       them, the hand and the forearm running off the bottom of the disc. The
       gaps between the fingers read as the dark of the disc. -->
  <defs>
    <clipPath id="fist-disc"><circle cx="24" cy="24" r="20"/></clipPath>
    <linearGradient id="fist-gold" gradientUnits="userSpaceOnUse" x1="18" y1="8" x2="28" y2="44">
      <stop offset="0%" stop-color="#F6D98A"/><stop offset="52%" stop-color="#E8B21C"/>
      <stop offset="100%" stop-color="#B4841A"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#1E140C"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#E8B21C" stroke-width="2"/>
  <g clip-path="url(#fist-disc)" fill="url(#fist-gold)">
    <!-- Forearm, and the back of the hand narrowing into the wrist. -->
    <path d="M16.8 33 L31.2 33 L31.6 48 L16.4 48 Z"/>
    <path d="M12.4 18 L35.4 18 L35.4 27 C35.4 30.6 33.4 33 31.2 34.2 L16.8 34.2
             C14.6 33 12.4 30.6 12.4 27 Z"/>
    <!-- Fingers, index to little finger, curled over; their outline is the
         dark of the disc, which is what separates them. -->
    <g stroke="#1E140C" stroke-width=".8">
      <rect x="12.4" y="12" width="5.6" height="10.4" rx="2.8"/>
      <rect x="18.2" y="10.6" width="5.6" height="11.8" rx="2.8"/>
      <rect x="24" y="11.4" width="5.6" height="11" rx="2.8"/>
      <rect x="29.8" y="13.4" width="5.6" height="9" rx="2.8"/>
      <!-- The thumb, folded across the first two fingers. -->
      <rect x="10.4" y="21" width="16" height="5.6" rx="2.8" transform="rotate(-6 18.4 23.8)"/>
    </g>
  </g>
</svg>
