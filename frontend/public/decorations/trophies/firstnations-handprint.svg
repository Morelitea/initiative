<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Red handprint</title>
  <!-- The mark worn for missing and murdered Indigenous women, girls and
       two-spirit people: an open hand, pressed on and lifted off, with the
       edges paint leaves rather than the ones a pen would. -->
  <circle cx="24" cy="24" r="23" fill="#1A1410"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#B4231F" stroke-width="2"/>
  <g fill="#C4211C">
    <!-- Palm and heel: one shape, wider across the knuckles than the wrist. -->
    <path d="M14.8 24.6 C14.4 21.6 15.4 19.4 17.4 18.4 C19.6 17.4 22.6 17.2 24.6 17.6
             C27.6 18.2 30.4 18.8 32 20.4 C33.4 21.8 33.8 24 33.4 26.8
             C33 30 31.6 33.4 29.4 35.8 C27.6 37.8 25.4 38.8 23.4 38.6
             C21.2 38.4 19 37 17.4 34.6 C15.8 32.2 15 28.4 14.8 24.6 Z"/>
    <!-- Four fingers, each its own length, splayed the way a hand splays. -->
    <path d="M18.8 19.4 C17.8 15.6 17.2 12.4 17.4 10 C17.6 8.4 18.6 7.6 19.8 7.8
             C21 8 21.6 8.9 21.6 10.4 C21.6 12.8 21.6 15.8 21.9 18.6 Z"/>
    <path d="M23 18.2 C22.6 13.8 22.6 10 23 7.4 C23.2 5.8 24.2 5 25.4 5.2
             C26.6 5.4 27.2 6.4 27 8 C26.7 10.6 26.4 14.2 26.2 18.2 Z"/>
    <path d="M27.2 18.6 C28.2 14.4 29.2 11 30.2 8.8 C30.9 7.4 32.1 7 33.1 7.6
             C34.1 8.2 34.4 9.4 33.8 10.8 C32.9 13 31.8 16 31 19.6 Z"/>
    <path d="M31.4 20.4 C33 17.4 34.6 15.2 36 13.8 C37.2 12.6 38.4 12.6 39.2 13.4
             C40 14.2 39.9 15.4 38.9 16.6 C37.6 18.2 36 20.4 34.6 23 Z"/>
    <!-- Thumb, off to the side and lower. -->
    <path d="M15.6 25.6 C12.8 24 10.6 22.4 9.2 20.8 C8.1 19.6 8.2 18.4 9.1 17.6
             C10 16.8 11.2 16.9 12.4 18 C13.9 19.4 15.6 20.8 17.4 22 Z"/>
  </g>
  <!-- Where the paint went thin, and where it pooled. -->
  <g fill="#8E1614" opacity=".45">
    <ellipse cx="24" cy="30.4" rx="5.6" ry="3.4"/>
    <ellipse cx="20" cy="35" rx="2.4" ry="1.6"/>
  </g>
  <g fill="#E05A52" opacity=".3">
    <ellipse cx="19.6" cy="22.6" rx="3" ry="2"/>
    <ellipse cx="25.4" cy="9.6" rx="1.2" ry="2.4"/>
  </g>
  <!-- Spatter, from the press. -->
  <g fill="#C4211C" opacity=".65">
    <circle cx="12.4" cy="30" r=".8"/><circle cx="36" cy="30.6" r=".7"/>
    <circle cx="14" cy="14.6" r=".6"/><circle cx="34.6" cy="34" r=".55"/>
  </g>
</svg>
