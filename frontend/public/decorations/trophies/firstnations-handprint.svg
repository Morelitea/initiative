<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Red handprint</title>
  <!-- The mark worn for missing and murdered Indigenous women, girls and
       two-spirit people. -->
  <circle cx="24" cy="24" r="23" fill="#1A1410"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#B4231F" stroke-width="2"/>
  <g fill="#C4211C">
    <!-- Palm. -->
    <path d="M15.4 26.6 C15.4 22 18.6 19 24 19 C29.4 19 32.6 22 32.6 26.6
             C32.6 31.6 29.6 35.4 24 35.4 C18.4 35.4 15.4 31.6 15.4 26.6 Z"/>
    <!-- Fingers. -->
    <path d="M16.6 21.6 C15.4 18.6 15 15.6 15.6 13 C17.6 13.4 19 15.6 19.6 19.4 Z"/>
    <path d="M20.8 19.4 C20.2 15.6 20.4 12.2 21.4 9.6 C23.4 10.4 24.2 13.4 24 18.6 Z"/>
    <path d="M25.4 18.8 C26 14.8 27 11.6 28.4 9.4 C30.2 10.6 30.4 13.8 29.4 19 Z"/>
    <path d="M30.4 19.8 C31.6 16.4 33 14 34.6 12.6 C35.8 14.2 35.4 17.2 33.4 21.6 Z"/>
    <!-- Thumb. -->
    <path d="M15.6 25.6 C13 24.6 11 23 10 21 C11.6 19.8 14 20.4 17 22.6 Z"/>
  </g>
  <g fill="#8E1614" opacity=".55">
    <path d="M19.4 24.6 C21.6 23.6 26.4 23.6 28.6 24.6 C26.4 25.6 21.6 25.6 19.4 24.6 Z"/>
    <path d="M20.4 29 C22.2 28.2 25.8 28.2 27.6 29 C25.8 29.8 22.2 29.8 20.4 29 Z"/>
  </g>
  <g fill="#E05A52" opacity=".35">
    <ellipse cx="20" cy="23.6" rx="2.2" ry="1.4"/>
  </g>
</svg>
