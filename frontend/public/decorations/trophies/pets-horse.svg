<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="presentation">
  <title>Horse</title>
  <!-- A head in profile: the line down the face, the cheek behind it, and the
       ears up, which is the whole of how a horse is recognised. -->
  <defs>
    <linearGradient id="bay" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0%" stop-color="#A8703C"/><stop offset="55%" stop-color="#7E4A20"/>
      <stop offset="100%" stop-color="#4E2C0E"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="#2E2116"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="#8A6034" stroke-width="2"/>
  <!-- Neck, and the head down off it. -->
  <path d="M34 44 C31.6 36 30.6 28.4 31.6 21.4 C32.4 15.6 30.6 11.6 26.6 9.4
           C23 7.4 19.4 8 17 11 C14.6 14 13.6 18.6 13.4 24.4
           C13.2 29 12.4 32.6 10.6 35.6 C9.4 37.6 9.4 39.4 10.8 40.6
           C12.4 42 14.6 41.6 16.4 39.6 C18.6 37.2 20.4 34.6 21.6 31.6
           C22.6 34.6 23.4 39 23.6 44 Z" fill="url(#bay)"/>
  <!-- The muzzle, and the nostril in it. -->
  <path d="M10.6 35.6 C9.4 37.6 9.4 39.4 10.8 40.6 C12.4 42 14.6 41.6 16.4 39.6
           C15.4 38 14 36.6 12.4 35.8 C11.8 35.5 11.1 35.4 10.6 35.6 Z" fill="#8A5A2E"/>
  <ellipse cx="12.4" cy="38.6" rx="1.5" ry="1.1" fill="#2E2116"
           transform="rotate(-24 12.4 38.6)"/>
  <path d="M10.6 40.6 C12 41.6 13.6 41.4 15 40.4" fill="none" stroke="#2E2116"
        stroke-width=".7" stroke-linecap="round"/>
  <!-- Ears. -->
  <path d="M20.4 9.4 C19 6 18.6 3.6 19.4 2.4 C21 3.4 22.6 5.6 23.6 8.4 Z" fill="url(#bay)"/>
  <path d="M25.4 9 C25.4 5.6 26 3.4 27.2 2.6 C28.2 4.2 28.6 6.6 28.2 9.6 Z" fill="url(#bay)"/>
  <path d="M20.8 8.4 C20 6.4 19.8 4.9 20.2 4.2 C21 5 21.8 6.4 22.4 8 Z" fill="#D8A96A"
        opacity=".45"/>
  <path d="M26 8.6 C26 6.6 26.4 5.2 27 4.6 C27.4 5.6 27.6 7 27.4 8.8 Z" fill="#D8A96A"
        opacity=".45"/>
  <!-- Forelock and mane, falling the way hair falls. -->
  <path d="M19.4 8.6 C21.6 7.6 24.6 7.4 27.4 8.2 C26.4 11 24.6 13 22.4 13.6
           C21 12.4 20 10.6 19.4 8.6 Z" fill="#2E2116"/>
  <path d="M27.6 10.6 C30.6 12.6 32.4 16 32.4 20.4 C32.4 25 31.6 30.6 32.6 36.4
           C33 39 33.4 41.6 34 44 L37.6 44 C36 38 35 31.6 35 25
           C35 18 32.6 13 27.6 10.6 Z" fill="#2E2116"/>
  <!-- Eye. -->
  <ellipse cx="20.6" cy="17.6" rx="2.1" ry="1.7" fill="#1A1410"
           transform="rotate(-14 20.6 17.6)"/>
  <circle cx="21.2" cy="17" r=".6" fill="#F2E8D6" opacity=".8"/>
  <path d="M18.4 15.6 C19.4 14.8 20.8 14.8 21.8 15.4" fill="none" stroke="#3E2A16"
        stroke-width=".7" stroke-linecap="round"/>
  <!-- The blaze down the face. -->
  <path d="M16.6 13.6 C15.4 18.6 14.6 24.6 14.4 30.6 C14.4 32.6 14 34.4 13.4 35.8
           C12.9 34.4 12.6 32.6 12.8 30.4 C13 24.4 14 18.4 15.4 13.4 Z" fill="#E4DCCA"
        opacity=".85"/>
  <!-- The cheek, catching the light. -->
  <path d="M24.6 20 C27 21.4 28.4 24 28.4 27.4 C28.4 30 27.4 32.4 25.6 34
           C25 30 24.6 25.4 24.6 20 Z" fill="#B47C46" opacity=".35"/>
</svg>
