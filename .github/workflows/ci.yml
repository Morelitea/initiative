name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    # Skip app CI on docs-only pushes (the Documentation workflow handles those).
    # Left on pull_request so required checks still run for PRs.
    paths-ignore:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: initiative
          POSTGRES_PASSWORD: initiative
          POSTGRES_DB: initiative_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U initiative"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Provisioner/migrations: DIRECT to Postgres (never pooled, like prod),
      # as app_provisioner — the same least-privilege role a deployment runs
      # migrations and guild provisioning with. Created by the bootstrap step
      # below, mirroring the compose initdb config. POSTGRES_USER stays the
      # cluster superuser, which conftest.py uses as test infrastructure
      # (CREATE DATABASE per worker, raw writes on FORCE-RLS tables).
      DATABASE_URL: postgresql+asyncpg://app_provisioner:app_provisioner@localhost:5432/initiative_test
      # Request + system engines: through PgBouncer in TRANSACTION mode
      # (started as a step below). The pooler environment is strictly harder
      # than direct Postgres, so one suite run proves both — and any
      # reintroduction of session-level SET ROLE/GUC state fails here before
      # merge (#784). Config: backend/scripts/ci/pgbouncer.ini.
      DATABASE_URL_APP: postgresql+asyncpg://app_user:app_user@localhost:6432/initiative_test
      DATABASE_URL_ADMIN: postgresql+asyncpg://app_admin:app_admin@localhost:6432/initiative_test
      # Fixed test-only key (64 hex chars). Not a secret: CI databases are ephemeral.
      SECRET_KEY: 3b9c63094f48ae5b21e23a9d6d34a8e6f1f1f24cb0a44c84a25e36c9d4a7f1d2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for backend changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DIFF="git diff --name-only origin/${{ github.base_ref }}...HEAD"
          else
            DIFF="git diff --name-only HEAD~1...HEAD"
          fi

          # This workflow file is in scope for itself: it defines the roles,
          # URLs and services the backend job runs against, so a change to it
          # has to run the job — in full, migrations included — to be worth
          # anything. Scope selection below reads backend/ paths, which a
          # workflow-only change has none of, so short-circuit here.
          if [[ -n "$($DIFF -- .github/workflows/ci.yml || true)" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "alembic_changed=true" >> $GITHUB_OUTPUT
            echo "scope=app/ alembic/" >> $GITHUB_OUTPUT
            echo "CI workflow changed — running the full backend job"
            exit 0
          fi

          CHANGED=$($DIFF -- backend/ || true)

          if [[ -z "$CHANGED" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No backend changes — skipping"
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          # Migration tests are slow (real upgrade/downgrade against
          # Postgres) and only relevant when the alembic/ folder itself
          # changes. Track them as a separate scope token so they're only
          # appended when needed. Also expose a flag so we can skip the
          # explicit `alembic upgrade head` step on non-alembic PRs —
          # conftest.py already runs migrations as a pytest fixture, so
          # the only value of the standalone step is an early failure
          # signal when a migration is broken.
          ALEMBIC_SCOPE=""
          if echo "$CHANGED" | grep -q '^backend/alembic/'; then
            ALEMBIC_SCOPE="alembic/"
            echo "alembic_changed=true" >> $GITHUB_OUTPUT
            echo "Alembic changes detected — including migration tests"
          else
            echo "alembic_changed=false" >> $GITHUB_OUTPUT
          fi

          NON_ALEMBIC=$(echo "$CHANGED" | grep -v '^backend/alembic/' || true)

          if [[ -z "$NON_ALEMBIC" ]]; then
            # Only alembic/ changes — skip the app/ test pass entirely.
            echo "scope=$ALEMBIC_SCOPE" >> $GITHUB_OUTPUT
            echo "Only alembic changes — running migration tests only"
            exit 0
          fi

          # Check if shared infra changed (requires full test run)
          if echo "$NON_ALEMBIC" | grep -qE '(app/testing/|app/models/|app/schemas/|app/core/|app/db/|conftest\.py)'; then
            echo "scope=app/ $ALEMBIC_SCOPE" >> $GITHUB_OUTPUT
            echo "Shared infrastructure changed — running all tests"
          else
            # Extract unique directories, strip backend/ prefix, and exclude non-code dirs.
            # Catalog data files carry no tests of their own — the marketplace
            # service seeds and validates them, so its suite is the one to run.
            DIRS=$(echo "$NON_ALEMBIC" | sed 's|^backend/||' | grep -v '^app/locales/' | xargs -I{} dirname {} | sed 's|^app/marketplace_catalog$|app/services/marketplace|' | sort -u | tr '\n' ' ')
            if [[ -z "${DIRS// }" ]]; then
              echo "scope=app/ $ALEMBIC_SCOPE" >> $GITHUB_OUTPUT
              echo "Only non-code files changed — running all tests"
            else
              echo "scope=$DIRS$ALEMBIC_SCOPE" >> $GITHUB_OUTPUT
              echo "Running tests in: $DIRS$ALEMBIC_SCOPE"
            fi
          fi

      - name: Bootstrap database roles
        # The three login roles a deployment has, created here the way the
        # compose initdb config creates them on a fresh install: the superuser
        # makes them, then hands the app's schema to app_provisioner. The
        # login roles must exist before the provisioner-run baseline, which
        # only syncs their passwords — Postgres 16+ reserves creating a
        # BYPASSRLS role (app_admin) for BYPASSRLS holders, and
        # app_provisioner is NOBYPASSRLS by design.
        # psql comes from the same pinned image as the service, rather than
        # whatever client the runner image happens to ship (the PgBouncer step
        # below runs its container the same way).
        if: steps.changes.outputs.skip != 'true'
        run: |
          docker run --rm -i --network host -e PGPASSWORD=initiative postgres:17 \
            psql -v ON_ERROR_STOP=1 -h localhost -U initiative -d initiative_test <<'SQL'
          CREATE ROLE app_provisioner WITH LOGIN CREATEROLE NOSUPERUSER NOBYPASSRLS
            PASSWORD 'app_provisioner';
          CREATE ROLE app_user WITH LOGIN NOINHERIT PASSWORD 'app_user';
          CREATE ROLE app_admin WITH LOGIN BYPASSRLS PASSWORD 'app_admin';
          GRANT CREATE, CONNECT ON DATABASE initiative_test TO app_provisioner;
          -- Postgres 15+ made CREATE on public owner-only, and the baseline
          -- (running as app_provisioner) builds the shared schema there.
          ALTER SCHEMA public OWNER TO app_provisioner;
          -- Lets the provisioner sync the login roles' passwords.
          GRANT app_user TO app_provisioner WITH ADMIN OPTION;
          GRANT app_admin TO app_provisioner WITH ADMIN OPTION;
          SQL

      - name: Install uv
        if: steps.changes.outputs.skip != 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        if: steps.changes.outputs.skip != 'true'
        run: |
          cd backend
          uv sync --frozen

      - name: Run Alembic migrations
        # conftest.py auto-applies migrations before tests run, so this
        # explicit step is only valuable as an early-fail signal on PRs
        # that actually touch alembic/.
        if: steps.changes.outputs.skip != 'true' && steps.changes.outputs.alembic_changed == 'true'
        run: |
          cd backend
          uv run alembic upgrade head
          
          
      - name: Lint with Ruff
        if: steps.changes.outputs.skip != 'true'
        run: |
          cd backend
          uv run ruff check app

      - name: Check formatting with Ruff
        if: steps.changes.outputs.skip != 'true'
        run: |
          cd backend
          uv run ruff format --check app

      - name: Type-check with ty
        # Full default rule set; the only exclusions are the SQLModel/ORM
        # false-positive rules disabled in backend/pyproject.toml
        # ([tool.ty.rules]), which is the single source of truth for the gate.
        if: steps.changes.outputs.skip != 'true'
        run: |
          cd backend
          uv run ty check app


      - name: Start PgBouncer (transaction mode)
        # Runs as a step (not a service) so the committed reference config is
        # available post-checkout. edoburu/pgbouncer is pinned; PgBouncer
        # >= 1.21 is required for max_prepared_statements (asyncpg keeps its
        # normal prepared-statement cache — there is no app-side pooler mode).
        if: steps.changes.outputs.skip != 'true'
        run: |
          printf '"app_user" "app_user"\n"app_admin" "app_admin"\n' > /tmp/pgb-userlist.txt
          docker run -d --name ci-pgbouncer --network host \
            -v "$GITHUB_WORKSPACE/backend/scripts/ci/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
            -v /tmp/pgb-userlist.txt:/etc/pgbouncer/userlist.txt:ro \
            edoburu/pgbouncer:v1.24.1-p1
          timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/6432) 2>/dev/null; do sleep 1; done'
          echo "PgBouncer up on :6432 (transaction mode)"

      - name: Run tests (through the pooler)
        if: steps.changes.outputs.skip != 'true'
        run: |
          cd backend
          uv run python -m pytest ${{ steps.changes.outputs.scope }} -n auto --tb=short

  frontend-lint-and-test:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for frontend changes
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- frontend/ || true)
          else
            CHANGED=$(git diff --name-only HEAD~1...HEAD -- frontend/ || true)
          fi
          if [[ -z "$CHANGED" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No frontend changes — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Frontend changes detected"
          fi

      - name: Set up Node.js
        if: steps.filter.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pnpm
        if: steps.filter.outputs.skip != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Lint
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd frontend
          pnpm lint

      - name: TypeScript Check
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd frontend
          pnpm typecheck

      - name: Run tests
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd frontend
          pnpm test:run

  check-generated-types:
    name: Check Generated Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for backend or orval changes
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- backend/ frontend/orval.config.ts frontend/src/api/mutator.ts frontend/package.json || true)
          else
            CHANGED=$(git diff --name-only HEAD~1...HEAD -- backend/ frontend/orval.config.ts frontend/src/api/mutator.ts frontend/package.json || true)
          fi
          if [[ -z "$CHANGED" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No backend or codegen config changes — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Backend or codegen config changes detected"
          fi

      - name: Install uv
        if: steps.filter.outputs.skip != 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd backend
          uv sync --frozen --no-dev

      - name: Export OpenAPI spec
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd backend
          uv run python scripts/export_openapi.py ../frontend/openapi.json

      - name: Set up Node.js
        if: steps.filter.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pnpm
        if: steps.filter.outputs.skip != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Install frontend dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Regenerate types
        if: steps.filter.outputs.skip != 'true'
        run: |
          cd frontend
          pnpm orval
          pnpm format:api

      - name: Check for drift
        if: steps.filter.outputs.skip != 'true'
        run: |
          if ! git diff --exit-code frontend/src/api/generated/; then
            echo ""
            echo "ERROR: Generated types are out of date!"
            echo "Run 'pnpm generate:api' in the frontend directory and commit the results."
            echo ""
            exit 1
          fi
          echo "Generated types are up to date."
