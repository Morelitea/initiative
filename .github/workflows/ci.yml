name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    # Skip app CI on docs-only pushes (the Documentation workflow handles those).
    # Left on pull_request so required checks still run for PRs.
    paths-ignore:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# A new push to a pull request replaces its run. A push to main or dev never
# cancels one in progress: it waits, and a later push takes its place in the
# queue, so the branch is always tested in order.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      backend_scope: ${{ steps.diff.outputs.backend_scope }}
      alembic: ${{ steps.diff.outputs.alembic }}
      seam: ${{ steps.diff.outputs.seam }}
      upgrade: ${{ steps.diff.outputs.upgrade }}
      frontend: ${{ steps.diff.outputs.frontend }}
      codegen: ${{ steps.diff.outputs.codegen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request diffs against its base branch. A push diffs against
          # where the branch stood before it, so every commit of a multi-commit
          # push counts; with no usable `before` (a new branch, a force-push)
          # every path counts as changed.
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE=""
          fi
          changed() {
            if [[ -z "$BASE" ]]; then
              echo "(no diff base)"
            else
              git diff --name-only "$BASE...HEAD" -- "$@" || true
            fi
          }
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          backend() {
            # Integration-branch pushes are the authoritative whole-tree
            # signal. Pull requests may use scoped feedback, but a push to main
            # or dev must never report green after skipping the caller's tests.
            if [[ "$EVENT" != "pull_request" ]]; then
              out backend true; out alembic true; out backend_scope "app/ alembic/"
              echo "Integration push — running the full backend suite"
              return
            fi

            # This workflow file is in scope for itself: it defines the roles,
            # URLs and services the backend job runs against, so a change to it
            # has to run the job — in full, migrations included — to be worth
            # anything. Scope selection below reads backend/ paths, which a
            # workflow-only change has none of, so short-circuit here.
            if [[ -n "$(changed .github/workflows/ci.yml .github/actions/setup-backend/)" ]]; then
              out backend true; out alembic true; out backend_scope "app/ alembic/"
              echo "CI workflow changed — running the full backend job"
              return
            fi

            local CHANGED
            CHANGED=$(changed backend/)
            if [[ -z "$CHANGED" ]]; then
              out backend false
              echo "No backend changes — skipping"
              return
            fi
            out backend true

            # Migration tests are slow (real upgrade/downgrade against
            # Postgres) and only relevant when the alembic/ folder itself
            # changes. Track them as a separate scope token so they're only
            # appended when needed. Also expose a flag so we can skip the
            # explicit `alembic upgrade head` step on non-alembic PRs —
            # conftest.py already runs migrations as a pytest fixture, so
            # the only value of the standalone step is an early failure
            # signal when a migration is broken.
            local ALEMBIC_SCOPE=""
            if echo "$CHANGED" | grep -q '^backend/alembic/'; then
              ALEMBIC_SCOPE="alembic/"
              out alembic true
              echo "Alembic changes detected — including migration tests"
            else
              out alembic false
            fi

            local NON_ALEMBIC
            NON_ALEMBIC=$(echo "$CHANGED" | grep -v '^backend/alembic/' || true)

            if [[ -z "$NON_ALEMBIC" ]]; then
              # Only alembic/ changes — skip the app/ test pass entirely.
              out backend_scope "$ALEMBIC_SCOPE"
              echo "Only alembic changes — running migration tests only"
              return
            fi

            # Check if shared infra changed (requires full test run)
            if echo "$NON_ALEMBIC" | grep -qE '(app/testing/|app/models/|app/schemas/|app/core/|app/db/|conftest\.py)'; then
              out backend_scope "app/ $ALEMBIC_SCOPE"
              echo "Shared infrastructure changed — running all tests"
            else
              # Extract unique directories, strip backend/ prefix, and exclude non-code dirs.
              # Catalog data files carry no tests of their own — the marketplace
              # service seeds and validates them, so its suite is the one to run.
              local DIRS
              DIRS=$(echo "$NON_ALEMBIC" | sed 's|^backend/||' | grep -v '^app/locales/' | xargs -I{} dirname {} | sed 's|^app/marketplace_catalog$|app/services/marketplace|' | sort -u | tr '\n' ' ')
              if [[ -z "${DIRS// }" ]]; then
                out backend_scope "app/ $ALEMBIC_SCOPE"
                echo "Only non-code files changed — running all tests"
              else
                out backend_scope "$DIRS$ALEMBIC_SCOPE"
                echo "Running tests in: $DIRS$ALEMBIC_SCOPE"
              fi
            fi
          }

          frontend() {
            # Pushes to the integration branches are whole-tree verification;
            # only pull requests use the changed-file shortcut.
            if [[ "$EVENT" != "pull_request" ]]; then
              out frontend true
              echo "Integration push — running the full frontend suite"
            elif [[ -n "$(changed frontend/ .github/actions/setup-frontend/)" ]]; then
              out frontend true
              echo "Frontend changes detected"
            else
              out frontend false
              echo "No frontend changes — skipping"
            fi
          }

          codegen() {
            if [[ -n "$(changed backend/ frontend/orval.config.ts frontend/src/api/mutator.ts frontend/package.json \
                frontend/scripts/generate-api.sh scripts/build_env_contract.py env-contract.json .github/actions/)" ]]; then
              out codegen true
              echo "Backend or codegen config changes detected"
            else
              out codegen false
              echo "No backend or codegen config changes — skipping"
            fi
          }

          # The request-context conformance suite (pytest marker ``seam``) is
          # slow, so it runs where it pays for itself: every integration push,
          # and a pull request that touches the seam.
          seam() {
            if [[ "$EVENT" != "pull_request" ]] || [[ -n "$(changed .github/workflows/ci.yml \
                backend/app/db/ backend/app/api/deps.py backend/app/api/content_socket.py \
                backend/app/services/content_sockets.py backend/app/testing/ \
                backend/app/models/ backend/alembic/ backend/conftest.py \
                backend/app/api/v1/tenant_endpoints/{queues,counters,events,collaboration}.py \
                backend/app/api/v1/platform_endpoints/notifications.py)" ]]; then
              out seam true
              echo "Seam changed — running the conformance suite"
            else
              out seam false
            fi
          }

          # Upgrading a database a release wrote. A pull request into dev
          # upgrades from the newest release; a release pull request and every
          # integration push walk each release since WALK_FROM in turn.
          upgrade() {
            if [[ "$EVENT" != "pull_request" || "$BASE_REF" == "main" ]]; then
              out upgrade walk
              echo "Integration push or release — walking every release"
            elif [[ -n "$(changed .github/workflows/ci.yml .github/actions/setup-backend/ \
                backend/alembic/ \
                backend/app/db/ backend/app/models/ backend/app/core/ \
                backend/app/testing/ backend/scripts/upgrade_seed.py \
                backend/scripts/upgrade_from_release.py backend/pyproject.toml \
                backend/uv.lock scripts/seed/ scripts/seed_dev_data.py)" ]]; then
              out upgrade hop
              echo "Schema or boot changed — upgrading from the newest release"
            else
              out upgrade false
            fi
          }

          backend
          seam
          upgrade
          frontend
          codegen

          {
            echo "### What this run checks"
            echo
            echo "| Area | Decision |"
            echo "|---|---|"
            # shellcheck disable=SC2016 # literal backticks: Markdown code
            sed -E 's/^([^=]+)=(.*)$/| \1 | `\2` |/' "$GITHUB_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    name: Backend Lint & Tests
    needs: changes
    # A failed change detection leaves the outputs empty, which runs the job.
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: initiative
          POSTGRES_PASSWORD: initiative
          POSTGRES_DB: initiative_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U initiative -d initiative_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Provisioner/migrations: DIRECT to Postgres (never pooled, like prod),
      # as app_provisioner — the same least-privilege role a deployment runs
      # migrations and guild provisioning with. Created by the bootstrap step
      # below, which runs the app's own bootstrap module. POSTGRES_USER stays the
      # cluster superuser, which conftest.py uses as test infrastructure
      # (CREATE DATABASE per worker, raw writes on FORCE-RLS tables).
      DATABASE_URL: postgresql+asyncpg://app_provisioner:app_provisioner@localhost:5432/initiative_test
      # Request + system engines: through PgBouncer in TRANSACTION mode
      # (started as a step below). The pooler environment is strictly harder
      # than direct Postgres, so one suite run proves both — and any
      # reintroduction of session-level SET ROLE/GUC state fails here before
      # merge (#784). Config: backend/scripts/ci/pgbouncer.ini.
      DATABASE_URL_APP: postgresql+asyncpg://app_user:app_user@localhost:6432/initiative_test
      DATABASE_URL_ADMIN: postgresql+asyncpg://app_admin:app_admin@localhost:6432/initiative_test
      # Fixed test-only key (64 hex chars). Not a secret: CI databases are ephemeral.
      SECRET_KEY: 3b9c63094f48ae5b21e23a9d6d34a8e6f1f1f24cb0a44c84a25e36c9d4a7f1d2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-backend

      - name: Frozen migrations are unchanged, one Alembic head
        # scripts/ci/check runs the same checks locally (and before a push).
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: scripts/ci/check migrations

      - name: Bootstrap database roles
        # The same module a deployment runs at startup, over the same kind of
        # owner connection: it creates the three login roles, hands the app's
        # schema to app_provisioner, and installs the guild-search match
        # operator. Runs after dependency install because it is app code, and
        # before the migrations below, which connect as app_provisioner.
        env:
          DATABASE_URL_BOOTSTRAP: postgresql+asyncpg://initiative:initiative@localhost:5432/initiative_test
        run: |
          cd backend
          uv run python -m app.db.bootstrap

      - name: Run Alembic migrations
        # conftest.py auto-applies migrations before tests run, so this
        # explicit step is only valuable as an early-fail signal on PRs
        # that actually touch alembic/.
        if: needs.changes.outputs.alembic != 'false'
        run: |
          cd backend
          uv run alembic upgrade head

      - name: Lint with Ruff
        run: scripts/ci/check ruff

      - name: Check formatting with Ruff
        run: scripts/ci/check format

      - name: Type-check with ty
        # Full default rule set; the only exclusions are the SQLModel/ORM
        # false-positive rules disabled in backend/pyproject.toml
        # ([tool.ty.rules]), which is the single source of truth for the gate.
        run: scripts/ci/check ty

      - name: Start PgBouncer (transaction mode)
        # Runs as a step (not a service) so the committed reference config is
        # available post-checkout. edoburu/pgbouncer is pinned; PgBouncer
        # >= 1.21 is required for max_prepared_statements (asyncpg keeps its
        # normal prepared-statement cache — there is no app-side pooler mode).
        run: |
          printf '"app_user" "app_user"\n"app_admin" "app_admin"\n' > /tmp/pgb-userlist.txt
          docker run -d --name ci-pgbouncer --network host \
            -v "$GITHUB_WORKSPACE/backend/scripts/ci/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
            -v /tmp/pgb-userlist.txt:/etc/pgbouncer/userlist.txt:ro \
            edoburu/pgbouncer:v1.24.1-p1
          timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/6432) 2>/dev/null; do sleep 1; done'
          echo "PgBouncer up on :6432 (transaction mode)"

      - name: Run tests (through the pooler)
        env:
          BACKEND_SCOPE: ${{ needs.changes.outputs.backend_scope || 'app/ alembic/' }}
        run: |
          cd backend
          set -o pipefail
          # Unquoted: the scope is a space-separated list of test paths.
          uv run python -m pytest $BACKEND_SCOPE -n auto --tb=short --durations=15 \
            | tee "$RUNNER_TEMP/pytest.log"

      - name: Prove the request-context seam
        if: needs.changes.outputs.seam == 'true'
        run: |
          cd backend
          set -o pipefail
          uv run python -m pytest -m seam app/db/seam_conformance_test.py -n 2 --tb=short \
            | tee "$RUNNER_TEMP/pytest-seam.log"

      - name: Summarise the test run
        # The result, failures grouped by worker, and the slowest tests, on the
        # run's summary page.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci/pytest_summary.py "$RUNNER_TEMP/pytest.log" "Backend tests" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/pytest_summary.py "$RUNNER_TEMP/pytest-seam.log" "Request-context seam" >> "$GITHUB_STEP_SUMMARY"

  upgrade-from-release:
    name: Upgrade From Release
    needs: changes
    # A failed change detection leaves the outputs empty, which runs the job.
    if: ${{ !cancelled() && needs.changes.outputs.upgrade != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Two servers, because roles are cluster-wide: the release's database and
    # a fresh install of this tree, compared once both are built.
    services:
      upgraded:
        image: postgres:17
        env:
          POSTGRES_USER: initiative
          POSTGRES_PASSWORD: initiative
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U initiative"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      fresh:
        image: postgres:17
        env:
          POSTGRES_USER: initiative
          POSTGRES_PASSWORD: initiative
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U initiative"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Fixed test-only key (64 hex chars). Not a secret: CI databases are ephemeral.
      SECRET_KEY: 3b9c63094f48ae5b21e23a9d6d34a8e6f1f1f24cb0a44c84a25e36c9d4a7f1d2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every release tag, which the check checks out and boots.
          fetch-depth: 0

      - uses: ./.github/actions/setup-backend

      - name: Upgrade a release's database to this tree
        env:
          MODE: ${{ needs.changes.outputs.upgrade }}
        run: |
          cd backend
          uv run python scripts/upgrade_from_release.py \
            $([[ "$MODE" == "walk" ]] && echo --walk) \
            --server postgresql://initiative:initiative@localhost:5432 \
            --fresh-server postgresql://initiative:initiative@localhost:5433

      - name: The dev seed fills a fresh install
        # The fresh install the step above built, with a first owner for the
        # seed to sign its data with.
        env:
          DATABASE_URL: postgresql+asyncpg://app_provisioner:app_provisioner@localhost:5433/initiative
          DATABASE_URL_APP: postgresql+asyncpg://app_user:app_user@localhost:5433/initiative
          DATABASE_URL_ADMIN: postgresql+asyncpg://app_admin:app_admin@localhost:5433/initiative
          DATABASE_URL_BOOTSTRAP: postgresql+asyncpg://initiative:initiative@localhost:5433/initiative
          FIRST_OWNER_EMAIL: admin@example.com
          FIRST_OWNER_PASSWORD: changeme
        run: |
          cd backend
          uv run python -m app.db.init_db
          uv run python ../scripts/seed_dev_data.py

  frontend-lint-and-test:
    name: Frontend Lint & Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Lint
        run: scripts/ci/check biome

      - name: TypeScript Check
        run: scripts/ci/check tsc

      - name: Run tests
        run: |
          cd frontend
          pnpm test:run

  check-generated-types:
    name: Check Generated Types
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.codegen != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-backend
        with:
          dev: "false"

      - uses: ./.github/actions/setup-frontend

      - name: Check env-contract.json and the generated API client
        run: scripts/ci/check codegen

  git-hooks:
    name: Git Hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the git identity guard
        run: ./scripts/git-identity-guard_test.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install workflow check dependencies
        run: pip install "pyyaml==6.0.3"

      - name: Test the Android signing workflow
        run: python3 scripts/ci/android_signing_workflow_test.py

      - name: Test the test-run summary
        run: python3 scripts/ci/pytest_summary_test.py

  dev-image:
    name: Dev Image
    needs:
      - changes
      - backend-tests
      - upgrade-from-release
      - frontend-lint-and-test
      - check-generated-types
      - git-hooks
    # Publishes :dev from a push to dev once every check above has passed on
    # it (a check that had nothing to test is skipped, which counts as a pass).
    # To build one without waiting, run Dev Build by hand.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') }}
    uses: ./.github/workflows/dev-build.yml
    # inherit, not a list: the build's environment secrets (OTA_SIGNING_KEY)
    # read as empty without it.
    secrets: inherit
