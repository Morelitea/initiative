name: Dev Build

on:
  push:
    branches:
      - dev
    # Skip the dev image build on docs-only pushes.
    paths-ignore:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  sha:
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  docker:
    needs: sha
    uses: ./.github/workflows/docker-image.yml
    with:
      name: dev
      build-args: |
        VITE_VERSION_SUFFIX=-dev-${{ needs.sha.outputs.short }}
      # dev-<sha> first: it is the tag the merge job inspects.
      tags: |
        type=raw,value=dev-${{ needs.sha.outputs.short }}
        type=raw,value=dev
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
