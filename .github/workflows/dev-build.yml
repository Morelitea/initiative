name: Dev Build

on:
  # A push to dev reaches this from CI, once every check has passed on it.
  workflow_call:
  # By hand from dev at any time, without waiting for CI. The ota-dev
  # environment that signs the image is open to the dev branch only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      short: ${{ steps.sha.outputs.short }}
      ota-dev-key: ${{ steps.sha.outputs.ota-dev-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get short SHA
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ota-dev-key=$(tr -d '[:space:]' < .github/ota-dev-key.pub)" >> $GITHUB_OUTPUT

  docker:
    needs: sha
    # One build publishes :dev at a time, so a manual run and CI's cannot
    # finish out of order.
    concurrency:
      group: dev-image
      cancel-in-progress: false
    uses: ./.github/workflows/docker-image.yml
    with:
      name: dev
      # Signed with the dev key, which only the dev app trusts.
      signing-environment: ota-dev
      build-args: |
        VITE_VERSION_SUFFIX=-dev-${{ needs.sha.outputs.short }}
        VITE_OTA_DEV_KEY=${{ needs.sha.outputs.ota-dev-key }}
      # dev-<sha> first: it is the tag the merge job inspects.
      tags: |
        type=raw,value=dev-${{ needs.sha.outputs.short }}
        type=raw,value=dev
    # inherit, not a list: the called job's environment secrets
    # (OTA_SIGNING_KEY) read as empty without it.
    secrets: inherit
