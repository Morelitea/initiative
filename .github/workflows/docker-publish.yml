name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.30.0) — sets Docker semver tags'
        required: false
        default: ''

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/initiative

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_android: ${{ steps.decide.outputs.build_android }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            echo "Version from input: $VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Version from tag: $VERSION"
          else
            VERSION=$(cat VERSION)
            echo "Version from file: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Decide whether to build the native app
        id: decide
        run: |
          # The Android/iOS app only needs rebuilding when the native shell changed — which
          # promote.sh records by moving MIN_NATIVE_VERSION forward. Compare this ref's value
          # against the previous release tag; web-only releases reuse the existing APK and
          # update over the air. The committed file is the single source of truth, so both the
          # workflow_dispatch and manual tag-push paths behave identically.
          cur=$(cat MIN_NATIVE_VERSION 2>/dev/null || echo "")
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            old=$(git show "$prev:MIN_NATIVE_VERSION" 2>/dev/null || echo "")
          else
            old=""
          fi
          if [ -z "$old" ] || [ "$old" != "$cur" ]; then
            echo "build_android=true" >> "$GITHUB_OUTPUT"
            echo "Native min-version changed ('$old' -> '$cur') or no prior value — building the app."
          else
            echo "build_android=false" >> "$GITHUB_OUTPUT"
            echo "Native min-version unchanged ('$cur') — web-only release, skipping the app build."
          fi

  build-android:
    needs: decide
    if: ${{ needs.decide.outputs.build_android == 'true' }}
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      # A tag build publishes to the release, so it has to sign. Checked before
      # the toolchain is installed so the job ends in seconds.
      - name: Require signing on release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true' }}
        run: |
          echo "::error::This is a release tag, but no signing keystore reached the job."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-frontend

      - name: Build frontend for Capacitor
        working-directory: frontend
        run: pnpm build:capacitor

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default package list still includes the obsolete `tools`
          # package, which Google has removed from the SDK repository — sdkmanager
          # exits non-zero on it. Gradle fetches the platform/build-tools it needs.
          packages: platform-tools

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Stage the signing keystore outside the workspace
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d \
            > "$RUNNER_TEMP/signing/release.jks"

      # Signing values reach Gradle as project properties named after the ones
      # app/build.gradle reads. Every name is a POSIX identifier, which is what
      # the /bin/sh gradle wrapper forwards to the build JVM.
      - name: Build signed APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: frontend/android
        env:
          ORG_GRADLE_PROJECT_initiativeSigningStoreFile: ${{ runner.temp }}/signing/release.jks
          ORG_GRADLE_PROJECT_initiativeSigningStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_initiativeSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_initiativeSigningKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build unsigned APK (fallback)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      - name: Verify the APK signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          release_dir=frontend/android/app/build/outputs/apk/release
          apk="$release_dir/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signing was configured but Gradle produced no signed APK."
            ls -l "$release_dir" || true
            exit 1
          fi

          apksigner=$(find "${ANDROID_HOME:-}/build-tools" -mindepth 2 -maxdepth 2 \
            -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found under the Android SDK build-tools."
            exit 1
          fi

          normalise() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }

          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signing/apk-certs.txt"
          apk_cert=$(awk '/certificate SHA-256 digest/ { print $NF; exit }' \
            "$RUNNER_TEMP/signing/apk-certs.txt" | normalise)

          printf '%s\n' "$KEYSTORE_PASSWORD" \
            | keytool -list -v -keystore "$RUNNER_TEMP/signing/release.jks" -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/signing/keystore-certs.txt"
          keystore_cert=$(awk '/SHA256:/ { print $2; exit }' \
            "$RUNNER_TEMP/signing/keystore-certs.txt" | normalise)

          if [ -z "$apk_cert" ] || [ "$apk_cert" != "$keystore_cert" ]; then
            echo "::error::The APK is not signed by the staged release key."
            exit 1
          fi
          echo "APK certificate matches the staged release key."

      # Which artifact ships follows from how the job was configured, not from
      # which file happens to be on disk.
      - name: Stage the APK for upload
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          release_dir=frontend/android/app/build/outputs/apk/release
          mkdir -p artifacts
          if [ "$HAS_KEYSTORE" = 'true' ]; then
            cp "$release_dir/app-release.apk" "artifacts/initiative-$VERSION.apk"
          else
            cp "$release_dir/app-release-unsigned.apk" "artifacts/initiative-$VERSION-unsigned.apk"
          fi

      - name: Remove the staged signing keystore
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/signing"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: artifacts/*.apk

  docker-public:
    needs: decide
    permissions:
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      name: release
      labels: true
      signed: true
      build-args: |
        VERSION=${{ needs.decide.outputs.version }}
        VITE_API_URL=/api/v1
      tags: |
        type=semver,pattern={{version}}${{ inputs.version && format(',value=v{0}', inputs.version) || '' }}
        type=semver,pattern={{major}}.{{minor}}${{ inputs.version && format(',value=v{0}', inputs.version) || '' }}
        type=semver,pattern={{major}}${{ inputs.version && format(',value=v{0}', inputs.version) || '' }}
        type=raw,value=latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [decide, build-android, docker-public]
    # Run even when build-android was *skipped* (web-only release). Only the Docker manifest
    # must have succeeded; the APK is attached opportunistically below. But a build-android
    # *failure* on a native-change release is a hard error — publishing then would advertise
    # "updates over the air" while the bumped minNativeVersion blocks OTA and no new APK exists.
    if: always() && needs.docker-public.result == 'success' && needs.build-android.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sync the Docker Hub repository overview from .github/DOCKERHUB.md so the published
      # description stays in version control. The description-update API needs a token with
      # write scope (or the account password); if this 401s, widen DOCKERHUB_TOKEN's scope.
      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Self-hosted project management for friend groups, gaming communities, and small teams"
          readme-filepath: ./.github/DOCKERHUB.md

      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: artifacts

      - name: Extract changelog for version
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          APK_BUILT: ${{ needs.build-android.result == 'success' }}
        run: |
          VERSION="${{ needs.decide.outputs.version }}"
          echo "Extracting changelog for version $VERSION"

          # Extract the section for this version from CHANGELOG.md
          # Matches ## [X.Y.Z] and captures until the next ## [ or end of file
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") || index($0, "[v" ver "]")) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md)

          # If no version-specific section found, provide fallback
          if [ -z "$CHANGELOG" ]; then
            echo "No changelog section found for version $VERSION"
            CHANGELOG="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi

          # The native app is only rebuilt when the native shell changed (see the `decide`
          # job). Web-only releases ship no new APK — existing installs update over the air,
          # and an updater tracking these releases falls back to the last one that carried an
          # APK. Attaching an older APK here instead reads as a new version to those updaters,
          # which then reinstall the app they already have.
          if [ "$APK_BUILT" = "true" ]; then
            ANDROID_SECTION="### Android App
          Download the APK from the assets below and install on your Android device."
          else
            ANDROID_SECTION="### Android App
          No new app build this release — installed apps update automatically over the air on next launch."
          fi

          # Build full release body with changelog + download info
          cat > release_body.md << ENDOFBODY
          $CHANGELOG

          ---

          ## Downloads

          $ANDROID_SECTION

          ### Docker Image
          \`\`\`bash
          docker pull ${IMAGE_NAME}:${VERSION}
          \`\`\`

          Or use \`latest\` tag. View on [Docker Hub](https://hub.docker.com/r/${DOCKERHUB_USERNAME}/initiative).
          ENDOFBODY

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' release_body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*.apk
          body_path: release_body.md
          draft: false
          prerelease: false

      - name: Discord Webhook Action
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: ":tada: Initiative ${{ needs.decide.outputs.version }} has been published! Download the apk from the [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}) or pull the Docker image with tag `${{ needs.decide.outputs.version }}` from Docker Hub."
